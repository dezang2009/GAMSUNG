<meta name="claude:viewport-fit-sides" content="cover">
<title>우리의 2026</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Pen+Script&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: 필름 한 롤을 풀어놓듯, 가운데 실선을 따라 열두 달의 사진이 좌우로 번갈아 놓인다 */
:root{
  --paper:#ece4e0; --paper-deep:#e0d5cf; --ink:#3a2e31; --ink-soft:#7d6a6d;
  --stamp:#e2701f; --sage:#74836c; --frame:#fbf8f5; --line:#c9bab4;
  --shadow:rgba(58,46,49,.2); --tape:rgba(226,201,150,.75);
  --f-display:'Gowun Batang','Noto Serif KR','Apple SD Gothic Neo',serif;
  --f-hand:'Nanum Pen Script','Gowun Batang',cursive;
  --f-stamp:'Share Tech Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#1f191a; --paper-deep:#2a2223; --ink:#eadfd9; --ink-soft:#a8979a;
  --stamp:#f08a3c; --sage:#9aab90; --frame:#e9e2dc; --line:#4a3d3f;
  --shadow:rgba(0,0,0,.5); --tape:rgba(190,165,115,.6); color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#1f191a; --paper-deep:#2a2223; --ink:#eadfd9; --ink-soft:#a8979a;
  --stamp:#f08a3c; --sage:#9aab90; --frame:#e9e2dc; --line:#4a3d3f;
  --shadow:rgba(0,0,0,.5); --tape:rgba(190,165,115,.6); color-scheme:dark }

body{ background:var(--paper); color:var(--ink); font-family:var(--f-display); font-size:17px; line-height:1.8;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:0 }
.wrap{ max-width:920px; margin:0 auto; display:flex; flex-direction:column; gap:72px; padding-block:56px 96px }

/* 표지 */
.cover{ display:flex; flex-direction:column; gap:10px; align-items:flex-start }
.cover .roll{ font-family:var(--f-stamp); color:var(--stamp); letter-spacing:.14em; font-size:14px }
.cover h1{ font-size:clamp(44px, 9vw, 84px); line-height:1.1; margin:0; font-weight:700; text-wrap:balance }
.cover h1 span{ font-family:var(--f-hand); font-weight:400; color:var(--sage); font-size:1.15em }
.cover .names{ font-family:var(--f-hand); font-size:30px; color:var(--ink-soft); line-height:1.3 }
.cover p{ margin:0; max-width:34em; color:var(--ink-soft) }

/* 열두 달 */
.months{ position:relative; display:flex; flex-direction:column; gap:88px }
.months::before{ content:""; position:absolute; left:50%; top:0; bottom:0; border-left:1px dashed var(--line) }
.month{ position:relative; display:grid; grid-template-columns:1fr 1fr; gap:56px; align-items:center }
.month > *{ min-width:0 }
.month:nth-child(even) .photos{ order:2 }
.photos{ display:flex; flex-wrap:wrap; gap:18px; justify-content:center }
.story{ display:flex; flex-direction:column; gap:6px }
.story .num{ font-family:var(--f-hand); font-size:64px; line-height:1; color:var(--sage) }
.story h2{ font-size:22px; margin:0; font-weight:700; text-wrap:balance }
.story p{ margin:0; color:var(--ink-soft); max-width:26em }
.month.pending .story p{ font-family:var(--f-hand); font-size:26px; line-height:1.4 }

/* 사진 */
.photo{ background:var(--frame); padding:10px 10px 14px; width:min(230px, 100%); box-shadow:0 6px 18px var(--shadow);
  position:relative; margin:0; display:flex; flex-direction:column; gap:8px; transform:rotate(-2deg) }
.photo:nth-child(even){ transform:rotate(2.5deg) }
.photo::before{ content:""; position:absolute; top:-11px; left:50%; width:74px; height:22px; margin-left:-37px;
  background:var(--tape); transform:rotate(-3deg) }
.photo .shot{ position:relative; aspect-ratio:4/5; max-width:100%; overflow:hidden; background:var(--paper-deep);
  display:flex; align-items:center; justify-content:center }
.photo .shot img{ width:100%; height:100%; object-fit:cover; display:block }
.photo .empty{ font-family:var(--f-hand); font-size:24px; color:var(--ink-soft) }
.photo .date{ position:absolute; right:8px; bottom:6px; font-family:var(--f-stamp); font-size:13px; color:var(--stamp);
  text-shadow:0 0 6px var(--stamp); letter-spacing:.08em }
.photo figcaption{ font-family:var(--f-hand); font-size:22px; line-height:1.2; color:#3a2e31; min-height:1.2em; text-align:center }

/* 편지 */
.letter{ background:var(--paper-deep); padding:40px clamp(20px, 6vw, 56px); display:flex; flex-direction:column; gap:14px;
  box-shadow:0 6px 18px var(--shadow) }
.letter h2{ font-family:var(--f-hand); font-weight:400; font-size:40px; margin:0; color:var(--sage); line-height:1.2 }
.letter p{ margin:0; max-width:34em }
.letter .sign{ font-family:var(--f-hand); font-size:28px; align-self:flex-end; color:var(--ink-soft) }

@media (max-width:640px){
  .wrap{ gap:56px; padding-block:40px 72px }
  .months{ gap:64px }
  .months::before{ display:none }
  .month{ grid-template-columns:1fr; gap:22px }
  .month:nth-child(even) .photos{ order:0 }
}
@media print{
  .month, .letter{ break-inside:avoid }
  .photo, .letter{ box-shadow:none; border:1px solid var(--line) }
}
</style>

<div class="wrap">
  <header class="cover">
    <div class="roll">ROLL 2026 · 12 EXP</div>
    <h1>우리의 <span>2026</span></h1>
    <div class="names" id="names"></div>
    <p id="intro"></p>
  </header>
  <main class="months" id="months"></main>
  <section class="letter" id="letter"></section>
</div>

<script>
/* ───── 여기만 채우면 됩니다 ─────
   photos의 src에 사진 파일 경로, date에 필름 날짜, cap에 한 줄 메모. */
const BOOK = {
  names: '이름 ♡ 이름',
  intro: '아직 견본이에요. 사진과 이야기를 보내주시면 이 자리에 채워집니다.',
  months: [
    { m:1,  title:'제목을 적어요', text:'새해 첫날, 우리 어디서 뭘 했더라?',        photos:[{src:'',date:"'26 1 1",cap:''}] },
    { m:2,  title:'제목을 적어요', text:'추웠던 날 같이 먹은 것, 같이 본 것.',       photos:[{src:'',date:"'26 2 14",cap:''}] },
    { m:3,  title:'제목을 적어요', text:'봄이 오던 무렵의 기억.',                    photos:[{src:'',date:"'26 3 --",cap:''},{src:'',date:"'26 3 --",cap:''}] },
    { m:4,  title:'제목을 적어요', text:'꽃 보러 간 날이 있었나요?',                 photos:[{src:'',date:"'26 4 --",cap:''}] },
    { m:5,  title:'제목을 적어요', text:'가장 많이 웃었던 하루.',                    photos:[{src:'',date:"'26 5 --",cap:''}] },
    { m:6,  title:'제목을 적어요', text:'장마철, 우산 하나로 걷던 길.',              photos:[{src:'',date:"'26 6 --",cap:''}] },
    { m:7,  title:'제목을 적어요', text:'여름 여행의 한 장면.',                      photos:[{src:'',date:"'26 7 --",cap:''},{src:'',date:"'26 7 --",cap:''}] },
    { m:8,  title:'제목을 적어요', text:'더위를 피해 숨어든 곳.',                    photos:[{src:'',date:"'26 8 --",cap:''}] },
    { m:9,  title:'제목을 적어요', text:'선선해진 저녁의 산책.',                     photos:[{src:'',date:"'26 9 --",cap:''}] },
    { m:10, title:'제목을 적어요', text:'가을에 같이 간 곳.',                        photos:[{src:'',date:"'26 10 --",cap:''}] },
    { m:11, title:'제목을 적어요', text:'요즘의 우리.',                              photos:[{src:'',date:"'26 11 --",cap:''}] },
    { m:12, pending:true, title:'아직 찍는 중', text:'마지막 한 컷은 남겨둘게. 12월은 같이 채우자.', photos:[] },
  ],
  letter: { title:'한 해의 끝에서', body:['여기에 전하고 싶은 말을 적어요.'], sign:'— 이름' },
};

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
document.getElementById('names').textContent = BOOK.names;
document.getElementById('intro').textContent = BOOK.intro;
document.getElementById('months').innerHTML = BOOK.months.map(mo => `
  <article class="month${mo.pending ? ' pending' : ''}">
    <div class="photos">${mo.photos.map(p => `
      <figure class="photo">
        <div class="shot">
          ${p.src ? `<img src="${esc(p.src)}" alt="${esc(p.cap || mo.m + '월의 사진')}">` : `<span class="empty">사진 자리</span>`}
          <span class="date">${esc(p.date)}</span>
        </div>
        <figcaption>${esc(p.cap)}</figcaption>
      </figure>`).join('')}
    </div>
    <div class="story">
      <div class="num">${mo.m}월</div>
      <h2>${esc(mo.title)}</h2>
      <p>${esc(mo.text)}</p>
    </div>
  </article>`).join('');
document.getElementById('letter').innerHTML =
  `<h2>${esc(BOOK.letter.title)}</h2>` +
  BOOK.letter.body.map(t => `<p>${esc(t)}</p>`).join('') +
  `<div class="sign">${esc(BOOK.letter.sign)}</div>`;
</script>
