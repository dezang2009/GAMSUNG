<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>픽셀 탐험</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-screen="menu">
  <main id="menu">
    <div class="menu-inner">
      <header class="banner px">
        <canvas id="hero" width="96" height="36"></canvas>
        <div>
          <h1>탐험지 선택</h1>
          <p class="menu-sub">가고 싶은 지역을 골라 입장하세요.</p>
        </div>
      </header>
      <ul id="region-list"></ul>
    </div>
  </main>

  <canvas id="game"></canvas>

  <div id="hud">
    <span id="hud-name"></span>
    <button id="exit-btn" type="button">나가기</button>
  </div>

  <div id="joy" aria-label="가상 조이스틱">
    <div id="joy-base">
      <div id="joy-knob"></div>
    </div>
  </div>

  <script src="js/sprites.js"></script>
  <script src="js/regions.js"></script>
  <script src="js/monster-data.js"></script>
  <script src="js/world.js"></script>
  <script src="js/monsters.js"></script>
  <script src="js/input.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
