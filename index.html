<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f7f9" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>PROJECT EDEN</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app" class="app">

    <!-- 상단: 상태 정보 -->
    <header class="hud" aria-label="상태 정보">
      <ul class="stats stats--primary" id="resources" aria-label="보유 자원">
        <li class="stat" data-resource="metal"><span class="stat__label">금속</span><span class="stat__value" data-value>0</span></li>
        <li class="stat" data-resource="crystal"><span class="stat__label">크리스털</span><span class="stat__value" data-value>0</span></li>
        <li class="stat" data-resource="water"><span class="stat__label">물</span><span class="stat__value" data-value>0</span></li>
        <li class="stat" data-resource="food"><span class="stat__label">식량</span><span class="stat__value" data-value>0</span></li>
      </ul>
      <ul class="stats stats--secondary" aria-label="에너지 및 행성 환경">
        <li class="stat stat--energy">
          <span class="stat__label">에너지 <span class="stat__rate" id="energy-rate">+0/s</span></span>
          <span class="stat__value"><span id="energy-current">0</span><span class="stat__sub">/<span id="energy-max">0</span></span></span>
          <span class="bar"><span class="bar__fill" id="energy-bar"></span></span>
        </li>
        <li class="stat"><span class="stat__label">기온</span><span class="stat__value" id="env-temp">-</span></li>
        <li class="stat"><span class="stat__label">대기</span><span class="stat__value" id="env-air">-</span></li>
        <li class="stat"><span class="stat__label">수분</span><span class="stat__value" id="env-water">-</span></li>
      </ul>
    </header>

    <!-- 중앙: 월드 영역 -->
    <main class="world" aria-label="월드">
      <canvas id="world-canvas" class="world__canvas"></canvas>
      <div class="world__tag">
        <span id="sector-label">SECTOR A-01</span>
        <span class="world__tag-state" id="env-state">-</span>
      </div>
    </main>

    <!-- 하단: 메인 메뉴 (기능 미연결, 선택 표시는 고정) -->
    <nav class="menu" aria-label="메인 메뉴">
      <button class="menu__btn is-active" type="button" data-menu="build" aria-current="page">
        <svg class="menu__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21h18M5 21V10l7-5 7 5v11"/><path d="M9.5 21v-6h5v6M12 5V2.5"/></svg>
        <span class="menu__label">건설</span>
      </button>
      <button class="menu__btn" type="button" data-menu="produce">
        <svg class="menu__icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.500v3M12 18.500v3M2.5 12h3M18.5 12h3M5.3 5.300l2.1 2.100M16.6 16.600l2.1 2.100M5.3 18.700l2.1-2.100M16.6 7.400l2.1-2.1"/><circle cx="12" cy="12" r="6.8"/></svg>
        <span class="menu__label">생산</span>
      </button>
      <button class="menu__btn" type="button" data-menu="research">
        <svg class="menu__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 3h5M10.5 3v6.200L5 18.500A1.7 1.7 0 006.5 21h11a1.7 1.7 0 001.5-2.500l-5.5-9.300V3"/><path d="M7.8 15h8.4"/></svg>
        <span class="menu__label">연구</span>
      </button>
      <button class="menu__btn" type="button" data-menu="planet">
        <svg class="menu__icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6.5"/><path d="M3.5 15.500c-1.5 1.8-.6 3 2.4 2.6 3-.4 7.3-2.3 10.8-4.8 3.5-2.5 5.3-5 4.3-6.2-.5-.6-1.7-.6-3.2-.2"/><path d="M8.5 9.500h3M10 13h4"/></svg>
        <span class="menu__label">행성</span>
      </button>
    </nav>
  </div>

  <script src="js/config.js"></script>
  <script src="js/world.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
