<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>픽셀 모험</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- 위: 마을/탐험 필드 -->
    <section id="field">
      <canvas id="game"></canvas>

      <div id="hud">
        <div class="hud-card">
          <span class="hud-lv" id="hud-lv">Lv.1</span>
          <div class="hud-bars">
            <div class="bar hp"><i id="hud-hp-fill"></i><span id="hud-hp-text"></span></div>
            <div class="bar mp"><i id="hud-mp-fill"></i><span id="hud-mp-text"></span></div>
          </div>
        </div>
        <div class="hud-right">
          <span class="pill"><b class="coin"></b><span id="hud-gold">0</span></span>
          <span class="pill" id="hud-loc"><b class="dot"></b><span id="hud-loc-name"></span></span>
          <button class="pill pill-btn" id="sys-btn" type="button">저장</button>
        </div>
      </div>

      <div id="toast" hidden></div>

      <!-- NPC 대화창: 필드 아래쪽에 뜬다 -->
      <section id="dialog" hidden>
        <div class="dialog-card">
          <span class="dialog-name" id="dialog-name"></span>
          <p id="dialog-text"></p>
          <span class="dialog-more" id="dialog-more" aria-hidden="true">▼</span>
        </div>
      </section>

      <!-- 메뉴 화면: 필드 위에 덮인다 -->
      <section id="screen" hidden>
        <header class="screen-bar">
          <button id="screen-back" type="button">‹ 뒤로</button>
          <h2 id="screen-title"></h2>
        </header>
        <div id="screen-body"></div>
      </section>

      <!-- 대장간: 위쪽은 장비/재료 선택 (아래쪽 메뉴 자리에 강화 진행 장면이 나온다) -->
      <section id="forge" hidden>
        <header class="fg-head"><h2>대장간</h2><p>강화할 장비와 재료를 골라 주세요</p></header>
        <div class="fg-lists">
          <div class="fp-col" id="fp-gear"></div>
          <div class="fp-col" id="fp-mats"></div>
        </div>
      </section>

      <!-- 전투 화면 (포켓몬 스타일): 필드 전체를 덮는다 -->
      <section id="battle" hidden>
        <div class="bt-box bt-box-e">
          <div class="bt-row"><span class="bt-name" id="bt-e-name"></span><span class="bt-lv" id="bt-e-lv"></span></div>
          <div class="bt-hp" id="bt-e-bar"><i></i></div>
        </div>
        <div class="bt-slot bt-slot-e"><div class="bt-plat"></div><canvas id="bt-enemy" class="bt-sprite"></canvas></div>
        <div class="bt-slot bt-slot-h"><div class="bt-plat"></div><canvas id="bt-hero" class="bt-sprite"></canvas></div>
        <div class="bt-box bt-box-h">
          <div class="bt-row"><span class="bt-name" id="bt-h-name"></span><span class="bt-lv" id="bt-h-lv"></span></div>
          <div class="bt-hp" id="bt-h-bar"><i></i></div>
          <div class="bt-num" id="bt-h-num"></div>
          <div class="bt-hp bt-mp" id="bt-h-mpbar"><i></i></div>
        </div>
        <div class="bt-msg" id="bt-msg"><span id="bt-text"></span><span class="bt-more">▼</span></div>
      </section>
    </section>

    <!-- 아래: 메인 메뉴 + 조이스틱 패드 -->
    <nav id="dock" aria-label="메인 메뉴">
      <div class="dock-grid">
        <button class="dock-btn c-coral" type="button" data-menu="equip">
          <span class="dock-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 4 5v6c0 5 3.5 8.5 8 11 4.5-2.5 8-6 8-11V5z"/><path d="M12 7v9"/><path d="M8.5 10.5h7"/></svg></span>
          <span class="dock-label">장비</span>
        </button>
        <button class="dock-btn c-amber" type="button" data-menu="bag">
          <span class="dock-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg></span>
          <span class="dock-label">가방</span>
        </button>
        <button class="dock-btn c-mint" type="button" data-menu="party">
          <span class="dock-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>
          <span class="dock-label">동료</span>
        </button>
        <button class="dock-btn c-blue" type="button" data-menu="explore">
          <span class="dock-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m16.24 7.76-2.12 6.36-6.36 2.12 2.12-6.36 6.36-2.12z"/></svg></span>
          <span class="dock-label">탐험</span>
        </button>
        <button class="dock-btn c-violet" type="button" data-menu="dex">
          <span class="dock-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span>
          <span class="dock-label">도감</span>
        </button>
        <button class="dock-btn c-sky" type="button" data-menu="char">
          <span class="dock-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
          <span class="dock-label">캐릭터</span>
        </button>
      </div>
      <!-- 전투 중에는 메인 메뉴 대신 전투 명령이 나온다 -->
      <div id="battle-cmds" hidden></div>

      <!-- 대장간 중에는 강화 진행 장면 -->
      <div id="forge-panel" hidden>
        <div class="fg-scene">
          <div class="fg-wall"></div>
          <div class="fg-floor"></div>
          <div class="fg-glow"></div>
          <canvas id="fg-smith" class="fg-smith"></canvas>
          <div class="fg-stage">
            <div class="fg-stars" id="fg-stars"></div>
            <canvas id="fg-gear" class="fg-gear"></canvas>
            <canvas id="fg-anvil" class="fg-anvil"></canvas>
          </div>
          <div class="fg-info" id="fg-info"></div>
          <div class="fg-fx" id="fg-fx"></div>
          <div class="fg-msg" id="fg-msg"></div>
        </div>
      </div>

      <div id="pad" data-mode="field">
        <!-- 왼쪽: 고정 조이스틱 -->
        <div id="joy-zone" aria-label="조이스틱">
          <div id="joy-base"><div id="joy-knob"></div></div>
        </div>
        <!-- 화면/목록을 조작할 때 조이스틱 대신 나오는 방향 버튼 -->
        <div id="dpad" aria-label="방향 버튼">
          <button class="dp dp-up" type="button" data-nav="up" aria-label="위"><svg viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></svg></button>
          <button class="dp dp-left" type="button" data-nav="left" aria-label="왼쪽"><svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg></button>
          <button class="dp dp-right" type="button" data-nav="right" aria-label="오른쪽"><svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button>
          <button class="dp dp-down" type="button" data-nav="down" aria-label="아래"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
        </div>
        <!-- 오른쪽 버튼: 대화(대상 옆에서만) / 다음 / 확인, 그리고 뒤로 -->
        <div id="act-cluster">
          <button id="back-btn" type="button" hidden>뒤로</button>
          <button id="act-btn" type="button" hidden>
            <span class="act-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span>
            <span class="act-label">대화</span>
          </button>
        </div>
      </div>
    </nav>
  </div>

  <!-- 게임 메인(타이틀) 화면: 세이브 파일 3개 -->
  <main id="title">
    <div class="title-inner">
      <canvas id="title-art" width="112" height="44"></canvas>
      <h1>픽셀 모험</h1>
      <p class="title-sub">이어서 할 파일을 고르거나 빈 파일로 새로 시작하세요.</p>
      <ul id="title-slots"></ul>
      <p class="title-note">진행은 10분마다 자동으로 저장돼요.</p>
    </div>
  </main>

  <script src="js/core/util.js"></script>
  <script src="js/core/save-store.js"></script>
  <script src="js/core/events.js"></script>
  <script src="js/core/state.js"></script>
  <script src="js/core/game.js"></script>
  <script src="js/core/stats.js"></script>
  <script src="js/gfx/sprites.js"></script>
  <script src="js/gfx/village-sprites.js"></script>
  <script src="js/gfx/monster-sprites.js"></script>
  <script src="js/gfx/item-sprites.js"></script>
  <script src="js/data/regions.js"></script>
  <script src="js/data/monster-data.js"></script>
  <script src="js/data/monster-roster.js"></script>
  <script src="js/data/progression.js"></script>
  <script src="js/data/forge.js"></script>
  <script src="js/data/skills.js"></script>
  <script src="js/data/items.js"></script>
  <script src="js/data/drops.js"></script>
  <script src="js/world/world.js"></script>
  <script src="js/world/monsters.js"></script>
  <script src="js/world/npcs.js"></script>
  <script src="js/systems/world.js"></script>
  <script src="js/systems/exploration.js"></script>
  <script src="js/systems/battle.js"></script>
  <script src="js/systems/character.js"></script>
  <script src="js/systems/companion.js"></script>
  <script src="js/systems/inventory.js"></script>
  <script src="js/systems/starter.js"></script>
  <script src="js/systems/equipment.js"></script>
  <script src="js/systems/economy.js"></script>
  <script src="js/systems/shop.js"></script>
  <script src="js/systems/crafting.js"></script>
  <script src="js/systems/collection.js"></script>
  <script src="js/systems/quest.js"></script>
  <script src="js/systems/save.js"></script>
  <script src="js/ui/input.js"></script>
  <script src="js/ui/screens.js"></script>
  <script src="js/ui/hud.js"></script>
  <script src="js/ui/explore-screen.js"></script>
  <script src="js/ui/dialog.js"></script>
  <script src="js/ui/toast.js"></script>
  <script src="js/ui/bag-screen.js"></script>
  <script src="js/ui/character-screen.js"></script>
  <script src="js/ui/equip-screen.js"></script>
  <script src="js/ui/system-screen.js"></script>
  <script src="js/ui/forge-screen.js"></script>
  <script src="js/ui/battle-screen.js"></script>
  <script src="js/ui/controls.js"></script>
  <script src="js/ui/title-screen.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
