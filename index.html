<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>감성 카페 타이쿤</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: 카페 매장(손님 → 머신·쟁반 → 메뉴판)을 왼쪽에, 상점 장부를 오른쪽에. 좁은 화면에서는 위아래로 쌓인다. */
:root{
  --bg:#E9ECE2; --surface:#F8F9F3; --surface-2:#F0F2EA; --ink:#23281F; --muted:#666E60; --line:#D3D8CA;
  --accent:#2E6A4E; --accent-ink:#F4FAF5; --caramel:#B9772F; --wood:#8B5D3D; --wood-2:#A8744F;
  --good:#3C8C58; --warn:#D0951A; --bad:#C0432F; --wall:#DCE2D3; --shadow:0 1px 0 rgba(35,40,31,.06), 0 6px 18px -10px rgba(35,40,31,.35);
  --display:"Jua","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141713; --surface:#1D211B; --surface-2:#232821; --ink:#E7EBE1; --muted:#9BA394; --line:#323A2F;
  --accent:#73C49A; --accent-ink:#0F1A13; --caramel:#E3A563; --wood:#5C3D29; --wood-2:#734D34;
  --good:#6CC28A; --warn:#E7B84B; --bad:#EE7A63; --wall:#262C24; --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 20px -10px rgba(0,0,0,.7);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#141713; --surface:#1D211B; --surface-2:#232821; --ink:#E7EBE1; --muted:#9BA394; --line:#323A2F;
  --accent:#73C49A; --accent-ink:#0F1A13; --caramel:#E3A563; --wood:#5C3D29; --wood-2:#734D34;
  --good:#6CC28A; --warn:#E7B84B; --bad:#EE7A63; --wall:#262C24; --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 20px -10px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 28px;
  -webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--caramel);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.app{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:12px}

/* HUD */
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;box-shadow:var(--shadow)}
.brand{font-family:var(--display);font-size:24px;letter-spacing:-.01em;color:var(--accent);line-height:1;white-space:nowrap}
.brand small{display:block;font-family:var(--body);font-size:11px;letter-spacing:.12em;color:var(--muted);margin-top:4px}
.stats{display:flex;flex-wrap:wrap;gap:6px 18px}
.stat{display:flex;flex-direction:column;line-height:1.15}
.stat .lbl{font-size:11px;color:var(--muted);letter-spacing:.06em}
.stat b{font-family:var(--display);font-weight:400;font-size:19px}
.stat b.money{color:var(--caramel)}
.clock{flex:1 1 200px;display:flex;align-items:center;gap:10px;min-width:0}
.clockbar{flex:1;height:10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.clockbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--caramel),var(--accent));transform-origin:left}
.clock span{font-size:13px;color:var(--muted);white-space:nowrap}
.iconbtn{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:6px 10px;font-size:13px}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:12px;align-items:start}
@media (max-width:920px){.layout{grid-template-columns:minmax(0,1fr)}}

/* Floor */
.floor{display:flex;flex-direction:column;gap:12px;min-width:0}
.scene{position:relative;height:118px;border-radius:14px;overflow:hidden;border:1px solid var(--line);
  background:linear-gradient(var(--wall),var(--wall)) ;}
.scene .window{position:absolute;left:5%;top:14px;width:30%;max-width:240px;height:70px;border-radius:8px 8px 4px 4px;border:5px solid var(--wood-2);background:#BFE3F0;
  box-shadow:inset 0 -12px 0 rgba(255,255,255,.12)}
.scene .window::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 48%,var(--wood-2) 48%,var(--wood-2) 52%,transparent 52%)}
.scene .floorline{position:absolute;left:0;right:0;bottom:0;height:16px;background:repeating-linear-gradient(90deg,var(--wood) 0 38px,var(--wood-2) 38px 40px)}
.scene .sign{position:absolute;right:14px;top:12px;font-family:var(--display);font-size:13px;color:var(--muted);text-align:right;line-height:1.3}
.scene .sign b{display:block;font-weight:400;font-size:20px;color:var(--accent)}
.decor{position:absolute;font-size:30px;line-height:1;filter:drop-shadow(0 3px 2px rgba(0,0,0,.18));animation:pop .5s ease-out}
.decor.sway{animation:sway 3.2s ease-in-out infinite}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
.panel h2{font-family:var(--display);font-weight:400;font-size:17px;margin:0 0 8px;display:flex;align-items:baseline;gap:8px}
.panel h2 small{font-family:var(--body);font-size:12px;color:var(--muted)}

.queue{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.slot{position:relative;min-height:clamp(118px,22vw,150px);border-radius:12px;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;background:transparent;padding:0}
.cust{border:1px solid var(--line);border-style:solid;background:var(--surface-2);flex-direction:column;justify-content:flex-start;gap:6px;padding:10px 8px 12px;color:var(--ink);animation:walkin .35s ease-out;text-align:center}
.cust.ready{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.cust .face{font-size:38px;line-height:1}
.bubble{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px 6px;display:flex;flex-wrap:wrap;justify-content:center;gap:3px;min-height:34px;align-items:center}
.bubble span{font-size:22px;line-height:1;opacity:.45;filter:grayscale(.7);transition:opacity .15s,filter .15s}
.bubble span.ok{opacity:1;filter:none}
.pat{width:100%;height:7px;border-radius:99px;background:var(--line);overflow:hidden}
.pat i{display:block;height:100%;width:100%;background:var(--good)}
.cust .tag{font-size:12px;color:var(--muted)}
.cust.shake{animation:shake .35s}
@keyframes walkin{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

.counter{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
@media (max-width:560px){.counter{grid-template-columns:minmax(0,1fr)}}
.stations{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.station{border:1px solid var(--line);border-radius:10px;background:var(--surface-2);height:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:12px;color:var(--muted);position:relative;overflow:hidden}
.station .ic{font-size:26px;line-height:1}
.station .prog{position:absolute;left:0;bottom:0;height:5px;background:var(--caramel);width:0}
.station.busy{color:var(--ink)}
.station.busy .ic{animation:wob .6s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.tray{display:flex;flex-wrap:wrap;gap:8px;min-height:72px;align-content:flex-start;background:repeating-linear-gradient(135deg,var(--surface-2) 0 10px,var(--surface) 10px 20px);border:1px solid var(--line);border-radius:10px;padding:8px}
.tray button{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:52px;height:52px;font-size:26px;display:flex;align-items:center;justify-content:center;animation:pop .25s ease-out;padding:0}
.tray .empty{color:var(--muted);font-size:13px;align-self:center;padding:0 4px}

.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.mbtn{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 8px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 2px 0 var(--line);transition:transform .08s}
.mbtn:active{transform:translateY(2px);box-shadow:none}
.mbtn:disabled{opacity:.5;cursor:not-allowed}
.mbtn .ic{font-size:30px;line-height:1.1}
.mbtn .nm{font-family:var(--display);font-size:15px}
.mbtn .meta{font-size:12px;color:var(--muted)}
.mbtn kbd{position:absolute;top:6px;left:7px;font-family:var(--body);font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px;line-height:1.4}
.hint{margin:0;font-size:13px;color:var(--muted)}

/* Shop */
.shop{position:sticky;top:12px;display:flex;flex-direction:column;gap:10px}
@media (max-width:920px){.shop{position:static}}
.tabs{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px}
.tabs button{flex:1;border:0;background:transparent;border-radius:8px;padding:7px 4px;font-size:14px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:700}
.items{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2)}
.item .ic{font-size:26px;text-align:center}
.item .nm{font-family:var(--display);font-size:15px;line-height:1.2}
.item .ds{font-size:12px;color:var(--muted);line-height:1.35}
.buy{border:0;border-radius:9px;padding:7px 10px;background:var(--accent);color:var(--accent-ink);font-size:13px;font-weight:700;white-space:nowrap}
.buy:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}
.buy.done{background:transparent;color:var(--good);border:1px solid var(--line)}
.ledger{font-size:13px;color:var(--muted);display:grid;grid-template-columns:1fr auto;gap:2px 10px}
.ledger b{color:var(--ink);font-weight:400}

/* Effects */
.float{position:fixed;pointer-events:none;font-family:var(--display);font-size:20px;color:var(--caramel);text-shadow:0 1px 0 var(--surface);animation:rise 1.1s ease-out forwards;z-index:30;transform:translateX(-50%)}
.float.bad{color:var(--bad)}
@keyframes rise{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-56px}}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:8px 14px;border-radius:99px;font-size:14px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1}

.modal{position:fixed;inset:0;background:rgba(15,18,14,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{background:var(--surface);color:var(--ink);border-radius:18px;max-width:430px;width:100%;padding:22px 20px;box-shadow:0 20px 60px -20px rgba(0,0,0,.6);max-height:100%;overflow:auto}
.sheet h1{font-family:var(--display);font-weight:400;font-size:28px;margin:0 0 4px;color:var(--accent);text-wrap:balance}
.sheet p{margin:6px 0;color:var(--muted)}
.sheet ol{margin:10px 0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.sheet .rows{display:grid;grid-template-columns:1fr auto;gap:5px 12px;margin:14px 0;font-size:15px}
.sheet .rows .neg{color:var(--bad)}
.sheet .rows .tot{font-family:var(--display);font-size:19px;border-top:1px solid var(--line);padding-top:8px}
.sheet .actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.cta{flex:1;border:0;border-radius:12px;padding:12px 14px;background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-size:18px}
.ghost{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:transparent;font-size:14px}

@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="hud">
    <div class="brand">감성 카페<small>CAFÉ TYCOON</small></div>
    <div class="stats">
      <div class="stat"><span class="lbl">자금</span><b class="money num" id="money">₩0</b></div>
      <div class="stat"><span class="lbl">영업일</span><b class="num" id="day">1일차</b></div>
      <div class="stat"><span class="lbl">평점</span><b class="num" id="stars">★3.0</b></div>
      <div class="stat"><span class="lbl">감성</span><b class="num" id="vibe">0</b></div>
    </div>
    <div class="clock"><div class="clockbar"><i id="clockfill"></i></div><span id="clocktxt" class="num">오픈 전</span></div>
    <button class="iconbtn" id="soundBtn" type="button" aria-pressed="true">소리 켬</button>
  </header>

  <main class="layout">
    <section class="floor">
      <div class="scene" id="scene" aria-hidden="true">
        <div class="window" id="win"></div>
        <div class="sign"><span>감성 지수</span><b id="vibeSign">Lv.0</b></div>
        <div class="floorline"></div>
      </div>

      <div class="panel">
        <h2>손님 <small id="queueInfo">주문한 메뉴가 쟁반에 다 있으면 손님을 눌러 서빙</small></h2>
        <div class="queue" id="queue"></div>
      </div>

      <div class="counter">
        <div class="panel">
          <h2>커피 머신 <small id="stInfo"></small></h2>
          <div class="stations" id="stations"></div>
        </div>
        <div class="panel">
          <h2>쟁반 <small id="trayInfo"></small></h2>
          <div class="tray" id="tray"></div>
        </div>
      </div>

      <div class="panel">
        <h2>메뉴판 <small>눌러서 제조 · 숫자키 1–7</small></h2>
        <div class="menu" id="menu"></div>
      </div>
      <p class="hint">쟁반의 음료를 누르면 버립니다. 손님이 기다리다 떠나면 평점이 떨어져요.</p>
    </section>

    <aside class="shop">
      <div class="panel">
        <div class="tabs" role="tablist">
          <button type="button" role="tab" id="tab-menu" aria-selected="true" data-tab="menu">메뉴 개발</button>
          <button type="button" role="tab" id="tab-equip" aria-selected="false" data-tab="equip">설비·직원</button>
          <button type="button" role="tab" id="tab-decor" aria-selected="false" data-tab="decor">인테리어</button>
        </div>
        <div class="items" id="items" style="margin-top:10px"></div>
      </div>
      <div class="panel">
        <h2>오늘의 장부</h2>
        <div class="ledger" id="ledger"></div>
      </div>
    </aside>
  </main>
</div>
<div class="toast" id="toast" role="status"></div>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>

<script>
(() => {
'use strict';
const DAY_LEN = 80;          // 하루 영업 시간(초)
const TRAY_MAX = 6;
const SAVE_KEY = 'gamsung-cafe-v1';

const MENU = [
  {id:'ame',     icon:'☕', name:'아메리카노', price:3000, time:2.0, unlock:0},
  {id:'latte',   icon:'🥛', name:'카페라떼',   price:4000, time:2.8, unlock:15000},
  {id:'matcha',  icon:'🍵', name:'말차라떼',   price:4800, time:3.2, unlock:45000},
  {id:'straw',   icon:'🍓', name:'딸기라떼',   price:5500, time:3.6, unlock:90000},
  {id:'ade',     icon:'🍹', name:'자몽에이드', price:5800, time:3.0, unlock:160000},
  {id:'croffle', icon:'🧇', name:'크로플',     price:6500, time:4.5, unlock:260000},
  {id:'cake',    icon:'🍰', name:'치즈케이크', price:7000, time:4.0, unlock:400000},
];
const M = Object.fromEntries(MENU.map(m => [m.id, m]));

const DECOR = [
  {id:'plant', icon:'🪴', name:'몬스테라 화분', cost:8000,   vibe:1,  pos:[40,52], sway:true},
  {id:'light', icon:'💡', name:'전구 조명',     cost:22000,  vibe:2,  pos:[47,8]},
  {id:'lp',    icon:'📻', name:'LP 플레이어',   cost:55000,  vibe:3,  pos:[55,56]},
  {id:'art',   icon:'🖼️', name:'액자 그림',     cost:110000, vibe:4,  pos:[64,18]},
  {id:'sofa',  icon:'🛋️', name:'벨벳 소파',     cost:220000, vibe:6,  pos:[72,56]},
  {id:'cat',   icon:'🐈', name:'가게 고양이',   cost:450000, vibe:9,  pos:[16,70]},
  {id:'neon',  icon:'🌙', name:'네온 사인',     cost:800000, vibe:12, pos:[78,10], sway:true},
];

const UPG = [
  {id:'machine', icon:'⚙️', name:'커피 머신 추가', max:4,
    cost:v => [0,18000,70000,200000][v], desc:v => `동시에 ${v}잔 → ${v+1}잔 제조`},
  {id:'speed', icon:'⚡', name:'그라인더 업그레이드', max:6,
    cost:v => Math.round(12000*Math.pow(2.1,v)/1000)*1000, desc:v => `제조 속도 ×${speedMul(v).toFixed(1)} → ×${speedMul(v+1).toFixed(1)}`},
  {id:'seats', icon:'🪑', name:'좌석 늘리기', max:6,
    cost:v => [0,0,0,25000,80000,220000][v], desc:v => `손님 자리 ${v} → ${v+1}`},
  {id:'bell', icon:'🔔', name:'진동벨 & 웰컴 쿠키', max:5,
    cost:v => Math.round(15000*Math.pow(2,v)/1000)*1000, desc:v => `손님 인내심 +${v*15}% → +${(v+1)*15}%`},
  {id:'staff', icon:'🧑‍🍳', name:'바리스타 알바 고용', max:3,
    cost:v => [60000,180000,450000][v], desc:v => `자동으로 제조·서빙 (일급 ₩12,000) · 현재 ${v}명`},
];
const WAGE = 12000;
const FACES = ['🧑‍🎓','👩‍💼','👨‍💻','👵','🧔','👩‍🎨','🧑‍🎤','👨‍🦰','👩‍🦱','🧑‍🔬','👴','👩‍🚀','🧑‍🏫','👨‍🎨'];

// ---------- state ----------
function newState(){ return {money:10000, day:1, stars:3.0, unlocked:['ame'], decor:[], lv:{machine:1, speed:0, seats:3, bell:0, staff:0}, best:10000}; }
function newRun(running){
  return {running, t:DAY_LEN, customers:[], tray:[], spawnT:1.2, uid:0,
    stations:Array.from({length:S.lv.machine}, () => ({item:null,p:0})),
    staff:Array.from({length:S.lv.staff}, (_,i) => ({cd:0.8+i*0.5})),
    stats:{sales:0,tips:0,served:0,lost:0}};
}
let S, R;
function speedMul(v){ return 1 + 0.25*v; }
function vibe(){ return S.decor.reduce((a,id) => a + DECOR.find(d=>d.id===id).vibe, 0); }
function rent(){ return 4000 + 1500*(S.day-1); }
function wages(){ return S.lv.staff*WAGE; }

function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }
function load(){ try{ const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if(s && s.lv && typeof s.money==='number') return s; }catch(e){} return null; }
function wipe(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }

// ---------- utils ----------
const $ = id => document.getElementById(id);
const fmt = n => '₩' + Math.round(n).toLocaleString('ko-KR');
const rnd = a => a[Math.floor(Math.random()*a.length)];
const clamp = (x,a,b) => Math.max(a, Math.min(b, x));
let toastT;
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),1600); }
function floatAt(el, text, bad){
  if(!el) return;
  const r = el.getBoundingClientRect(); const f = document.createElement('div');
  f.className = 'float' + (bad?' bad':''); f.textContent = text;
  f.style.left = (r.left + r.width/2) + 'px'; f.style.top = (r.top + 10) + 'px';
  document.body.appendChild(f); setTimeout(()=>f.remove(), 1150);
}

// ---------- sound ----------
let ac = null, soundOn = true;
function tone(f, d=.09, type='triangle', vol=.05, when=0){
  if(!soundOn) return;
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(), g=ac.createGain(), t=ac.currentTime+when;
    o.type=type; o.frequency.value=f; g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t+d+.03);
  }catch(e){}
}
const sfx = {
  coin(){ tone(988,.08); tone(1480,.16,'triangle',.05,.07); },
  done(){ tone(660,.06,'sine',.04); },
  bad(){ tone(220,.18,'sawtooth',.03); },
  buy(){ tone(523,.08); tone(659,.08,'triangle',.05,.07); tone(784,.14,'triangle',.05,.14); },
};

// ---------- gameplay ----------
function spawnInterval(){
  const vibeMul = 1 + vibe()*0.05, starMul = 0.4 + S.stars*0.2, dayMul = 1 + Math.min(S.day,20)*0.03;
  return Math.max(1.2, 6.5/(vibeMul*starMul*dayMul));
}
function spawn(){
  const used = new Set(R.customers.map(c=>c.slot));
  let slot = -1; for(let i=0;i<S.lv.seats;i++) if(!used.has(i)){ slot=i; break; }
  if(slot<0) return;
  const maxItems = Math.min(3, 1 + Math.floor((S.day-1)/2));
  let n = 1; while(n<maxItems && Math.random()<0.45) n++;
  // 새로 개발한 메뉴일수록 조금 더 자주 찾는다
  const pool = S.unlocked.flatMap((id,i) => Array(1 + Math.min(i,3)).fill(id));
  const order = Array.from({length:n}, () => rnd(pool)).sort((a,b)=>S.unlocked.indexOf(a)-S.unlocked.indexOf(b));
  const max = (22 + 7*n) * (1 + 0.15*S.lv.bell) * Math.max(0.6, 1 - (S.day-1)*0.015);
  R.customers.push({id:++R.uid, slot, face:rnd(FACES), order, pat:max, max});
  renderQueue();
}
function counts(arr){ const c={}; for(const x of arr) c[x]=(c[x]||0)+1; return c; }
function canServe(c){ const have = counts(R.tray), need = counts(c.order); return Object.keys(need).every(k => (have[k]||0) >= need[k]); }
function freeStation(){ return R.stations.find(s => !s.item); }
function inProgress(){ return R.stations.filter(s=>s.item).length; }

function brew(id, quiet){
  if(!R.running){ if(!quiet) toast('영업을 시작하면 만들 수 있어요'); return false; }
  const st = freeStation();
  if(!st){ if(!quiet) toast('머신이 모두 돌아가는 중이에요'); return false; }
  if(R.tray.length + inProgress() >= TRAY_MAX){ if(!quiet) toast('쟁반이 가득 찼어요'); return false; }
  st.item = id; st.p = 0; renderStations(); return true;
}
function serve(c, byStaff){
  if(!R.running) return;
  const el = document.querySelector(`[data-cid="${c.id}"]`);
  if(!canServe(c)){
    if(!byStaff){ toast('주문한 메뉴가 쟁반에 아직 다 없어요'); if(el){ el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); } }
    return;
  }
  for(const id of c.order) R.tray.splice(R.tray.indexOf(id),1);
  const ratio = c.pat / c.max;
  const base = c.order.reduce((a,id)=>a+M[id].price,0) * (1 + vibe()*0.015);
  const tip = base * 0.35 * ratio * (S.stars/5);
  const pay = Math.round(base/100)*100, tipR = Math.round(tip/100)*100;
  S.money += pay + tipR; R.stats.sales += pay; R.stats.tips += tipR; R.stats.served++;
  S.best = Math.max(S.best, S.money);
  S.stars = clamp(S.stars + 0.015 + 0.04*ratio, 1, 5);
  floatAt(el, '+' + fmt(pay+tipR) + (ratio>.66?' 😋':''));
  sfx.coin();
  R.customers = R.customers.filter(x => x!==c);
  renderQueue(); renderTray(); renderHUD(); refreshAfford(); renderLedger();
}
function leave(c){
  const el = document.querySelector(`[data-cid="${c.id}"]`);
  floatAt(el, '😤 평점 하락', true); sfx.bad();
  R.customers = R.customers.filter(x => x!==c);
  R.stats.lost++; S.stars = clamp(S.stars - 0.25, 1, 5);
  renderQueue(); renderHUD(); renderLedger();
}
function staffAct(){
  // 1) 서빙 가능한 손님 중 가장 급한 손님
  const urgent = [...R.customers].sort((a,b)=>a.pat-b.pat);
  const ready = urgent.find(canServe);
  if(ready){ serve(ready, true); return; }
  // 2) 아직 준비되지 않은 메뉴 제조
  if(!freeStation() || R.tray.length + inProgress() >= TRAY_MAX) return;
  const supply = counts(R.tray.concat(R.stations.filter(s=>s.item).map(s=>s.item)));
  for(const c of urgent){
    for(const id of c.order){
      if((supply[id]||0) > 0){ supply[id]--; continue; }
      brew(id, true); return;
    }
  }
}
function tick(dt){
  if(!R.running) return;
  R.t -= dt;
  if(R.t > 5){ R.spawnT -= dt; if(R.spawnT <= 0){ spawn(); R.spawnT = spawnInterval()*(0.6+Math.random()*0.8); } }
  const sm = speedMul(S.lv.speed);
  for(const st of R.stations){
    if(!st.item) continue;
    st.p += dt*sm;
    if(st.p >= M[st.item].time){ R.tray.push(st.item); st.item=null; st.p=0; sfx.done(); renderStations(); renderTray(); }
  }
  for(const c of [...R.customers]){ c.pat -= dt; if(c.pat <= 0) leave(c); }
  for(const s of R.staff){ s.cd -= dt; if(s.cd <= 0){ s.cd = 1.5; staffAct(); } }
  if(R.t <= 0) endDay();
}

function startDay(){
  closeModal(); R = newRun(true); renderAll(); toast(`${S.day}일차 영업 시작!`); sfx.buy();
}
function endDay(){
  R.running = false; R.t = 0;
  const stayed = R.customers.length; R.customers = []; R.tray = []; R.stations.forEach(s=>{s.item=null;s.p=0;});
  const r = rent(), w = wages(), st = R.stats;
  S.money -= r + w;
  const net = st.sales + st.tips - r - w;
  const day = S.day; S.day++;
  renderAll();
  if(S.money < 0){ wipe(); return showGameOver(day); }
  save();
  openModal(`
    <h1>${day}일차 마감</h1>
    <p>${stayed?`마감 시간이라 손님 ${stayed}명은 내일 다시 오기로 했어요. `:''}오늘도 수고했어요.</p>
    <div class="rows num">
      <span>서빙한 손님</span><b>${st.served}명</b>
      <span>그냥 떠난 손님</span><b>${st.lost}명</b>
      <span>매출</span><b>${fmt(st.sales)}</b>
      <span>팁</span><b>${fmt(st.tips)}</b>
      <span>임대료</span><b class="neg">−${fmt(r)}</b>
      ${w?`<span>알바 급여</span><b class="neg">−${fmt(w)}</b>`:''}
      <span class="tot">순이익</span><b class="tot ${net<0?'neg':''}">${net<0?'−':''}${fmt(Math.abs(net))}</b>
    </div>
    <p>내일 임대료는 ${fmt(rent())}${wages()?` + 급여 ${fmt(wages())}`:''}. 영업 전에 상점에서 가게를 꾸며 보세요.</p>
    <div class="actions"><button class="cta" type="button" data-act="start">${S.day}일차 영업 시작</button></div>`);
}
function showGameOver(day){
  openModal(`
    <h1>폐업했어요</h1>
    <p>${day}일차 마감 후 임대료를 낼 돈이 모자랐어요.</p>
    <div class="rows num"><span>버틴 날</span><b>${day}일</b><span>최고 자금</span><b>${fmt(S.best)}</b><span>마지막 감성 지수</span><b>${vibe()}</b></div>
    <div class="actions"><button class="cta" type="button" data-act="reset">새 카페 차리기</button></div>`);
}

      <li>번 돈으로 메뉴를 개발하고, 설비와 알바를 들이고, 가게의 감성을 채우세요. 감성이 높을수록 손님이 몰리고 값도 더 받아요.</li>

function openModal(html){ $('sheet').innerHTML = html; $('modal').hidden = false; const b=$('sheet').querySelector('.cta'); if(b) b.focus(); }
function closeModal(){ $('modal').hidden = true; }

// ---------- shop ----------
let tab = 'menu';
function buy(kind, id){
  if(kind==='menu'){
    const m = M[id]; if(S.unlocked.includes(id) || S.money < m.unlock) return;
    S.money -= m.unlock; S.unlocked.push(id); toast(`${m.name} 출시!`); renderMenu();
  } else if(kind==='decor'){
    const d = DECOR.find(x=>x.id===id); if(S.decor.includes(id) || S.money < d.cost) return;
    S.money -= d.cost; S.decor.push(id); toast(`${d.name} 설치 · 감성 +${d.vibe}`); renderScene();
  } else {
    const u = UPG.find(x=>x.id===id), v = S.lv[id]; if(v >= u.max || S.money < u.cost(v)) return;
    S.money -= u.cost(v); S.lv[id] = v+1;
    if(id==='machine') R.stations.push({item:null,p:0});
    if(id==='staff') R.staff.push({cd:1});
    if(id==='seats') renderQueue();
    renderStations(); toast(`${u.name} 완료`);
  }
  sfx.buy(); save(); renderHUD(); renderShop(); renderLedger();
}
function renderShop(){
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab===tab));
  let rows = [];
  if(tab==='menu'){
    rows = MENU.map(m => {
      const own = S.unlocked.includes(m.id);
      return {ic:m.icon, nm:m.name, ds:`${fmt(m.price)} · 제조 ${m.time}초`, cost:m.unlock, done:own, kind:'menu', id:m.id, label: own?'판매 중':fmt(m.unlock)};
    });
  } else if(tab==='decor'){
    rows = DECOR.map(d => {
      const own = S.decor.includes(d.id);
      return {ic:d.icon, nm:d.name, ds:`감성 +${d.vibe}`, cost:d.cost, done:own, kind:'decor', id:d.id, label: own?'설치됨':fmt(d.cost)};
    });
  } else {
    rows = UPG.map(u => {
      const v = S.lv[u.id], maxed = v >= u.max;
      return {ic:u.icon, nm:u.name, ds: maxed ? '최고 단계' : u.desc(v), cost: maxed?0:u.cost(v), done:maxed, kind:'upg', id:u.id, label: maxed?'최고':fmt(u.cost(v))};
    });
  }
  $('items').innerHTML = rows.map(r => `
    <div class="item"><div class="ic">${r.ic}</div>
      <div><div class="nm">${r.nm}</div><div class="ds">${r.ds}</div></div>
      <button type="button" class="buy num ${r.done?'done':''}" data-kind="${r.kind}" data-id="${r.id}" data-cost="${r.cost}" ${r.done?'disabled':''}>${r.label}</button>
    </div>`).join('');
  refreshAfford();
}
function refreshAfford(){
  document.querySelectorAll('#items .buy:not(.done)').forEach(b => { b.disabled = S.money < +b.dataset.cost; });
}

// ---------- render ----------
function renderHUD(){
  $('money').textContent = fmt(S.money);
  $('day').textContent = S.day + '일차';
  $('stars').textContent = '★' + S.stars.toFixed(1);
  $('vibe').textContent = vibe();
  $('vibeSign').textContent = 'Lv.' + vibe();
}
function renderScene(){
  const sc = $('scene'); sc.querySelectorAll('.decor').forEach(e=>e.remove());
  for(const id of S.decor){
    const d = DECOR.find(x=>x.id===id), e = document.createElement('div');
    e.className = 'decor' + (d.sway?' sway':''); e.textContent = d.icon;
    e.style.left = d.pos[0]+'%'; e.style.top = d.pos[1]+'px'; e.title = d.name;
    sc.appendChild(e);
  }
}
function renderQueue(){
  const q = $('queue'); let html = '';
  for(let i=0;i<S.lv.seats;i++){
    const c = R.customers.find(x=>x.slot===i);
    if(!c){ html += `<div class="slot">${R.running?'빈 자리':'오픈 전'}</div>`; continue; }
    const have = counts(R.tray), used = {};
    const icons = c.order.map(id => { used[id]=(used[id]||0)+1; return `<span class="${(have[id]||0)>=used[id]?'ok':''}" title="${M[id].name}">${M[id].icon}</span>`; }).join('');
    const total = c.order.reduce((a,id)=>a+M[id].price,0);
    html += `<button type="button" class="slot cust ${canServe(c)?'ready':''}" data-cid="${c.id}" aria-label="손님 주문: ${c.order.map(id=>M[id].name).join(', ')}">
      <div class="face">${c.face}</div><div class="bubble">${icons}</div>
      <div class="pat"><i></i></div><div class="tag num">${fmt(total)}</div></button>`;
  }
  q.innerHTML = html;
  $('queueInfo').textContent = R.running ? `${R.customers.length}/${S.lv.seats}석 · 주문이 다 준비되면 손님을 눌러 서빙` : '영업을 시작하면 손님이 들어와요';
  updateBars();
}
function renderStations(){
  $('stations').innerHTML = R.stations.map((s,i) => s.item
    ? `<div class="station busy" data-st="${i}"><div class="ic">${M[s.item].icon}</div><span>제조 중</span><div class="prog"></div></div>`
    : `<div class="station" data-st="${i}"><div class="ic" style="opacity:.35">☕</div><span>대기</span></div>`).join('');
  $('stInfo').textContent = `${inProgress()}/${R.stations.length}대 사용 · 속도 ×${speedMul(S.lv.speed).toFixed(2).replace(/0$/,'')}`;
  renderMenuState(); updateBars();
}
function renderTray(){
  $('tray').innerHTML = R.tray.length
    ? R.tray.map((id,i) => `<button type="button" data-tray="${i}" title="${M[id].name} 버리기" aria-label="${M[id].name} 버리기">${M[id].icon}</button>`).join('')
    : `<span class="empty">비어 있어요</span>`;
  $('trayInfo').textContent = `${R.tray.length}/${TRAY_MAX}`;
  // 손님 주문 표시 갱신 (구조는 그대로라 클래스만)
  for(const c of R.customers){
    const el = document.querySelector(`[data-cid="${c.id}"]`); if(!el) continue;
    const have = counts(R.tray), used = {};
    el.querySelectorAll('.bubble span').forEach((s,k) => { const id=c.order[k]; used[id]=(used[id]||0)+1; s.classList.toggle('ok',(have[id]||0)>=used[id]); });
    el.classList.toggle('ready', canServe(c));
  }
  renderMenuState();
}
function renderMenu(){
  $('menu').innerHTML = S.unlocked.map((id,i) => { const m=M[id]; return `
    <button type="button" class="mbtn" data-brew="${id}"><kbd>${i+1}</kbd><span class="ic">${m.icon}</span><span class="nm">${m.name}</span><span class="meta num">${fmt(m.price)} · ${m.time}초</span></button>`; }).join('');
  renderMenuState();
}
function renderMenuState(){
  const block = !R.running || !freeStation() || R.tray.length + inProgress() >= TRAY_MAX;
  document.querySelectorAll('.mbtn').forEach(b => b.disabled = block);
}
function renderLedger(){
  const st = R.stats;
  $('ledger').innerHTML = `
    <span>서빙</span><b class="num">${st.served}명</b>
    <span>떠난 손님</span><b class="num">${st.lost}명</b>
    <span>매출 + 팁</span><b class="num">${fmt(st.sales+st.tips)}</b>
    <span>오늘 밤 임대료</span><b class="num">${fmt(rent())}</b>
    ${wages()?`<span>알바 급여</span><b class="num">${fmt(wages())}</b>`:''}
    <span>손님 방문 간격</span><b class="num">약 ${spawnInterval().toFixed(1)}초</b>`;
}
function updateBars(){
  for(const c of R.customers){
    const el = document.querySelector(`[data-cid="${c.id}"] .pat i`); if(!el) continue;
    const r = clamp(c.pat/c.max,0,1);
    el.style.width = (r*100)+'%';
    el.style.background = r>.55 ? 'var(--good)' : r>.25 ? 'var(--warn)' : 'var(--bad)';
  }
  R.stations.forEach((s,i) => { if(!s.item) return; const el=document.querySelector(`[data-st="${i}"] .prog`); if(el) el.style.width = clamp(s.p/M[s.item].time,0,1)*100+'%'; });
  const p = R.running ? R.t/DAY_LEN : 1;
  $('clockfill').style.transform = `scaleX(${clamp(p,0,1)})`;
  $('clocktxt').textContent = R.running ? clockText(1-p) : '오픈 전';
  $('win').style.background = skyColor(R.running ? 1-p : 0);
}
function clockText(prog){ const mins = 9*60 + Math.floor(prog*13*60); const h=Math.floor(mins/60), m=mins%60; return `${String(h).padStart(2,'0')}:${String(m - m%10).padStart(2,'0')} · 22시 마감`; }
function skyColor(t){
  const stops = [[0,[191,227,240]],[.6,[214,232,236]],[.82,[242,180,138]],[1,[43,49,80]]];
  let a=stops[0], b=stops[stops.length-1];
  for(let i=0;i<stops.length-1;i++) if(t>=stops[i][0] && t<=stops[i+1][0]){ a=stops[i]; b=stops[i+1]; break; }
  const k = (t-a[0])/((b[0]-a[0])||1); const c = a[1].map((v,i)=>Math.round(v+(b[1][i]-v)*k));
  return `rgb(${c})`;
}
function renderAll(){ renderHUD(); renderScene(); renderQueue(); renderStations(); renderTray(); renderMenu(); renderShop(); renderLedger(); }

// ---------- input ----------
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if(!t) return;
  if(t.dataset.brew){ brew(t.dataset.brew); return; }
  if(t.dataset.cid){ const c = R.customers.find(x=>x.id===+t.dataset.cid); if(c) serve(c); return; }
  if(t.dataset.tray !== undefined){ const i=+t.dataset.tray; if(R.tray[i]){ toast(`${M[R.tray[i]].name}를 버렸어요`); R.tray.splice(i,1); renderTray(); } return; }
  if(t.dataset.tab){ tab = t.dataset.tab; renderShop(); return; }
  if(t.dataset.kind){ buy(t.dataset.kind, t.dataset.id); return; }
  const act = t.dataset.act;
  if(act==='start') startDay();
  else if(act==='reset'){ S = newState(); R = newRun(false); wipe(); renderAll(); showIntro(); }
  else if(act==='confirmReset') openModal(`<h1>처음부터 할까요?</h1><p>지금까지의 카페(${S.day}일차, ${fmt(S.money)})가 사라져요.</p>
      <div class="actions"><button class="cta" type="button" data-act="reset">새로 시작</button><button class="ghost" type="button" data-act="intro">돌아가기</button></div>`);
  else if(act==='intro') showIntro();
});
$('soundBtn').addEventListener('click', () => {
  soundOn = !soundOn; $('soundBtn').textContent = soundOn ? '소리 켬' : '소리 끔'; $('soundBtn').setAttribute('aria-pressed', soundOn);
});
document.addEventListener('keydown', e => {
  if(!$('modal').hidden){ if(e.key==='Enter'){ const b=$('sheet').querySelector('.cta'); if(b && document.activeElement!==b){ b.click(); e.preventDefault(); } } return; }
  const n = parseInt(e.key,10);
  if(n>=1 && n<=S.unlocked.length) brew(S.unlocked[n-1]);
});

// ---------- loop & boot ----------
let last = 0;
function loop(ts){
  const dt = Math.min(0.1, (ts - (last||ts))/1000); last = ts;
  tick(dt); updateBars();
  requestAnimationFrame(loop);
}
function boot(data){
  if(data && data.S && data.R){ S = data.S; R = data.R; }
  else { S = load() || newState(); R = newRun(false); }
  renderAll();
  if(!R.running && $('modal').hidden) showIntro();
  requestAnimationFrame(loop);
}
try{ window.claude?.hot?.snapshot?.(() => ({S, R})); }catch(e){}
const hot = window.claude?.hot;
hot && hot.ready ? hot.ready(boot) : boot(hot?.data ?? {});
})();
</script>
</body>
</html>
