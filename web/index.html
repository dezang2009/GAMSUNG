<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>감성 뉴스</title>
  <meta name="theme-color" content="#f7f8fa">
  <meta name="color-scheme" content="light">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="감성 뉴스">
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
</head>
<body>
  <div class="bg" aria-hidden="true"><span></span><span></span><span></span></div>

  <header class="top glass">
    <div class="bar">
      <div>
        <p class="eyebrow" id="dateLabel">&nbsp;</p>
        <h1>오늘의 뉴스</h1>
      </div>
      <div class="actions">
        <label class="date-pick">
          <select id="dateSelect" aria-label="날짜 선택"></select>
        </label>
        <button id="settingsBtn" class="icon-btn" aria-label="알림 설정">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        </button>
      </div>
    </div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
  </header>

  <main id="content" aria-live="polite"></main>

  <!-- 중앙 모달: 이슈 상세 -->
  <dialog id="modal" class="modal glass" aria-labelledby="modalTitle">
    <div class="modal-body" id="modalBody"></div>
  </dialog>

  <!-- 바텀시트: 설정 -->
  <dialog id="sheet" class="sheet glass" aria-labelledby="sheetTitle">
    <div class="grabber" aria-hidden="true"></div>
    <div class="sheet-head">
      <h2 id="sheetTitle">알림 설정</h2>
      <button type="button" class="icon-btn close" data-close aria-label="닫기">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div id="sheetBody"></div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
