plugins { id "com.android.application" }

// 서명 정보는 레포에 넣지 않고 환경변수로 받는다
def ks = System.getenv("GAMSUNG_KEYSTORE")

android {
    namespace "io.github.dezang2009.gamsung"
    compileSdk 36

    defaultConfig {
        applicationId "io.github.dezang2009.gamsung"
        minSdk 24
        targetSdk 36
        versionCode 3
        versionName "2.1.0"
    }

    signingConfigs {
        release {
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("GAMSUNG_KEYSTORE_PASSWORD")
                keyAlias "gamsung"
                keyPassword System.getenv("GAMSUNG_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ks) signingConfig signingConfigs.release
        }
    }

    lint {
        checkReleaseBuilds false   // 웹 래퍼 앱이라 릴리스 lint 생략
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.14.0"
    implementation "androidx.work:work-runtime:2.10.5"
    implementation "androidx.core:core:1.17.0"
}

// 웹 화면(../web)을 앱 안에 넣는다. 데이터는 GitHub 레포에서 직접 받는다.
def webAssets = layout.buildDirectory.dir("generated/webassets")
tasks.register("copyWeb", Sync) {
    from("${rootDir}/../web") { exclude "config.js", "sw.js", "data/**" }
    into(webAssets.map { it.dir("web") })
    doLast {
        file(webAssets.get().file("web/config.js").asFile).text =
            'window.APP_CONFIG = { native: true, dataBase: "https://raw.githubusercontent.com/dezang2009/GAMSUNG/main/data/" };\n'
    }
}
android.sourceSets.main.assets.srcDirs += webAssets
preBuild.dependsOn "copyWeb"
