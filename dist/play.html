<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>픽셀 탐험</title>
  <style>
:root {
  --bg: #f6f7fb;
  --surface: #fff;
  --surface-2: #f2f4f8;
  --hairline: rgba(23, 26, 35, 0.07);
  --border-strong: #dfe3eb;
  --text: #171a23;
  --text-muted: #636a79;
  --text-faint: #a2a8b5;
  --accent: #4b5de6;
  --accent-soft: #eef0fd;
  --danger: #d4372f;
  --radius: 14px;
  --radius-lg: 18px;
  --shadow-soft: 0 1px 2px rgba(23, 30, 60, 0.04), 0 4px 14px rgba(23, 30, 60, 0.06);
  --shadow-float: 0 4px 16px rgba(23, 30, 60, 0.18);
  --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  font-family: var(--font);
}

/* 게임 화면: 위 탐험 필드 + 아래 메인 메뉴 */
#app {
  height: 100%;
  max-width: 520px;
  margin: 0 auto;
  display: grid;
  grid-template-rows: minmax(0, 53fr) minmax(0, 47fr);
  background: #151922;
}

#field {
  position: relative;
  overflow: hidden; /* 필드 밖으로 그려지지 않도록 클리핑 */
  display: flex;
  align-items: center;
  justify-content: center;
  background: #1c2b1f;
}

#game {
  display: block;
  touch-action: none;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}

/* ---------- 화면 전환 ---------- */
body[data-screen="menu"] #app,
body[data-screen="play"] #menu {
  display: none;
}

/* ---------- 가상 조이스틱 ---------- */
#joy {
  position: absolute;
  left: 8px;
  bottom: 8px;
  width: 150px;
  height: 150px;
  display: flex;
  align-items: center;
  justify-content: center;
  touch-action: none;
  cursor: pointer;
  z-index: 2;
}

#joy-base {
  position: relative;
  width: 120px;
  height: 120px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.26);
  border: 1.5px solid rgba(255, 255, 255, 0.75);
  box-shadow: 0 2px 12px rgba(23, 30, 60, 0.18);
  -webkit-backdrop-filter: blur(4px);
  backdrop-filter: blur(4px);
}

#joy-knob {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 50px;
  height: 50px;
  margin: -25px 0 0 -25px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.95);
  box-shadow: var(--shadow-float);
  pointer-events: none;
}

/* ---------- 탐험 중 상단 UI ---------- */
#hud {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 12px 0 12px;
  pointer-events: none;
  z-index: 3;
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
}

#hud-name,
#exit-btn {
  pointer-events: auto;
  display: inline-flex;
  align-items: center;
  height: 40px;
  padding: 0 16px;
  margin: 0;
  border: 1px solid var(--hairline);
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.94);
  color: inherit;
  font: inherit;
  box-shadow: var(--shadow-float);
}

#hud-name::before {
  content: "";
  width: 8px;
  height: 8px;
  margin-right: 9px;
  border-radius: 50%;
  background: var(--accent);
}

#exit-btn {
  cursor: pointer;
  touch-action: manipulation;
  transition: transform 0.12s;
}

#exit-btn:active {
  transform: scale(0.96);
}

/* ---------- 탐험지 선택 화면 ---------- */
#menu {
  position: fixed;
  inset: 0;
  overflow-y: auto;
  background: var(--bg);
  color: var(--text);
  touch-action: pan-y;
  padding: calc(env(safe-area-inset-top, 0px) + 32px) 16px calc(env(safe-area-inset-bottom, 0px) + 32px);
}

.menu-inner {
  max-width: 560px;
  margin: 0 auto;
}

.menu-head {
  padding: 0 4px;
  margin-bottom: 20px;
}

#menu h1 {
  margin: 0 0 6px;
  font-size: 26px;
  font-weight: 800;
  letter-spacing: -0.02em;
}

.menu-sub {
  margin: 0;
  color: var(--text-muted);
  font-size: 14px;
}

#region-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 12px;
}

.region-card {
  width: 100%;
  display: grid;
  grid-template-columns: 84px 1fr;
  gap: 16px;
  align-items: center;
  text-align: left;
  padding: 14px;
  border: 1px solid var(--hairline);
  border-radius: var(--radius-lg);
  background: var(--surface);
  color: inherit;
  font: inherit;
  box-shadow: var(--shadow-soft);
  cursor: pointer;
  touch-action: manipulation;
  transition: transform 0.12s, box-shadow 0.12s;
}

.region-card:active:not(:disabled) {
  transform: scale(0.985);
}

.region-card .thumb {
  width: 84px;
  height: 84px;
  display: block;
  border-radius: var(--radius);
  image-rendering: pixelated;
}

.region-card h2 {
  margin: 0 0 4px;
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -0.01em;
}

.region-card p {
  margin: 0;
  color: var(--text-muted);
  font-size: 13px;
  line-height: 1.5;
}

.badge {
  display: inline-block;
  margin-top: 10px;
  padding: 3px 10px;
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 12px;
  font-weight: 700;
}

.region-card.locked {
  background: var(--surface-2);
  box-shadow: none;
  cursor: not-allowed;
}

.region-card.locked h2 {
  color: var(--text-muted);
}

.region-card.locked p {
  color: var(--text-faint);
}

.region-card.locked .badge {
  background: #e6e9f0;
  color: var(--text-muted);
}

/* ---------- 하단 메인 메뉴 ---------- */
#dock {
  position: relative;
  display: flex;
  align-items: center;
  padding: 14px 14px calc(env(safe-area-inset-bottom, 0px) + 14px);
  background: #151922;
  box-shadow: 0 -1px 0 rgba(255, 255, 255, 0.06), 0 -8px 20px rgba(0, 0, 0, 0.35);
  touch-action: none;
  z-index: 4;
}

.dock-grid {
  width: 100%;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-auto-rows: clamp(84px, 17vh, 124px);
  gap: 10px;
}

.dock-btn {
  --c: #4b5de6;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 64px;
  margin: 0;
  padding: 8px;
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 16px;
  background: #1f2533;
  color: #e9ecf5;
  font: 700 14px/1 var(--font);
  letter-spacing: -0.01em;
  cursor: pointer;
  touch-action: manipulation;
  transition: transform 0.12s, background 0.12s;
}

.dock-btn:active {
  transform: scale(0.96);
  background: #262d3e;
}

.dock-icon {
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  background: color-mix(in srgb, var(--c) 16%, transparent);
  color: var(--c);
}

.dock-icon svg {
  width: 24px;
  height: 24px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.dock-btn.is-current {
  background: #252c40;
  border-color: color-mix(in srgb, var(--c) 55%, transparent);
}

.c-coral { --c: #ff7a6b; }
.c-amber { --c: #f2b035; }
.c-mint { --c: #3fd0bd; }
.c-blue { --c: #7a8cff; }
.c-violet { --c: #b583f2; }
.c-sky { --c: #5cc2f0; }
</style>
</head>
<body data-screen="menu">
  <main id="menu">
    <div class="menu-inner">
      <header class="menu-head">
        <h1>탐험지 선택</h1>
        <p class="menu-sub">가고 싶은 지역을 골라 입장하세요.</p>
      </header>
      <ul id="region-list"></ul>
    </div>
  </main>

  <div id="app">
    <section id="field">
      <canvas id="game"></canvas>

      <div id="hud">
        <span id="hud-name"></span>
        <button id="exit-btn" type="button">나가기</button>
      </div>

      <div id="joy" aria-label="가상 조이스틱">
        <div id="joy-base">
          <div id="joy-knob"></div>
        </div>
      </div>
    </section>

    <nav id="dock" aria-label="메인 메뉴">
      <div class="dock-grid">
        <button class="dock-btn c-coral" type="button" data-menu="battle">
          <span class="dock-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 17.5 3 6V3h3l11.5 11.5"/><path d="M13 19l6-6"/><path d="m16 16 4 4"/><path d="m19 21 2-2"/><path d="M9.5 6.5 21 18v3h-3L6.5 9.5"/><path d="m11 5-3-2H5v3l2 3"/></svg></span>
          <span class="dock-label">전투</span>
        </button>
        <button class="dock-btn c-amber" type="button" data-menu="bag">
          <span class="dock-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg></span>
          <span class="dock-label">가방</span>
        </button>
        <button class="dock-btn c-mint" type="button" data-menu="party">
          <span class="dock-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>
          <span class="dock-label">동료</span>
        </button>
        <button class="dock-btn c-blue is-current" type="button" data-menu="explore">
          <span class="dock-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m16.24 7.76-2.12 6.36-6.36 2.12 2.12-6.36 6.36-2.12z"/></svg></span>
          <span class="dock-label">탐험</span>
        </button>
        <button class="dock-btn c-violet" type="button" data-menu="dex">
          <span class="dock-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span>
          <span class="dock-label">도감</span>
        </button>
        <button class="dock-btn c-sky" type="button" data-menu="char">
          <span class="dock-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
          <span class="dock-label">캐릭터</span>
        </button>
      </div>
    </nav>
  </div>

  <script>
// 외부 이미지 없이 Canvas 픽셀 단위로 그리는 스프라이트 모음
const Sprites = (() => {
  const OUTLINE = '#2a2233';

  const C = {
    skin: '#f4c99b', skinSh: '#d9a074', hair: '#4a2f22',
    cap: '#e0503c', capSh: '#b33b2c',
    shirt: '#3f83d6', shirtSh: '#2c5fa6', pants: '#3b3f63',
    shoe: '#2d211b', eye: '#231c2e',
    trunk: '#7b4f2e', trunkSh: '#5c3a22',
    leafL: '#72cc5e', leafM: '#42a04a', leafD: '#2b7535', leafRim: '#1f5427',
    rockL: '#c3c7cf', rockM: '#8f95a1', rockD: '#5d6371',
    bushL: '#5cc053', bushM: '#3a9040', bushD: '#276a2f', berry: '#e4505c',
  };

  // 발 모양 프레임: [왼쪽 다리 바닥 행, 오른쪽 다리 바닥 행]
  const LEGS = [[15, 14], [14, 15], [15, 15]]; // 걷기1, 걷기2, 정지

  function rect(ctx, x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x, y, w, h);
  }

  // 투명 픽셀 중 색 있는 픽셀과 맞닿은 곳에 외곽선을 그린다
  function hexToRgb(h) {
    const n = parseInt(h.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }

  function addOutline(canvas, color) {
    const rgb = hexToRgb(color || OUTLINE);
    const ctx = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;
    const s = ctx.getImageData(0, 0, w, h).data;
    const out = new Uint8ClampedArray(s);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const i = (y * w + x) * 4;
        if (s[i + 3]) continue;
        const near = (x > 0 && s[i - 1]) || (x < w - 1 && s[i + 7]) ||
                     (y > 0 && s[i - w * 4 + 3]) || (y < h - 1 && s[i + w * 4 + 3]);
        if (near) {
          out[i] = rgb[0]; out[i + 1] = rgb[1]; out[i + 2] = rgb[2]; out[i + 3] = 255;
        }
      }
    }
    ctx.putImageData(new ImageData(out, w, h), 0, 0);
  }

  // 내용 영역 w x h 에 draw 를 실행하고, 외곽선용 1px 여백을 더해 반환
  function build(w, h, draw, outlineColor) {
    const c = document.createElement('canvas');
    c.width = w + 2;
    c.height = h + 2;
    draw(c.getContext('2d'), 1, 1);
    addOutline(c, outlineColor);
    return c;
  }

  function flip(src) {
    const c = document.createElement('canvas');
    c.width = src.width;
    c.height = src.height;
    const ctx = c.getContext('2d');
    ctx.translate(c.width, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(src, 0, 0);
    return c;
  }

  // ---- 플레이어 (12x16) ----
  function drawPlayer(ctx, ox, oy, dir, legs) {
    const r = (x, y, w, h, c) => rect(ctx, ox + x, oy + y, w, h, c);
    const leg = (x, bottom) => {
      r(x, 13, 2, bottom - 13, C.pants);
      r(x, bottom, 2, 1, C.shoe);
    };

    if (dir === 'side') {
      r(3, 2, 2, 6, C.hair);            // 뒤통수
      r(3, 0, 7, 3, C.cap);             // 모자
      r(4, 3, 5, 5, C.skin);            // 얼굴
      r(7, 5, 1, 2, C.eye);             // 눈
      r(4, 8, 5, 5, C.shirt);           // 몸통
      r(4, 9, 1, 4, C.shirtSh);         // 뒤팔
      leg(4, legs[0]);
      leg(6, legs[1]);
      r(6, 9, 2, 4, C.shirt);           // 앞팔
      r(6, 12, 2, 1, C.skin);           // 손
      return;
    }

    r(3, 0, 6, 3, C.cap);               // 모자
    r(3, 3, 6, 5, dir === 'up' ? C.hair : C.skin);
    if (dir === 'down') {
      r(4, 5, 1, 2, C.eye);
      r(7, 5, 1, 2, C.eye);
    }
    r(3, 8, 6, 5, C.shirt);             // 몸통
    r(2, 8, 1, 4, C.shirt);             // 왼팔
    r(9, 8, 1, 4, C.shirt);             // 오른팔
    r(2, 12, 1, 1, C.skin);
    r(9, 12, 1, 1, C.skin);
    leg(3, legs[0]);
    leg(7, legs[1]);
  }

  // ---- 나무 (18x26 + 외곽선) ----
  function makeTree(radius) {
    return build(18, 26, (ctx, ox, oy) => {
      rect(ctx, ox + 7, oy + 16, 4, 10, C.trunk);
      rect(ctx, ox + 10, oy + 16, 1, 10, C.trunkSh);
      for (let y = 0; y < 18; y++) {
        for (let x = 0; x < 18; x++) {
          const dx = x + 0.5 - 9, dy = y + 0.5 - 9;
          const d = Math.hypot(dx, dy);
          if (d > radius + 0.5) continue;
          let col;
          if (d > radius - 0.9) {
            col = C.leafRim;
          } else {
            const l = (-dx - dy) / (radius * 1.4); // 왼쪽 위에서 빛이 온다고 가정
            col = l > 0.35 ? C.leafL : l < -0.4 ? C.leafD : C.leafM;
          }
          rect(ctx, ox + x, oy + y, 1, 1, col);
        }
      }
      // 잎 질감
      for (let y = 2; y < 16; y++) {
        for (let x = 2; x < 16; x++) {
          if ((x * 5 + y * 3) % 13 === 0 && Math.hypot(x - 9, y - 9) < radius - 2) {
            rect(ctx, ox + x, oy + y, 1, 1, C.leafL);
          }
        }
      }
    });
  }

  // ---- 바위 (14x10) ----
  function makeRock(seed) {
    return build(14, 10, (ctx, ox, oy) => {
      for (let y = 0; y < 10; y++) {
        for (let x = 0; x < 14; x++) {
          const nx = (x + 0.5 - 7) / 7, ny = (y + 0.5 - 5) / 5;
          if (nx * nx + ny * ny > 1) continue;
          let col;
          if (ny < -0.35) col = C.rockL;
          else if (ny > 0.35 && nx > -0.5) col = C.rockD;
          else col = C.rockM;
          if ((x * 3 + y * 7 + seed) % 11 === 0 && ny < 0) col = C.rockL;
          rect(ctx, ox + x, oy + y, 1, 1, col);
        }
      }
    });
  }

  // ---- 덤불 (14x11) ----
  function makeBush(seed) {
    const blobs = [[4, 6, 3.2], [9.5, 6, 3.2], [7, 4, 3.5]];
    return build(14, 11, (ctx, ox, oy) => {
      for (let y = 0; y < 11; y++) {
        for (let x = 0; x < 14; x++) {
          const inside = blobs.some(([cx, cy, r]) => Math.hypot(x + 0.5 - cx, y + 0.5 - cy) <= r);
          if (!inside) continue;
          let col = y < 4 ? C.bushL : y > 7 ? C.bushD : C.bushM;
          if ((x * 3 + y * 5 + seed) % 17 === 0 && y > 2) col = C.berry;
          rect(ctx, ox + x, oy + y, 1, 1, col);
        }
      }
    });
  }

  // ---- 몬스터 ----
  // 푸른 슬라임 (14x11): squash 프레임으로 통통 튀는 느낌
  function makeSlime(squash) {
    return build(14, 11, (ctx, ox, oy) => {
      const cx = 7, cy = squash ? 7 : 6, rx = squash ? 6.8 : 6.2, ry = squash ? 3.6 : 4.6;
      for (let y = 0; y < 11; y++) {
        for (let x = 0; x < 14; x++) {
          const nx = (x + 0.5 - cx) / rx, ny = (y + 0.5 - cy) / ry;
          if (nx * nx + ny * ny > 1) continue;
          const col = ny < -0.35 ? '#a6d8ff' : ny > 0.45 ? '#3a74d0' : '#5aa8ff';
          rect(ctx, ox + x, oy + y, 1, 1, col);
        }
      }
      rect(ctx, ox + 3, oy + Math.round(cy - ry + 1.2), 2, 1, '#e8f6ff');
      rect(ctx, ox + 4, oy + cy - 1, 1, 2, '#1b1b2f');
      rect(ctx, ox + 9, oy + cy - 1, 1, 2, '#1b1b2f');
      rect(ctx, ox + 6, oy + cy + 1, 2, 1, '#1b1b2f');
    });
  }

  // 버섯돌이 (14x16)
  function makeMushroom(step) {
    return build(14, 16, (ctx, ox, oy) => {
      const r = (x, y, w, h, c) => rect(ctx, ox + x, oy + y, w, h, c);
      r(4, 9, 6, 5, '#f2e3c3');
      r(8, 9, 2, 5, '#d9c49d');
      r(5, 10, 1, 2, '#231c2e');
      r(8, 10, 1, 2, '#231c2e');
      r(6, 12, 2, 1, '#b5523b');
      r(3, step ? 14 : 15, 3, step ? 2 : 1, '#c9a77a');
      r(8, step ? 15 : 14, 3, step ? 1 : 2, '#c9a77a');
      for (let y = 0; y < 9; y++) {
        for (let x = 0; x < 14; x++) {
          const nx = (x + 0.5 - 7) / 7, ny = (y + 0.5 - 5) / 5;
          if (nx * nx + ny * ny > 1) continue;
          const col = nx + ny < -0.6 ? '#f2705f' : ny > 0.4 ? '#a8332b' : '#d8483c';
          r(x, y, 1, 1, col);
        }
      }
      r(3, 2, 2, 2, '#fff7ea');
      r(9, 1, 2, 2, '#fff7ea');
      r(6, 5, 2, 1, '#fff7ea');
    });
  }

  // 달빛 여우 (희귀, 20x14, 오른쪽을 봄): 금색 외곽선으로 일반 몬스터와 구분
  function makeFox(step) {
    return build(20, 14, (ctx, ox, oy) => {
      const r = (x, y, w, h, c) => rect(ctx, ox + x, oy + y, w, h, c);
      const body = '#d9d4ff', shade = '#b4abf0', light = '#efeaff';
      r(1, 3, 3, 6, body);
      r(0, 2, 3, 3, '#ffffff');
      r(3, 6, 10, 4, body);
      r(3, 9, 10, 1, shade);
      r(4, 6, 8, 1, light);
      r(12, 3, 6, 5, body);
      r(17, 5, 3, 3, light);
      r(19, 5, 1, 1, '#231c2e');
      r(15, 5, 1, 1, '#231c2e');
      r(12, 1, 2, 3, body);
      r(16, 1, 2, 3, body);
      r(13, 2, 1, 1, '#ff9fc0');
      r(17, 2, 1, 1, '#ff9fc0');
      r(4, 10, 2, step ? 3 : 4, shade);
      r(6, 10, 2, step ? 4 : 3, shade);
      r(10, 10, 2, step ? 4 : 3, shade);
      r(12, 10, 2, step ? 3 : 4, shade);
    }, '#f2b632');
  }

  // 플레이어를 감지했을 때 머리 위에 뜨는 느낌표
  function makeAlert() {
    return build(3, 8, (ctx, ox, oy) => {
      rect(ctx, ox, oy, 3, 5, '#ff4d4d');
      rect(ctx, ox, oy + 6, 3, 2, '#ff4d4d');
    });
  }

  function monsterSet(make) {
    const right = [make(0), make(1)];
    return { right, left: right.map(flip) };
  }

  // 잔디 무늬 타일 (메뉴 배경, 썸네일용)
  function makeGrassPattern(w, h) {
    const c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    const ctx = c.getContext('2d');
    const cols = ['#6cbb48', '#62ae40', '#78c755', '#58a23a'];
    for (let y = 0; y < h; y += 2) {
      for (let x = 0; x < w; x += 2) {
        const n = Math.abs(Math.sin(x * 12.9898 + y * 78.233) * 43758.5453) % 1;
        rect(ctx, x, y, 2, 2, n < 0.55 ? cols[0] : n < 0.8 ? cols[1] : n < 0.93 ? cols[2] : cols[3]);
      }
    }
    return c;
  }

  const playerFront = LEGS.map((legs) => build(12, 16, (ctx, ox, oy) => drawPlayer(ctx, ox, oy, 'down', legs)));
  const playerBack = LEGS.map((legs) => build(12, 16, (ctx, ox, oy) => drawPlayer(ctx, ox, oy, 'up', legs)));
  const playerSide = LEGS.map((legs) => build(12, 16, (ctx, ox, oy) => drawPlayer(ctx, ox, oy, 'side', legs)));

  return {
    // player.dir 별 [걷기1, 걷기2, 정지] 프레임
    player: {
      down: playerFront,
      up: playerBack,
      right: playerSide,
      left: playerSide.map(flip),
    },
    trees: [makeTree(8.5), makeTree(7.4)],
    rocks: [makeRock(0), makeRock(4), makeRock(8)],
    bushes: [makeBush(0), makeBush(7)],
    monsters: {
      slime: monsterSet(makeSlime),
      mushroom: monsterSet(makeMushroom),
      fox: monsterSet(makeFox),
    },
    alert: makeAlert(),
    makeGrassPattern,
  };
})();

  <script>
// 타일 기반 탐험 맵: 지형 생성, 장애물 배치, 바닥 렌더링, 충돌 판정
const World = (() => {
  const TILE = 16;
  let COLS = 0;
  let ROWS = 0;
  let SPAWN = { tx: 0, ty: 0 };
  let cfg = null; // 지역 데이터의 gen 설정

  const GRASS = 0;
  const PATH = 1;
  const TALL = 2; // 걸을 수 있는 풀숲

  const GRASS_C = [[108, 186, 76], [100, 178, 70], [122, 200, 90], [86, 160, 62]];
  const TALL_C = [[78, 150, 56], [70, 140, 50]];
  const TALL_BLADE = [104, 180, 74];
  const PATH_RIM = [176, 140, 88];
  const PATH_C = [[218, 188, 126], [208, 176, 114], [226, 202, 146], [190, 156, 100]];
  const FLOWER_COLORS = ['#fff6e0', '#ffd84a', '#ff8fb1', '#b3a6ff'];

  let kind = null;
  let solid = null;
  const objects = [];
  const flowers = [];
  let ground = null;

  const idx = (tx, ty) => ty * COLS + tx;
  const inMap = (tx, ty) => tx >= 0 && ty >= 0 && tx < COLS && ty < ROWS;

  // 같은 시드면 항상 같은 맵이 나오는 난수기 (mulberry32)
  function mulberry32(a) {
    return function () {
      let t = (a += 0x6d2b79f5);
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  let rand = Math.random;

  function hash(x, y, s) {
    let h = Math.imul(x, 374761393) ^ Math.imul(y, 668265263) ^ Math.imul(s, 2246822519);
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }

  function nearSpawn(tx, ty) {
    return Math.hypot(tx - SPAWN.tx, ty - SPAWN.ty) <= 4;
  }

  function canPlace(tx, ty) {
    return inMap(tx, ty) && kind[idx(tx, ty)] !== PATH && !solid[idx(tx, ty)] && !nearSpawn(tx, ty);
  }

  function addObject(img, x, y, shadow, tx, ty) {
    solid[idx(tx, ty)] = 1;
    objects.push({ img, x, y, w: img.width, h: img.height, baseY: (ty + 1) * TILE, shadow });
  }

  function placeTree(tx, ty) {
    const img = Sprites.trees[Math.floor(rand() * Sprites.trees.length)];
    const cx = tx * TILE + TILE / 2;
    const by = (ty + 1) * TILE;
    addObject(img, cx - img.width / 2, by - 26, { cx, cy: by - 2, rx: 7, ry: 3 }, tx, ty);
  }

  function placeRock(tx, ty) {
    const img = Sprites.rocks[Math.floor(rand() * Sprites.rocks.length)];
    const cx = tx * TILE + TILE / 2;
    const by = (ty + 1) * TILE;
    addObject(img, tx * TILE, by - 12, { cx, cy: by - 2, rx: 6, ry: 2.5 }, tx, ty);
  }

  function placeBush(tx, ty) {
    const img = Sprites.bushes[Math.floor(rand() * Sprites.bushes.length)];
    const cx = tx * TILE + TILE / 2;
    const by = (ty + 1) * TILE;
    addObject(img, tx * TILE, by - 13, { cx, cy: by - 2, rx: 6, ry: 2.5 }, tx, ty);
  }

  // 길: 웨이포인트를 이어 폭 2타일로 파낸다 (중간점을 살짝 흔들어 자연스럽게)
  function setPath(x, y) {
    if (x > 1 && y > 1 && x < COLS - 2 && y < ROWS - 2) kind[idx(x, y)] = PATH;
  }
  function carve(ax, ay, bx, by) {
    const steps = Math.max(Math.abs(bx - ax), Math.abs(by - ay), 1);
    for (let i = 0; i <= steps; i++) {
      const x = Math.round(ax + ((bx - ax) * i) / steps);
      const y = Math.round(ay + ((by - ay) * i) / steps);
      setPath(x, y); setPath(x + 1, y); setPath(x, y + 1); setPath(x + 1, y + 1);
    }
  }

  function generatePath() {
    const pts = cfg.path;
    for (let i = 0; i < pts.length - 1; i++) {
      const [ax, ay] = pts[i];
      const [bx, by] = pts[i + 1];
      const mx = Math.round((ax + bx) / 2 + rand() * 6 - 3);
      const my = Math.round((ay + by) / 2 + rand() * 6 - 3);
      carve(ax, ay, mx, my);
      carve(mx, my, bx, by);
    }
  }

  function generateObstacles() {
    // 맵 가장자리는 나무 벽
    for (let ty = 0; ty < ROWS; ty++) {
      for (let tx = 0; tx < COLS; tx++) {
        const edge = tx < 2 || ty < 2 || tx >= COLS - 2 || ty >= ROWS - 2;
        if (edge && !solid[idx(tx, ty)]) placeTree(tx, ty);
      }
    }

    // 숲 덩어리
    for (let b = 0; b < cfg.forests; b++) {
      const cx = 5 + rand() * (COLS - 10);
      const cy = 5 + rand() * (ROWS - 10);
      const r = 3 + rand() * 3;
      for (let ty = Math.floor(cy - r - 1); ty <= cy + r + 1; ty++) {
        for (let tx = Math.floor(cx - r - 1); tx <= cx + r + 1; tx++) {
          if (Math.hypot(tx - cx, ty - cy) < r * (0.75 + rand() * 0.35) && canPlace(tx, ty) && rand() < 0.75) {
            placeTree(tx, ty);
          }
        }
      }
    }

    // 바위 무리
    for (let c = 0; c < cfg.rockClusters; c++) {
      const cx = 3 + Math.floor(rand() * (COLS - 6));
      const cy = 3 + Math.floor(rand() * (ROWS - 6));
      const count = 1 + Math.floor(rand() * 3);
      for (let i = 0; i < count; i++) {
        const tx = cx + Math.floor(rand() * 3) - 1;
        const ty = cy + Math.floor(rand() * 3) - 1;
        if (canPlace(tx, ty)) placeRock(tx, ty);
      }
    }

    // 덤불
    for (let i = 0; i < cfg.bushes; i++) {
      const tx = 2 + Math.floor(rand() * (COLS - 4));
      const ty = 2 + Math.floor(rand() * (ROWS - 4));
      if (canPlace(tx, ty) && kind[idx(tx, ty)] === GRASS) placeBush(tx, ty);
    }
  }

  function generateTallGrass() {
    for (let b = 0; b < cfg.tallGrass; b++) {
      const cx = 3 + rand() * (COLS - 6);
      const cy = 3 + rand() * (ROWS - 6);
      const r = 2 + rand() * 2;
      for (let ty = Math.floor(cy - r); ty <= cy + r; ty++) {
        for (let tx = Math.floor(cx - r); tx <= cx + r; tx++) {
          if (!inMap(tx, ty) || solid[idx(tx, ty)] || kind[idx(tx, ty)] !== GRASS) continue;
          if (Math.hypot(tx - cx, ty - cy) < r && rand() < 0.85) kind[idx(tx, ty)] = TALL;
        }
      }
    }
  }

  function generateFlowers() {
    for (let i = 0; i < cfg.flowers; i++) {
      const tx = Math.floor(rand() * COLS);
      const ty = Math.floor(rand() * ROWS);
      if (!inMap(tx, ty) || solid[idx(tx, ty)] || kind[idx(tx, ty)] !== GRASS) continue;
      flowers.push({
        x: tx * TILE + 3 + Math.floor(rand() * 10),
        y: ty * TILE + 3 + Math.floor(rand() * 10),
        c: FLOWER_COLORS[Math.floor(rand() * FLOWER_COLORS.length)],
      });
    }
  }

  // 길 타일 가장자리는 풀과 섞이도록 픽셀을 일부 풀색으로 바꾼다
  function edgeOfPath(tx, ty, lx, ly) {
    const isPath = (x, y) => !inMap(x, y) || kind[idx(x, y)] === PATH;
    return (lx < 2 && !isPath(tx - 1, ty)) || (lx > 13 && !isPath(tx + 1, ty)) ||
           (ly < 2 && !isPath(tx, ty - 1)) || (ly > 13 && !isPath(tx, ty + 1));
  }

  function renderGround() {
    const W = COLS * TILE, H = ROWS * TILE;
    const cvs = document.createElement('canvas');
    cvs.width = W;
    cvs.height = H;
    const g = cvs.getContext('2d');
    const img = g.createImageData(W, H);
    const d = img.data;

    for (let py = 0; py < H; py++) {
      for (let px = 0; px < W; px++) {
        const tx = px >> 4, ty = py >> 4, lx = px & 15, ly = py & 15;
        let k = kind[idx(tx, ty)];
        let rim = false;
        if (k === PATH && edgeOfPath(tx, ty, lx, ly)) {
          if (hash(px, py, 9) < 0.5) k = GRASS;
          else rim = true;
        }

        let c;
        if (k === PATH) {
          const n = hash(px >> 1, py >> 1, 4);
          c = rim && n < 0.75 ? PATH_RIM : n < 0.55 ? PATH_C[0] : n < 0.8 ? PATH_C[1] : n < 0.92 ? PATH_C[2] : PATH_C[3];
        } else if (k === TALL) {
          c = hash(px >> 1, py >> 1, 6) < 0.6 ? TALL_C[0] : TALL_C[1];
          if (hash(px, py, 7) > 0.93) c = TALL_BLADE;
        } else {
          const n = hash(px >> 1, py >> 1, 3);
          c = n < 0.55 ? GRASS_C[0] : n < 0.8 ? GRASS_C[1] : n < 0.93 ? GRASS_C[2] : GRASS_C[3];
        }

        const i = (py * W + px) * 4;
        d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = 255;
      }
    }
    g.putImageData(img, 0, 0);

    // 풀 다발: 단조로운 바닥에 질감을 더한다
    for (let ty = 0; ty < ROWS; ty++) {
      for (let tx = 0; tx < COLS; tx++) {
        if (kind[idx(tx, ty)] !== GRASS || solid[idx(tx, ty)] || hash(tx, ty, 31) > 0.35) continue;
        const x = tx * TILE + 3 + Math.floor(hash(tx, ty, 32) * 9);
        const y = ty * TILE + 4 + Math.floor(hash(tx, ty, 33) * 8);
        g.fillStyle = '#4c9a38';
        g.fillRect(x, y, 1, 3);
        g.fillRect(x + 2, y - 1, 1, 4);
        g.fillRect(x + 4, y + 1, 1, 2);
        g.fillStyle = '#8fd96a';
        g.fillRect(x, y - 1, 1, 1);
        g.fillRect(x + 2, y - 2, 1, 1);
      }
    }

    // 꽃
    for (const f of flowers) {
      g.fillStyle = f.c;
      g.fillRect(f.x - 1, f.y, 1, 1);
      g.fillRect(f.x + 1, f.y, 1, 1);
      g.fillRect(f.x, f.y - 1, 1, 1);
      g.fillRect(f.x, f.y + 1, 1, 1);
      g.fillStyle = '#f5b93a';
      g.fillRect(f.x, f.y, 1, 1);
    }

    // 오브젝트 그림자
    g.fillStyle = 'rgba(20, 52, 24, 0.3)';
    for (const o of objects) {
      const s = o.shadow;
      g.beginPath();
      g.ellipse(s.cx, s.cy, s.rx, s.ry, 0, 0, Math.PI * 2);
      g.fill();
    }

    ground = cvs;
  }

  // 지역 데이터(Regions)로 맵을 새로 만든다
  function load(region) {
    cfg = region.gen;
    COLS = region.cols;
    ROWS = region.rows;
    SPAWN = region.spawn;
    kind = new Uint8Array(COLS * ROWS);
    solid = new Uint8Array(COLS * ROWS);
    objects.length = 0;
    flowers.length = 0;
    rand = mulberry32(cfg.seed);
    generatePath();
    generateObstacles();
    generateTallGrass();
    generateFlowers();
    objects.sort((a, b) => a.baseY - b.baseY);
    renderGround();
  }

  // 사각형 영역(픽셀 단위, x1/y1 제외)이 막혀 있는지 검사
  function blocked(x0, y0, x1, y1) {
    const tx0 = Math.floor(x0 / TILE), tx1 = Math.floor((x1 - 1e-6) / TILE);
    const ty0 = Math.floor(y0 / TILE), ty1 = Math.floor((y1 - 1e-6) / TILE);
    for (let ty = ty0; ty <= ty1; ty++) {
      for (let tx = tx0; tx <= tx1; tx++) {
        if (!inMap(tx, ty) || solid[idx(tx, ty)]) return true;
      }
    }
    return false;
  }

  return {
    TILE,
    get COLS() { return COLS; },
    get ROWS() { return ROWS; },
    get SPAWN() { return SPAWN; },
    objects,
    load,
    blocked,
    get ground() { return ground; },
  };
})();

  <script>
// 필드 몬스터: 출현 / 소멸 / 행동(대기·배회·추적·복귀) / 충돌
const Monsters = (() => {
  const HALF_W = 4;          // 몬스터 발 판정 박스
  const FEET_H = 3;
  const R_PLAYER = 10;       // 플레이어와 유지할 최소 간격
  const R_MONSTER = 9;       // 몬스터끼리 유지할 최소 간격
  const STOP_DIST = 13;      // 추적 중 이 거리 안이면 멈춘다
  const FADE_TIME = 0.8;

  const entities = [];
  let region = null;
  let rules = null;
  let respawnTimer = 0;

  const rnd = (a, b) => a + Math.random() * (b - a);
  const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);

  function defsFor() {
    return MonsterData.filter((d) => d.regions.includes(region.id));
  }

  function countOf(id) {
    let n = 0;
    for (const m of entities) if (m.def.id === id) n++;
    return n;
  }

  // 출현 확률(spawnChance)에 따라 몬스터 종류를 뽑는다. 최대 수에 찬 종류는 제외
  function rollDef() {
    const c = defsFor().filter((d) => countOf(d.id) < d.maxCount);
    const total = c.reduce((sum, d) => sum + d.spawnChance, 0);
    if (!total) return null;
    let r = Math.random() * total;
    for (const d of c) {
      r -= d.spawnChance;
      if (r <= 0) return d;
    }
    return c[c.length - 1];
  }

  const inRect = (x, y, rect, margin) =>
    x > rect.x - margin && x < rect.x + rect.w + margin &&
    y > rect.y - margin && y < rect.y + rect.h + margin;

  // 화면 밖이고 플레이어와 충분히 떨어졌으며 장애물이 없는 자리를 찾는다
  function findSpawnPoint(player, rect) {
    for (let i = 0; i < 60; i++) {
      const tx = 3 + Math.floor(Math.random() * (World.COLS - 6));
      const ty = 3 + Math.floor(Math.random() * (World.ROWS - 6));
      const x = tx * World.TILE + 8, y = ty * World.TILE + 12;
      if (World.blocked(x - HALF_W - 3, y - FEET_H - 3, x + HALF_W + 3, y + 4)) continue;
      if (inRect(x, y, rect, 32)) continue;
      if (dist(x, y, player.x, player.y) < rules.minSpawnDist) continue;
      if (entities.some((m) => dist(x, y, m.x, m.y) < 24)) continue;
      return { x, y };
    }
    return null;
  }

  function spawnOne(player, rect) {
    if (entities.length >= rules.target) return false;
    const def = rollDef();
    if (!def) return false;
    const pt = findSpawnPoint(player, rect);
    if (!pt) return false;
    const life = def.lifetime || rules.lifetime;
    entities.push({
      def, x: pt.x, y: pt.y, home: { x: pt.x, y: pt.y },
      state: 'idle', timer: rnd(0.5, 2.5), tx: 0, ty: 0, wanderT: 0,
      dir: Math.random() < 0.5 ? 1 : -1, animT: Math.random() * 3, frame: 0, moving: false,
      life: rnd(life[0], life[1]), fading: false, fade: 1, alert: 0, dead: false,
    });
    return true;
  }

  function tryMove(m, nx, ny, player) {
    if (World.blocked(nx - HALF_W, ny - FEET_H, nx + HALF_W, ny + 1)) return false;
    const dOld = dist(m.x, m.y, player.x, player.y);
    const dNew = dist(nx, ny, player.x, player.y);
    if (dNew < R_PLAYER && dNew < dOld) return false;
    for (const o of entities) {
      if (o === m) continue;
      const a = dist(m.x, m.y, o.x, o.y), b = dist(nx, ny, o.x, o.y);
      if (b < R_MONSTER && b < a) return false;
    }
    m.x = nx;
    m.y = ny;
    return true;
  }

  // 목표 지점으로 이동. 축을 나눠 이동하므로 장애물에 닿아도 벽을 따라 미끄러진다
  function moveToward(m, tx, ty, speed, dt, player) {
    const dx = tx - m.x, dy = ty - m.y;
    const d = Math.hypot(dx, dy);
    if (d < 0.01) return false;
    const vx = (dx / d) * speed * dt, vy = (dy / d) * speed * dt;
    let moved = false;
    const steps = Math.max(1, Math.ceil(Math.max(Math.abs(vx), Math.abs(vy)) / 0.5));
    for (let i = 0; i < steps; i++) {
      if (tryMove(m, m.x + vx / steps, m.y, player)) moved = true;
      if (tryMove(m, m.x, m.y + vy / steps, player)) moved = true;
    }
    if (Math.abs(dx) > 0.5) m.dir = dx > 0 ? 1 : -1;
    return moved;
  }

  function pickWander(m) {
    const radius = m.def.wanderRadius || 40;
    const a = Math.random() * Math.PI * 2;
    const r = rnd(12, radius);
    const tx = m.home.x + Math.cos(a) * r, ty = m.home.y + Math.sin(a) * r;
    if (World.blocked(tx - HALF_W, ty - FEET_H, tx + HALF_W, ty + 1)) return false;
    m.tx = tx;
    m.ty = ty;
    m.wanderT = 3;
    m.state = 'wander';
    return true;
  }

  function updateMonster(m, dt, player, rect) {
    const def = m.def;
    m.alert = Math.max(0, m.alert - dt);
    m.animT += dt;

    if (m.fading) {
      m.fade -= dt / FADE_TIME;
      if (m.fade <= 0) m.dead = true;
      return;
    }

    const d = dist(m.x, m.y, player.x, player.y);

    // 감지 / 추적 해제
    if (m.state !== 'chase' && d < def.detectRange) {
      m.state = 'chase';
      m.alert = 0.8;
    } else if (m.state === 'chase' && d > def.detectRange * 1.5) {
      m.state = 'return';
    }

    let moved = false;
    if (m.state === 'chase') {
      if (d > STOP_DIST) moved = moveToward(m, player.x, player.y, def.moveSpeed, dt, player);
      else if (Math.abs(player.x - m.x) > 0.5) m.dir = player.x > m.x ? 1 : -1;
    } else if (m.state === 'return') {
      if (dist(m.x, m.y, m.home.x, m.home.y) < 3) {
        m.state = 'idle';
        m.timer = rnd(1, 2);
      } else {
        moved = moveToward(m, m.home.x, m.home.y, def.moveSpeed * 0.7, dt, player);
      }
    } else if (m.state === 'wander') {
      m.wanderT -= dt;
      if (m.wanderT <= 0 || dist(m.x, m.y, m.tx, m.ty) < 2) {
        m.state = 'idle';
        m.timer = rnd(1, 3);
      } else {
        moved = moveToward(m, m.tx, m.ty, def.moveSpeed * 0.45, dt, player);
      }
    } else {
      m.timer -= dt;
      if (m.timer <= 0 && !pickWander(m)) m.timer = rnd(1, 2);
    }

    m.moving = moved;
    m.frame = Math.floor(m.animT * (moved ? 6 : 2)) % 2;

    // 수명이 다하면 사라진다: 화면 밖이면 바로, 화면 안이면 서서히 투명해진다
    m.life -= dt;
    if (m.life <= 0 && m.state !== 'chase') {
      if (inRect(m.x, m.y, rect, 24)) m.fading = true;
      else m.dead = true;
    }
  }

  function update(dt, player, rect) {
    // 비어 있으면 일정 시간 뒤에 새 몬스터 출현
    if (entities.length >= rules.target) {
      respawnTimer = rnd(rules.respawn[0], rules.respawn[1]);
    } else {
      respawnTimer -= dt;
      if (respawnTimer <= 0) {
        respawnTimer = spawnOne(player, rect) ? rnd(rules.respawn[0], rules.respawn[1]) : 1.5;
      }
    }
    for (const m of entities) updateMonster(m, dt, player, rect);
    for (let i = entities.length - 1; i >= 0; i--) if (entities[i].dead) entities.splice(i, 1);
  }

  // 플레이어가 몬스터 쪽으로 파고드는 이동인지 확인
  function blocksPlayer(nx, ny, px, py) {
    for (const m of entities) {
      if (m.fading) continue;
      const dNew = dist(nx, ny, m.x, m.y);
      if (dNew < R_PLAYER && dNew < dist(px, py, m.x, m.y)) return true;
    }
    return false;
  }

  function init(reg, player, rect) {
    region = reg;
    rules = reg.monsters;
    entities.length = 0;
    respawnTimer = rnd(rules.respawn[0], rules.respawn[1]);
    for (let i = 0; i < rules.target; i++) spawnOne(player, rect);
  }

  function clear() {
    entities.length = 0;
  }

  return { entities, init, clear, update, blocksPlayer, rollDef };
})();
</script>
  <script>
// 가상 조이스틱: 터치와 마우스를 Pointer Events로 함께 처리
const Input = (() => {
  const DEAD_ZONE = 0.12;
  const state = { x: 0, y: 0, active: false };

  const joy = document.getElementById('joy');
  const base = document.getElementById('joy-base');
  const knob = document.getElementById('joy-knob');
  let pointerId = null;
  let cx = 0, cy = 0;

  function update(clientX, clientY) {
    const dx = clientX - cx;
    const dy = clientY - cy;
    const dist = Math.hypot(dx, dy);
    const maxR = base.clientWidth * 0.3; // 노브가 움직일 수 있는 최대 거리
    const travel = Math.min(dist, maxR);
    const nx = dist > 0 ? dx / dist : 0;
    const ny = dist > 0 ? dy / dist : 0;

    knob.style.transform = `translate(${nx * travel}px, ${ny * travel}px)`;

    const mag = travel / maxR;
    if (mag < DEAD_ZONE) {
      state.x = 0; state.y = 0; state.active = false;
      return;
    }
    state.x = nx * mag;
    state.y = ny * mag;
    state.active = true;
  }

  function release() {
    pointerId = null;
    state.x = 0; state.y = 0; state.active = false;
    knob.style.transform = '';
  }

  joy.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    pointerId = e.pointerId;
    joy.setPointerCapture(e.pointerId);
    const r = base.getBoundingClientRect();
    cx = r.left + r.width / 2;
    cy = r.top + r.height / 2;
    update(e.clientX, e.clientY);
  });

  joy.addEventListener('pointermove', (e) => {
    if (e.pointerId !== pointerId) return;
    e.preventDefault();
    update(e.clientX, e.clientY);
  });

  const end = (e) => {
    if (e.pointerId !== pointerId) return;
    release();
  };
  joy.addEventListener('pointerup', end);
  joy.addEventListener('pointercancel', end);
  joy.addEventListener('lostpointercapture', end);

  window.addEventListener('contextmenu', (e) => e.preventDefault());

  return {
    get: () => state,
    reset: release,
  };
})();

  <script>
// 게임 루프: 탐험지 선택/입장, 플레이어 이동/충돌, 카메라, 렌더링
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const hudName = document.getElementById('hud-name');
  const field = document.getElementById('field');

  const SPEED = 46;                  // 최대 이동 속도 (논리 픽셀/초)
  const HALF_W = 3;                  // 발 판정 박스 반너비
  const HEIGHT_FEET = 3;             // 발 판정 박스 높이
  const BG = '#1c2b1f';

  const view = { w: 0, h: 0, zoom: 1, sx: 1, sy: 1, dpr: 1 }; // sx, sy: 논리 픽셀 -> 실제 기기 픽셀 배율
  const cam = { x: 0, y: 0 };
  const player = { x: 0, y: 0, vx: 0, vy: 0, dir: 'down', walkT: 0, frame: 2 };

  let running = false;
  let rafId = 0;
  let last = 0;

  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const mapW = () => World.COLS * World.TILE;
  const mapH = () => World.ROWS * World.TILE;

  // ---------- 화면 크기 ----------
  // 논리 해상도는 정수 배율로 맞추고, 캔버스 백버퍼는 기기 픽셀 단위로 만든다.
  // 이렇게 하면 이동을 기기 픽셀 단위로 표현할 수 있어 대각선에서도 끊김이 줄어든다.
  function fit() {
    // 탐험 필드 영역을 기준으로 화면 크기를 계산한다 (하단 메뉴 영역은 제외)
    const cw = field.clientWidth, ch = field.clientHeight;
    if (!cw || !ch) return;
    const dpr = window.devicePixelRatio || 1;
    view.dpr = dpr;
    view.zoom = Math.max(1, Math.min(Math.floor(cw / 160), Math.floor(ch / 140)));
    view.w = Math.floor(cw / view.zoom);
    view.h = Math.floor(ch / view.zoom);
    const cssW = view.w * view.zoom, cssH = view.h * view.zoom;
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    view.sx = canvas.width / view.w;
    view.sy = canvas.height / view.h;
    if (running) updateCamera();
  }

  // ---------- 카메라 ----------
  // 보간 없이 플레이어를 그대로 따라가므로 플레이어의 화면 위치가 항상 일정하다.
  // 맵 경계에서만 카메라가 멈추고 그때는 플레이어가 움직인다.
  function updateCamera() {
    const tx = player.x - view.w / 2;
    const ty = player.y - 8 - view.h / 2;
    cam.x = mapW() <= view.w ? (mapW() - view.w) / 2 : clamp(tx, 0, mapW() - view.w);
    cam.y = mapH() <= view.h ? (mapH() - view.h) / 2 : clamp(ty, 0, mapH() - view.h);
  }

  // ---------- 이동 / 충돌 ----------
  // 한 축으로 이동. 0.5px 이하 단위로 나눠 전진하며, 막히면 그 축 속도만 0으로 만든다
  function moveAxis(axis, delta) {
    if (delta === 0) return;
    const steps = Math.ceil(Math.abs(delta) / 0.5);
    const s = delta / steps;
    for (let i = 0; i < steps; i++) {
      const nx = axis === 'x' ? player.x + s : player.x;
      const ny = axis === 'y' ? player.y + s : player.y;
      if (World.blocked(nx - HALF_W, ny - HEIGHT_FEET, nx + HALF_W, ny + 1) ||
          Monsters.blocksPlayer(nx, ny, player.x, player.y)) {
        if (axis === 'x') player.vx = 0; else player.vy = 0;
        return;
      }
      player.x = nx;
      player.y = ny;
    }
  }

  function update(dt) {
    const inp = Input.get();
    const tvx = inp.active ? inp.x * SPEED : 0;
    const tvy = inp.active ? inp.y * SPEED : 0;

    // 가속/감속을 나눠 부드럽게 움직이고 멈춘다
    const k = 1 - Math.exp(-dt * (inp.active ? 16 : 24));
    player.vx += (tvx - player.vx) * k;
    player.vy += (tvy - player.vy) * k;
    if (Math.abs(player.vx) < 0.01) player.vx = 0;
    if (Math.abs(player.vy) < 0.01) player.vy = 0;

    moveAxis('x', player.vx * dt);
    moveAxis('y', player.vy * dt);

    const speed = Math.hypot(player.vx, player.vy);
    if (speed > 4) {
      if (Math.abs(player.vx) > Math.abs(player.vy)) player.dir = player.vx > 0 ? 'right' : 'left';
      else player.dir = player.vy > 0 ? 'down' : 'up';
      player.walkT += dt * speed * 0.1;
      player.frame = Math.floor(player.walkT) % 2;
    } else {
      player.walkT = 0;
      player.frame = 2;
    }
  }

  // ---------- 렌더링 ----------
  const snapX = (v) => Math.round(v * view.sx) / view.sx;
  const snapY = (v) => Math.round(v * view.sy) / view.sy;

  function render() {
    ctx.setTransform(view.sx, 0, 0, view.sy, 0, 0);
    ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, view.w, view.h);

    // 월드는 기기 픽셀 단위로 맞춘 카메라 값 하나로 모두 그린다
    const ox = snapX(cam.x), oy = snapY(cam.y);
    if (World.ground) ctx.drawImage(World.ground, -ox, -oy);

    // 플레이어/몬스터는 카메라와 같은 원본 좌표 차이로 그려 화면 위치가 흔들리지 않는다
    const dyn = [{ y: player.y, draw: drawPlayer }];
    for (const m of Monsters.entities) dyn.push({ y: m.y, draw: () => drawMonster(m) });
    dyn.sort((a, b) => a.y - b.y);

    // 오브젝트(baseY)와 움직이는 개체(발 위치 y)를 깊이 순서대로 섞어 그린다
    let di = 0;
    for (const o of World.objects) {
      while (di < dyn.length && dyn[di].y < o.baseY) dyn[di++].draw();
      const sx = o.x - ox, sy = o.y - oy;
      if (sx > view.w || sy > view.h || sx + o.w < 0 || sy + o.h < 0) continue;
      ctx.drawImage(o.img, sx, sy);
    }
    while (di < dyn.length) dyn[di++].draw();

    drawMonsterLabels();
  }

  function drawPlayer() {
    const img = Sprites.player[player.dir][player.frame];
    ctx.drawImage(img, snapX(player.x - 7 - cam.x), snapY(player.y - 17 - cam.y));
  }

  function drawMonster(m) {
    const set = Sprites.monsters[m.def.sprite];
    const img = (m.dir < 0 ? set.left : set.right)[m.frame];
    const x = snapX(m.x - img.width / 2 - cam.x);
    const y = snapY(m.y - (img.height - 1) - cam.y);
    const rarity = MonsterRarities[m.def.rarity];

    ctx.globalAlpha = Math.max(0, m.fade);
    ctx.drawImage(img, x, y);
    ctx.globalAlpha = 1;

    if (rarity.sparkle && !m.fading) {
      // 희귀 몬스터 주변에서 반짝이는 빛
      const t = performance.now() / 1000;
      for (let i = 0; i < 3; i++) {
        const a = t * 2 + i * 2.1;
        const px = x + img.width / 2 + Math.cos(a) * (img.width * 0.65);
        const py = y + img.height / 2 + Math.sin(a * 1.3) * (img.height * 0.55);
        ctx.globalAlpha = 0.5 + 0.5 * Math.sin(t * 6 + i * 2);
        ctx.fillStyle = i === 1 ? '#ffffff' : '#ffd84a';
        ctx.fillRect(snapX(px), snapY(py), 1, 1);
      }
      ctx.globalAlpha = 1;
    }

    if (m.alert > 0) {
      ctx.drawImage(Sprites.alert, snapX(x + img.width - 2), snapY(y - 8));
    }
  }

  // 이름표: 기기 해상도로 그린 깔끔한 알약 모양. 멀어지면 서서히 사라진다
  const LABEL_FULL = 80, LABEL_HIDE = 115;
  const FONT = '"Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif';
  function pill(x, y, w, h) {
    const r = h / 2;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function drawMonsterLabels() {
    const d0 = view.dpr;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.font = `700 ${Math.round(11 * d0)}px ${FONT}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (const m of Monsters.entities) {
      const d = Math.hypot(m.x - player.x, m.y - player.y);
      if (d >= LABEL_HIDE) continue;
      const rarity = MonsterRarities[m.def.rarity];
      const img = Sprites.monsters[m.def.sprite].right[0];
      const cx = snapX(m.x - cam.x) * view.sx;
      const bottom = snapY(m.y - (img.height - 1) - cam.y) * view.sy - 3 * d0;
      const text = (rarity.mark ? rarity.mark + ' ' : '') + m.def.name;
      const h = 18 * d0, w = ctx.measureText(text).width + 16 * d0;
      ctx.globalAlpha = Math.min(1, (LABEL_HIDE - d) / (LABEL_HIDE - LABEL_FULL)) * Math.max(0, m.fade);
      ctx.fillStyle = rarity.pillColor;
      pill(cx - w / 2, bottom - h, w, h);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.fillText(text, cx, bottom - h / 2 + 0.5 * d0);
    }
    ctx.globalAlpha = 1;
  }

  function frame(now) {
    if (!running) return;
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    updateCamera();
    Monsters.update(dt, player, { x: cam.x, y: cam.y, w: view.w, h: view.h });
    render();
    rafId = requestAnimationFrame(frame);
  }

  // ---------- 탐험지 입장 / 나가기 ----------
  function enterRegion(region) {
    World.load(region);
    player.x = region.spawn.tx * World.TILE + World.TILE / 2;
    player.y = region.spawn.ty * World.TILE + 12;
    player.vx = 0;
    player.vy = 0;
    player.dir = 'down';
    player.walkT = 0;
    player.frame = 2;
    Input.reset();

    hudName.textContent = region.name;
    document.body.dataset.screen = 'play';
    running = true;
    fit();
    updateCamera();
    Monsters.init(region, player, { x: cam.x, y: cam.y, w: view.w, h: view.h });
    last = performance.now();
    cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(frame);
  }

  function exitRegion() {
    running = false;
    cancelAnimationFrame(rafId);
    Monsters.clear();
    Input.reset();
    document.body.dataset.screen = 'menu';
  }

  // ---------- 선택 화면 ----------
  function resolveSprite(key, i) {
    let o = Sprites;
    for (const part of key.split('.')) o = o[part];
    return o.right ? o.right[i] : o[i];
  }

  // 지역 카드 썸네일: 잔디 바탕에 지역 대표 오브젝트를 배치 (잠긴 지역은 자물쇠)
  function makeThumb(region) {
    const c = document.createElement('canvas');
    c.className = 'thumb';
    c.width = 44;
    c.height = 44;
    const g = c.getContext('2d');
    g.drawImage(Sprites.makeGrassPattern(44, 44), 0, 0);
    if (region.locked) {
      g.fillStyle = '#e6e9f0';
      g.fillRect(0, 0, 44, 44);
      const r = (x, y, w, h, col) => { g.fillStyle = col; g.fillRect(x, y, w, h); };
      r(15, 12, 14, 4, '#a2a8b5'); r(15, 12, 4, 12, '#a2a8b5'); r(25, 12, 4, 12, '#a2a8b5');
      r(16, 13, 2, 11, '#f6f7fb'); r(26, 13, 2, 11, '#f6f7fb'); r(16, 13, 12, 2, '#f6f7fb');
      r(11, 22, 22, 15, '#a2a8b5'); r(12, 23, 20, 13, '#c9cfdb'); r(12, 33, 20, 3, '#b3bac9');
      r(21, 27, 2, 5, '#8a91a1');
    } else {
      for (const [key, i, x, y] of region.thumb || []) g.drawImage(resolveSprite(key, i), x, y);
    }
    return c;
  }

  function buildMenu() {
    const list = document.getElementById('region-list');
    for (const region of Regions) {
      const li = document.createElement('li');
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'region-card' + (region.locked ? ' locked' : '');
      btn.disabled = !!region.locked;

      const text = document.createElement('div');
      text.innerHTML = '<h2></h2><p></p><span class="badge"></span>';
      text.querySelector('h2').textContent = region.name;
      text.querySelector('p').textContent = region.desc;
      text.querySelector('.badge').textContent = region.locked ? '준비 중' : '입장 가능';

      btn.append(makeThumb(region), text);
      if (!region.locked) btn.addEventListener('click', () => enterRegion(region));
      li.appendChild(btn);
      list.appendChild(li);
    }
  }

  document.getElementById('exit-btn').addEventListener('click', exitRegion);
  window.addEventListener('resize', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(field);
  buildMenu();

  // 테스트용 참조
  window.__game = { player, cam, view, World, Monsters, enterRegion, exitRegion };
})();
</script>
</body>
</html>
