  <script>
// Battle 시스템 — 턴제 전투 규칙. 화면은 모르고 이벤트로만 통신한다.
//   수신 'battle:request' { monster }       필드에서 몬스터에게 닿음 -> 전투 시작
//   수신 'battle:command' { type, id }      type: 'skill'(id=기술) | 'item'(id=물약) | 'flee'
//   수신 'battle:finish'                    화면이 결과 연출을 마침 -> 전투 종료
//   발신 'battle:start' { enemy, player, intro }
//   발신 'battle:steps' { steps, outcome }  steps 를 차례로 보여 준다. outcome: null | 'win' | 'lose' | 'flee'
//   발신 'battle:rewards' payload           승리 보상: { monster, exp, gold, weaponExp, drops, steps }
//        Character/Economy/Equipment/Inventory 가 각자 지급하고 payload.steps 에 보여 줄 메시지를 덧붙인다.
//   발신 'battle:end' { outcome, monster }  월드가 결과를 반영한다 (몬스터 제거, 패배 시 마을 복귀 등)
//   발신 'inventory:consume' { id }         물약 사용
// 한 턴: 플레이어가 명령을 내리면 먼저 실행되고, 상대가 살아 있으면 상대가 한 번 공격한다.
Game.register('battle', {
  init({ Events, GameState }) {
    const GROWTH = 0.12;          // 몬스터 레벨이 최소 레벨보다 1 높을 때마다 스탯 +12%
    const CRIT_CHANCE = 0.06;
    let b = null;                 // 진행 중인 전투

    const rand = (a, z) => a + Math.random() * (z - a);
    const josa = Util.josa;

    function enemyStats(m) {
      const d = m.def;
      const k = 1 + GROWTH * (m.level - d.level[0]);
      return { hp: Math.round(d.stats.hp * k), atk: Math.round(d.stats.atk * k), def: Math.round(d.stats.def * k), spd: d.stats.spd };
    }

    // atk: 공격력, power: 기술 배율, def: 상대 방어력
    function damage(atk, def, skill) {
      const crit = Math.random() < CRIT_CHANCE + (skill.critBonus || 0);
      const effDef = def * (1 - (skill.ignoreDef || 0));
      const base = atk * skill.power * rand(0.85, 1.15) - effDef * 0.5;
      return { dmg: Math.max(1, Math.round(base * (crit ? 1.5 : 1))), crit };
    }

    const heroBars = () => {
      const p = GameState.get('player');
      return { hero: { hp: p.hp, mp: p.mp, maxHp: p.maxHp, maxMp: p.maxMp } };
    };

    // 상대가 한 번 공격
    function enemyTurn(steps) {
      const p = GameState.get('player');
      const { dmg, crit } = damage(b.enemy.atk, Stats.total().def, { power: 1 });
      const hp = Math.max(0, p.hp - dmg);
      GameState.patch('player', { hp });
      steps.push({ text: `${b.name}의 공격!`, anim: 'enemy-attack' });
      steps.push({ text: `${josa(p.name, '은/는')} ${dmg}의 데미지를 입었다!${crit ? ' 급소에 맞았다!' : ''}`, anim: 'hero-hit', hp: heroBars() });
      if (hp <= 0) {
        steps.push({ text: `${josa(p.name, '은/는')} 쓰러졌다...`, anim: 'hero-faint' });
        b.outcome = 'lose';
      }
    }

    // 승리: 경험치/골드/무기 경험치. 지급과 메시지는 각 시스템이 payload 에 덧붙인다
    function win(steps) {
      const d = b.monster.def;
      const k = 1 + GROWTH * (b.monster.level - d.level[0]);
      const exp = Math.round(d.exp * k);
      const payload = {
        monster: b.monster, exp,
        gold: Math.round((d.gold[0] + Math.random() * (d.gold[1] - d.gold[0])) * k),
        weaponExp: Math.max(1, Math.round(exp * 0.8)),
        drops: (d.drops || []).filter((x) => Math.random() < x.chance).map((x) => ({
          id: x.id, count: x.count ? x.count[0] + Math.floor(Math.random() * (x.count[1] - x.count[0] + 1)) : 1,
        })),
        steps: [],
      };
      Events.emit('battle:rewards', payload);
      steps.push(...payload.steps);
      b.outcome = 'win';
    }

    function useSkill(cmd, steps) {
      const p = GameState.get('player');
      const known = GameState.get('skills').known;
      const skill = SkillData[cmd.id];
      if (!skill || !(known.includes(cmd.id) || (cmd.id === 'punch' && !known.length))) return false;
      if (p.mp < skill.mp) {
        steps.push({ text: 'MP가 부족하다!' });                     // 턴을 쓰지 않는다
        return true;
      }
      if (skill.mp) GameState.patch('player', { mp: p.mp - skill.mp });
      steps.push({ text: `${p.name}의 ${skill.name}!`, anim: 'hero-attack', hp: heroBars() });
      const atk = Stats.total().atk;
      for (let i = 0; i < (skill.hits || 1); i++) {
        const { dmg, crit } = damage(atk, b.enemy.def, skill);
        b.enemy.hp = Math.max(0, b.enemy.hp - dmg);
        steps.push({ text: `${b.name}에게 ${dmg}의 데미지!${crit ? ' 급소에 맞았다!' : ''}`, anim: 'enemy-hit', hp: { enemy: { hp: b.enemy.hp } } });
        if (b.enemy.hp <= 0) break;
      }
      if (b.enemy.hp <= 0) {
        steps.push({ text: `${josa(b.name, '을/를')} 쓰러뜨렸다!`, anim: 'enemy-faint' });
        win(steps);
      } else {
        enemyTurn(steps);
      }
      return true;
    }

    function resolve(cmd) {
      const p = GameState.get('player');
      const steps = [];

      if (cmd.type === 'skill') {
        if (!useSkill(cmd, steps)) return;
      } else if (cmd.type === 'item') {
        const def = ItemData[cmd.id];
        const held = GameState.get('inventory').items.find((it) => it.id === cmd.id);
        if (!def || !def.use || !held) return;
        Events.emit('inventory:consume', { id: cmd.id });
        const hp = Math.min(p.maxHp, p.hp + (def.use.hp || 0));
        const mp = Math.min(p.maxMp, p.mp + (def.use.mp || 0));
        GameState.patch('player', { hp, mp });
        steps.push({ text: `${josa(p.name, '은/는')} ${josa(def.name, '을/를')} 사용했다!`, anim: 'heal', hp: heroBars() });
        enemyTurn(steps);
      } else if (cmd.type === 'flee') {
        if (b.boss) {
          steps.push({ text: '이 상대에게서는 도망칠 수 없다!' });          // 턴을 쓰지 않는다
        } else {
          const chance = Math.max(0.25, Math.min(0.9, 0.6 + (Stats.total().spd - b.enemy.spd) * 0.03));
          if (Math.random() < chance) {
            steps.push({ text: '무사히 도망쳤다!', anim: 'flee' });
            b.outcome = 'flee';
          } else {
            steps.push({ text: '도망치지 못했다!' });
            enemyTurn(steps);
          }
        }
      } else {
        return;
      }
      Events.emit('battle:steps', { steps, outcome: b.outcome });
    }

    Events.on('battle:request', ({ monster }) => {
      if (b) return;
      const es = enemyStats(monster);
      const boss = monster.def.rarity === 'boss';
      b = { monster, boss, name: monster.def.name, enemy: { ...es, maxHp: es.hp }, outcome: null };
      const p = GameState.get('player');
      Events.emit('battle:start', {
        enemy: { name: b.name, level: monster.level, hp: es.hp, maxHp: es.hp, sprite: monster.def.sprite, rarity: monster.def.rarity, boss },
        player: { name: p.name, level: p.level, hp: p.hp, maxHp: p.maxHp, mp: p.mp, maxMp: p.maxMp },
        intro: [{ text: boss ? `${josa(b.name, '이/가')} 길을 막아섰다!` : `야생의 ${josa(b.name, '이/가')} 나타났다!` }],
      });
    });

    Events.on('battle:command', (cmd) => {
      if (!b || b.outcome) return;
      resolve(cmd);
    });

    Events.on('battle:finish', () => {
      if (!b) return;
      const { outcome, monster } = b;
      b = null;
      Events.emit('battle:end', { outcome: outcome || 'flee', monster });
    });
  },
});
</script>
  <script>
// Character 시스템 — 캐릭터 경험치/레벨업, 기술(최대 4개) 습득과 교체.
//   수신 'battle:rewards' payload        경험치 지급 (payload.steps 에 전투 화면용 메시지를 덧붙인다)
//   수신 'skill:offer' { skill, source, weaponName, steps }
//        빈 칸이 있으면 바로 배운다. 가득 찼고 전투 중(steps 있음)이면 'learn' 단계를 넣어 화면이 하나를 잊을지 묻게 한다.
//   수신 'skill:decide' { skill, source, forget }  화면에서 고른 결과 (forget: 잊을 기술 id, 없으면 배우지 않음)
//   발신 'skill:decided' { skill, source, learned }
Game.register('character', {
  init({ Events, GameState }) {
    const G = Progression.charGrowth;

    Events.on('battle:rewards', (r) => {
      const p = GameState.get('player');
      if (p.level >= Progression.MAX_LEVEL) return;
      r.steps.push({ text: `경험치 ${r.exp}을(를) 얻었다!` });

      let { level, exp, maxHp, maxMp, hp, mp, atk, def, spd } = p;
      exp += r.exp;
      while (level < Progression.MAX_LEVEL && exp >= Progression.charExpToNext(level)) {
        exp -= Progression.charExpToNext(level);
        level++;
        maxHp += G.maxHp; hp += G.maxHp;
        maxMp += G.maxMp; mp += G.maxMp;
        atk += G.atk; def += G.def; spd += G.spd;
        r.steps.push({ text: `${p.name}의 레벨이 올랐다! (Lv.${level})`, anim: 'heal', hp: { hero: { hp, mp, maxHp, maxMp } } });
        r.steps.push({ text: `최대 HP +${G.maxHp}, 최대 MP +${G.maxMp}, 공격 +${G.atk}, 방어 +${G.def}, 속도 +${G.spd}` });
      }
      GameState.patch('player', { level, exp, maxHp, maxMp, hp, mp, atk, def, spd });
    });

    Events.on('skill:offer', ({ skill, source, steps }) => {
      const known = GameState.get('skills').known;
      const def = SkillData[skill];
      if (known.includes(skill)) {
        Events.emit('skill:decided', { skill, source, learned: true });
        return;

      if (known.length < Progression.MAX_SKILLS) {
        GameState.patch('skills', { known: [...known, skill] });
        if (steps) steps.push({ text: `새로운 기술 ${Util.q(def.name, '을/를')} 배웠다!`, anim: 'heal' });
        else Events.emit('toast', { text: `기술 ${Util.q(def.name, '을/를')} 배웠어요.` });
        Events.emit('skill:decided', { skill, source, learned: true });
      } else if (steps) {
        steps.push({ type: 'learn', skill, source });
      }
    });

    Events.on('skill:decide', ({ skill, source, forget }) => {
      const known = GameState.get('skills').known.slice();
      const i = forget ? known.indexOf(forget) : -1;
      if (i >= 0) {
        known[i] = skill;
        GameState.patch('skills', { known });
      }
      Events.emit('skill:decided', { skill, source, learned: i >= 0 });
    });
  },
});

  <script>
// Inventory 시스템 — 아이템 보유, 꾸러미 열기, 장비 인스턴스 생성.
// 쌓이는 아이템(꾸러미/물약)은 GameState.inventory, 장비(무기/방어구)는 한 개씩 레벨·등급을 가지므로 GameState.gear 에 둔다.
//   수신 'item:gain'      { id, count }  아이템 획득 (장비는 count 개의 새 장비가 만들어진다)
//   수신 'inventory:use'  { id }         꾸러미 열기
//   수신 'inventory:consume' { id }      한 개 소모 (전투 중 물약 사용)
//   발신 'inventory:changed'              가방 내용이 바뀜
//   발신 'gear:added' { uid }             새 장비가 생김 (장착 여부는 Equipment 가 정한다)
//   발신 'inventory:opened' { id, gained } 꾸러미를 열어 gained 를 얻음
Game.register('inventory', {
  init({ Events, GameState }) {
    let uidSeq = 1;
    const isGear = (id) => ItemData[id].type === 'weapon' || ItemData[id].type === 'armor';
    const sorted = (items) => items.sort((a, b) =>
      ItemTypes[ItemData[a.id].type].order - ItemTypes[ItemData[b.id].type].order);

    function add(list, id, count) {
      const found = list.find((it) => it.id === id);
      if (found) found.count += count;
      else list.push({ id, count });
    }

    function gain(entries) {
      const list = GameState.get('inventory').items.map((it) => ({ ...it }));
      const gear = GameState.get('gear').list;
      const added = [];
      for (const { id, count } of entries) {
        if (!ItemData[id]) continue;
        if (isGear(id)) {
          for (let i = 0; i < count; i++) {
            const inst = { uid: 'g' + uidSeq++, id, level: 1, exp: 0, grade: 1, offered: [] };
            gear.push(inst);
            added.push(inst.uid);
          }
        } else {
          add(list, id, count);
        }
      }
      GameState.patch('inventory', { items: sorted(list) });
      GameState.patch('gear', { list: gear });
      Events.emit('inventory:changed');
      for (const uid of added) Events.emit('gear:added', { uid });
    }

    Events.on('item:gain', ({ id, count }) => gain([{ id, count: count || 1 }]));

    // 전투 보상으로 떨어진 아이템
    Events.on('battle:rewards', (r) => {
      for (const d of r.drops || []) {
        if (!ItemData[d.id]) continue;
        gain([d]);
        r.steps.push({ text: `${ItemData[d.id].name} ${d.count}개를 얻었다!` });
      }
    });

    // 불러온 장비 uid 와 겹치지 않도록 번호를 이어 간다
    Events.on('game:loaded', () => {
      uidSeq = GameState.get('gear').list.reduce((m, g) => Math.max(m, parseInt(g.uid.slice(1), 10) || 0), 0) + 1;
    });
    Events.on('game:new', () => { uidSeq = 1; });

    function consume(id) {
      const items = GameState.get('inventory').items;
      const held = items.find((it) => it.id === id);
      if (!held) return false;
      const list = items.map((it) => ({ ...it })).filter((it) => it.id !== id || it.count > 1);
      const left = list.find((it) => it.id === id);
      if (left) left.count -= 1;
      GameState.patch('inventory', { items: list });
      return true;
    }

    Events.on('inventory:consume', ({ id }) => {
      if (consume(id)) Events.emit('inventory:changed');
    });

    Events.on('inventory:use', ({ id }) => {
      const def = ItemData[id];
      if (!def || def.type !== 'package' || !consume(id)) return;
      gain(def.contents);
      Events.emit('inventory:opened', { id, gained: def.contents.map((c) => ({ ...c })) });
    });
  },
});
</script>

  <script>
// Equipment 시스템 — 장비 장착, 무기 숙련(레벨), 무기에서 배우는 기술 제안.
// 무기는 전투를 하면 캐릭터처럼 경험치를 얻어 숙련 레벨이 오르고, 특정 레벨에서 새 기술을 배울 수 있다.
// 등급(grade)은 능력치 배율과 숙련 레벨 한계를 정한다. 등급을 올리는 일은 추후 대장장이(Crafting)가 맡는다.
//   수신 'gear:added' { uid }            새 장비 -> 해당 칸이 비어 있으면 자동 장착
//   수신 'equip:request' { uid }         장착 변경
//   수신 'gear:upgrade' { uid }          장비 등급 +1 (대장간 강화 성공)
//   수신 'battle:rewards' payload         무기 경험치 지급 (payload.steps 에 전투 화면용 메시지를 덧붙인다)
//   수신 'skill:decided' { source, skill } 제안한 기술에 대한 결정이 끝남 -> 다시 제안하지 않도록 기록
//   발신 'equipment:changed'
//   발신 'skill:offer' { skill, source, weaponName, steps }  배울 수 있는 기술이 생김 (Character 가 처리)
Game.register('equipment', {
  init({ Events, GameState }) {
    const gearList = () => GameState.get('gear').list;
    const find = (uid) => gearList().find((g) => g.uid === uid);

    function setSlot(slot, uid) {
      GameState.patch('equipment', { [slot]: uid });
      Events.emit('equipment:changed');
    }

    // 이 무기의 숙련 레벨로 배울 수 있는 기술 중, 아직 제안하지 않은 것을 제안한다
    function offerSkills(inst, steps) {
      const w = ItemData[inst.id].weapon;
      if (!w) return;
      for (const u of w.skills) {
        if (u.level <= inst.level && !inst.offered.includes(u.skill)) {
          Events.emit('skill:offer', { skill: u.skill, source: inst.uid, weaponName: ItemData[inst.id].name, steps });
        }
      }
    }

    Events.on('gear:added', ({ uid }) => {
      const inst = find(uid);
      const slot = ItemData[inst.id].type;
      if (GameState.get('equipment')[slot]) return;
      setSlot(slot, uid);
      if (slot === 'weapon') offerSkills(inst, null);
    });

    Events.on('equip:request', ({ uid }) => {
      const inst = find(uid);
      if (!inst) return;
      const slot = ItemData[inst.id].type;
      if (GameState.get('equipment')[slot] === uid) return;
      setSlot(slot, uid);
      if (slot === 'weapon') offerSkills(inst, null);
      Events.emit('toast', { text: `${Util.josa(ItemData[inst.id].name, '을/를')} 장착했어요.` });
    });

    // 대장간 강화 성공: 등급이 한 단계 오른다
    Events.on('gear:upgrade', ({ uid }) => {
      const inst = find(uid);
      if (!inst || inst.grade >= Forge.maxGrade) return;
      inst.grade += 1;
      GameState.patch('gear', { list: gearList() });
      Events.emit('equipment:changed');
    });

    Events.on('skill:decided', ({ source, skill }) => {
      const inst = find(source);
      if (inst && !inst.offered.includes(skill)) {
        inst.offered.push(skill);
        GameState.patch('gear', { list: gearList() });
      }
    });

    Events.on('battle:rewards', (r) => {
      const inst = Stats.equipped('weapon');
      if (!inst) return;
      const def = ItemData[inst.id];
      const cap = Progression.weaponMaxLevel(inst.grade);
      if (inst.level >= cap) return;   // 한계: 등급을 올려야 더 성장한다

      inst.exp += r.weaponExp;
      r.steps.push({ text: `${def.name}의 숙련 경험치 ${r.weaponExp}을(를) 쌓았다!` });
      while (inst.level < cap && inst.exp >= Progression.weaponExpToNext(inst.level)) {
        inst.exp -= Progression.weaponExpToNext(inst.level);
        inst.level++;
        r.steps.push({ text: `${def.name}의 숙련 레벨이 올랐다! (Lv.${inst.level})`, anim: 'heal' });
        offerSkills(inst, r.steps);
      }
      if (inst.level >= cap) {
        inst.exp = 0;
        r.steps.push({ text: `${def.name}의 숙련이 한계에 이르렀다. 등급을 올리면 더 성장할 수 있다!` });
      }
      GameState.patch('gear', { list: gearList() });
    });
  },
});
</script>

Game.register('crafting', {
  init({ Events, GameState }) {
    Events.on('forge:enhance', ({ uid, materialId }) => {
      const inst = GameState.get('gear').list.find((g) => g.uid === uid);
      const mat = ItemData[materialId];
      const held = GameState.get('inventory').items.find((it) => it.id === materialId);
      if (!inst || !mat || !mat.forge || !held) return;
      if (inst.grade >= Forge.maxGrade) return;

      const chance = Forge.chance(inst.grade, mat);
      const from = inst.grade;
      Events.emit('inventory:consume', { id: materialId });
      const success = Math.random() < chance;
      if (success) Events.emit('gear:upgrade', { uid });
      Events.emit('forge:result', { success, uid, from, to: success ? from + 1 : from, chance, materialId });
    });

// Save 시스템 — 세이브 파일 3개 저장/불러오기, 10분마다 자동 저장.
//   수신 'save:request' { slot }   저장 (slot 생략 시 현재 슬롯)
//   수신 'save:new' { slot }       빈 슬롯으로 새 게임 시작 -> 상태 초기화 후 'game:new'
//   수신 'save:load' { slot }      슬롯 불러오기 -> 상태 복원 후 'game:loaded' { data }
//   수신 'game:quit'               타이틀로 돌아감 (자동 저장 중지)
//   발신 'save:collect' payload    월드가 현재 위치/플레이 시간을 payload 에 채운다 (전투 중이면 payload.blocked = true)
//   발신 'save:done' { slot, auto }
// 월드(위치) 정보는 이 시스템이 모르므로 'save:collect' 로 받아 온다.
Game.register('save', {
  init({ Events, GameState }) {
    const AUTOSAVE_MS = 10 * 60 * 1000;
    const RETRY_MS = 5000;     // 전투 중이라 못 저장했을 때 다시 시도하는 간격
    let timer = 0;

    function save(slot, auto) {
      const c = { world: null, playSeconds: 0, blocked: false };
      Events.emit('save:collect', c);
      if (c.blocked || !c.world) return false;
      const ok = SaveStore.write(slot, { savedAt: Date.now(), state: GameState.snapshot(), world: c.world, playSeconds: c.playSeconds });
      if (!ok) {
        Events.emit('toast', { text: '저장에 실패했어요. (저장 공간을 확인해 주세요)' });
        return true;
      }
      SaveStore.current = slot;
      Events.emit('save:done', { slot, auto });
      Events.emit('toast', { text: auto ? `자동 저장했어요. (파일 ${slot})` : `파일 ${slot}에 저장했어요.` });
      return true;
    }

    function startTimer() {
      stopTimer();
      timer = setTimeout(function tick() {
        if (SaveStore.current && !save(SaveStore.current, true)) timer = setTimeout(tick, RETRY_MS);
        else timer = setTimeout(tick, AUTOSAVE_MS);
      }, AUTOSAVE_MS);
    }

    function stopTimer() {
      clearTimeout(timer);
    }

    Events.on('save:request', ({ slot }) => {
      const n = slot || SaveStore.current;
      if (n) save(n, false);
    });

    Events.on('save:new', ({ slot }) => {
      SaveStore.current = slot;
      GameState.reset();
      Events.emit('game:new', { slot });
      startTimer();
    });

    Events.on('save:load', ({ slot }) => {
      const data = SaveStore.read(slot);
      if (!data) return;
      SaveStore.current = slot;
      GameState.restore(data.state);
      Events.emit('game:loaded', { slot, data });
      startTimer();
    });

    Events.on('game:quit', () => {
      stopTimer();
      SaveStore.current = null;
    });
  },
});
</script>

// 가상 조이스틱: 하단 왼쪽에 고정 (터치/마우스 공용, Pointer Events)
const Input = (() => {
  const DEAD_ZONE = 0.12;
  const state = { x: 0, y: 0, active: false };

  const zone = document.getElementById('joy-zone');
  const base = document.getElementById('joy-base');
  const knob = document.getElementById('joy-knob');
  let pointerId = null;
  let enabled = true;     // 메뉴 화면/대화 중에는 입력을 받지 않는다
  let cx = 0, cy = 0;

  function update(clientX, clientY) {
    const dx = clientX - cx;
    const dy = clientY - cy;
    const dist = Math.hypot(dx, dy);
    const maxR = base.clientWidth * 0.3; // 노브가 움직일 수 있는 최대 거리
    const travel = Math.min(dist, maxR);
    const nx = dist > 0 ? dx / dist : 0;
    const ny = dist > 0 ? dy / dist : 0;

    knob.style.transform = `translate(${nx * travel}px, ${ny * travel}px)`;

    const mag = travel / maxR;
    if (mag < DEAD_ZONE) {
      state.x = 0; state.y = 0; state.active = false;
      return;
    }
    state.x = nx * mag;
    state.y = ny * mag;
    state.active = true;
  }

  function release() {
    pointerId = null;
    state.x = 0; state.y = 0; state.active = false;
    knob.style.transform = '';
  }

  zone.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (!enabled || pointerId !== null) return;
    pointerId = e.pointerId;
    zone.setPointerCapture(e.pointerId);
    const r = base.getBoundingClientRect();
    cx = r.left + r.width / 2;
    cy = r.top + r.height / 2;
    update(e.clientX, e.clientY);
  });

  zone.addEventListener('pointermove', (e) => {
    if (e.pointerId !== pointerId) return;
    e.preventDefault();
    update(e.clientX, e.clientY);
  });

  const end = (e) => {
    if (e.pointerId !== pointerId) return;
    release();
  };
  zone.addEventListener('pointerup', end);
  zone.addEventListener('pointercancel', end);
  zone.addEventListener('lostpointercapture', end);

  window.addEventListener('contextmenu', (e) => e.preventDefault());

  return {
    get: () => state,
    reset: release,
    setEnabled(on) {
      enabled = on;
      if (!on) release();
    },
  };
})();
</script>

    equip: { title: '장비', desc: '장비 목록이 들어갈 자리예요.' },     // ui/equip-screen.js 가 실제 화면을 등록
    system: { title: '저장', desc: '저장 화면이 들어갈 자리예요.' },     // ui/system-screen.js
    explore: { title: '탐험', desc: '탐험 지역 목록이 들어갈 자리예요.' }, // ui/explore-screen.js 가 실제 화면을 등록
    bag: { title: '가방', desc: '아이템 목록이 들어갈 자리예요.' },
    party: { title: '동료', desc: '동료 목록이 들어갈 자리예요.' },
    dex: { title: '도감', desc: '도감이 들어갈 자리예요.' },
    char: { title: '캐릭터', desc: '캐릭터 정보가 들어갈 자리예요.' },
  };

  // 기본 임시 콘텐츠
  function placeholder(id, def) {
    const btn = document.querySelector(`.dock-btn[data-menu="${id}"]`);
    const wrap = document.createElement('div');
    wrap.className = 'screen-placeholder';
    const icon = document.createElement('span');
    icon.className = 'screen-placeholder-icon';
    if (btn) icon.innerHTML = btn.querySelector('.dock-icon').innerHTML;
    const name = document.createElement('strong');
    name.textContent = '준비 중';
    const desc = document.createElement('p');
    desc.textContent = def.desc;
    wrap.append(icon, name, desc);
    return wrap;
  }

  function setCurrent(id) {
    // 열린 화면의 버튼만 강조한다 (화면이 없으면 필드를 보고 있는 상태)
    dockButtons.forEach((b) => b.classList.toggle('is-current', b.dataset.menu === id));
  }

  function open(id) {
    if (!defs[id]) return close();
    const prev = current;
    if (prev && prev !== id && defs[prev].onClose) defs[prev].onClose();
    const def = defs[id];
    current = id;
    titleEl.textContent = def.title;
    body.replaceChildren();
    if (def.render) def.render(body); // 실제 화면은 render(body) 에서 body 를 채운다
    else body.appendChild(placeholder(id, def));
    overlay.hidden = false;
    setCurrent(id);
    if (def.onOpen) def.onOpen();
    listeners.forEach((fn) => fn(current));
    Events.emit('ui:changed');
  }

  function close() {
    if (!current) return;
    const def = defs[current];
    current = null;
    overlay.hidden = true;
    body.replaceChildren();
    setCurrent(null);
    if (def.onClose) def.onClose();
    listeners.forEach((fn) => fn(null));
    Events.emit('ui:changed');
  }

  // 하단 메뉴 버튼: 다른 화면으로 전환하고, 열려 있는 화면의 버튼을 다시 누르면 닫는다
  dockButtons.forEach((b) => b.addEventListener('click', () => (current === b.dataset.menu ? close() : open(b.dataset.menu))));

  // 위쪽 화면의 뒤로 버튼 (하단 컨트롤의 뒤로와 같은 동작)
  document.getElementById('screen-back').addEventListener('click', () => back());

  // 하단 컨트롤에서 들어오는 조작을 현재 화면에 전달한다
  function nav(dir) {
    const def = current && defs[current];
    if (def && def.onNav) def.onNav(dir);
  }
  function confirm() {
    const def = current && defs[current];
    if (def && def.onConfirm) def.onConfirm();
  }
  function back() {
    const def = current && defs[current];
    if (def && def.onBack) def.onBack(); else close();
  }

  return {
    open,
    close,
    nav,
    confirm,
    back,
    get current() { return current; },
    onChange: (fn) => listeners.push(fn),
    // 실제 기능 구현 시 화면 정의를 덮어쓴다
    register: (id, def) => { defs[id] = Object.assign(defs[id] || {}, def); },
  };
})();
</script>

// 탐험 화면: 이동할 수 있는 장소(마을/탐험 지역) 목록. 선택하면 'location:request' 이벤트로 이동을 요청한다.
(() => {
  function resolveSprite(key, i) {
    let o = Sprites;
    for (const part of key.split('.')) o = o[part];
    if (o instanceof HTMLCanvasElement) return o;
    return o.right ? o.right[i] : o[i];
  }

  // 카드 썸네일: 잔디 바탕에 장소를 대표하는 그림 (잠긴 지역은 자물쇠)
  function makeThumb(region) {
    const size = region.thumbSize || 44;
    const c = document.createElement('canvas');
    c.className = 'thumb';
    c.width = size;
    c.height = size;
    const g = c.getContext('2d');
    g.drawImage(Sprites.makeGrassPattern(size, size), 0, 0);
    if (region.locked) {
      g.fillStyle = '#efe4cc';
      g.fillRect(0, 0, size, size);
      const r = (x, y, w, h, col) => { g.fillStyle = col; g.fillRect(x, y, w, h); };
      r(15, 12, 14, 4, '#b5a58b'); r(15, 12, 4, 12, '#b5a58b'); r(25, 12, 4, 12, '#b5a58b');
      r(16, 13, 2, 11, '#fff8ec'); r(26, 13, 2, 11, '#fff8ec'); r(16, 13, 12, 2, '#fff8ec');
      r(11, 22, 22, 15, '#b5a58b'); r(12, 23, 20, 13, '#d6c8ad'); r(12, 33, 20, 3, '#c4b596');
      r(21, 27, 2, 5, '#9a8a6d');
    } else {
      for (const [key, i, x, y] of region.thumb || []) g.drawImage(resolveSprite(key, i), x, y);
    }
    return c;
  }

  function card(region, here, onTap) {
    const li = document.createElement('li');
    const box = document.createElement('div'); // 한 번 누르면 선택, 선택된 카드를 다시 누르면 이동
    box.className = 'region-card' + (region.locked ? ' locked' : '') + (here ? ' is-here' : '');
    box.addEventListener('click', onTap);

    const text = document.createElement('div');
    text.innerHTML = '<h3></h3><p></p><span class="badge"></span>';
    text.querySelector('h3').textContent = region.name;
    text.querySelector('p').textContent = region.desc;
    text.querySelector('.badge').textContent =
      region.locked ? '준비 중' : here ? '현재 위치' : region.type === 'village' ? '마을로 이동' : '입장 가능';

    box.append(makeThumb(region), text);
    li.appendChild(box);
    return li;
  }

  let items = [];     // 카드 요소
  let selected = 0;   // 커서 위치

  function select(i) {
    selected = (i + items.length) % items.length;
    items.forEach((el, n) => el.classList.toggle('is-selected', n === selected));
    items[selected].scrollIntoView({ block: 'nearest' });
  }

  Screens.register('explore', {
    title: '탐험',
    render(body) {
      const hint = document.createElement('p');
      hint.className = 'explore-hint';
      hint.textContent = '장소를 눌러 고르고, 한 번 더 누르거나 확인 버튼으로 이동해요.';
      const list = document.createElement('ul');
      list.className = 'region-list';
      const here = GameState.get('location').id;
      items = [];
      Regions.forEach((region) => {
        const idx = items.length;
        const li = card(region, region.id === here, () => (idx === selected ? confirm() : select(idx)));
        list.appendChild(li);
        items.push(li.firstChild);
      });
      body.append(hint, list);
      select(Math.max(0, Regions.findIndex((r) => r.id === here)));
    },
    onNav(dir) {
      if (dir === 'up') select(selected - 1);
      else if (dir === 'down') select(selected + 1);
    },
    onConfirm: confirm,
  });

  function confirm() {
      const region = Regions[selected];
      if (region.locked) return;
      const here = region.id === GameState.get('location').id;
      Screens.close();
      if (!here) Events.emit('location:request', { id: region.id });
  }
})();
</script>
  <script>
// NPC 대화창 (임시): 이름표 + 대사. 넘기기/닫기는 하단 컨트롤(ui/controls.js)이나 대화창 터치로 한다.
// 실제 상점/제작/의뢰 연결은 추후 'npc:interact' 를 듣는 시스템이 맡는다.
const Dialog = (() => {
  const root = document.getElementById('dialog');
  const nameEl = document.getElementById('dialog-name');
  const textEl = document.getElementById('dialog-text');
  const moreEl = document.getElementById('dialog-more');
  const listeners = [];
  let lines = [];
  let index = 0;
  let current = null;

  const isOpen = () => !root.hidden;
  const isLast = () => index >= lines.length - 1;

  function render() {
    textEl.textContent = lines[index];
    moreEl.style.visibility = isLast() ? 'hidden' : 'visible';
  }

  function notify(open) {
    listeners.forEach((fn) => fn(open));
    Events.emit('ui:changed');
  }

  function open(npc) {
    current = npc;
    const src = npc.currentLines ? npc.currentLines() : npc.lines;
    lines = src && src.length ? src : ['...'];
    index = 0;
    nameEl.textContent = npc.name;
    render();
    root.hidden = false;
    notify(true);
  }

  function close() {
    if (!isOpen()) return;
    root.hidden = true;
    const ended = { npc: current, reachedEnd: isLast() };
    notify(false);
    Events.emit('dialog:end', ended); // 대화가 끝났음을 알린다 (선물 지급 등은 이 이벤트를 듣는 시스템이 처리)
  }

  function next() {
    if (!isOpen()) return;
    if (isLast()) {
      close();
    } else {
      index++;
      render();
      Events.emit('ui:changed'); // 확인 버튼 이름(다음/닫기) 갱신
    }
  }

  // 확인 버튼에 표시할 이름
  const confirmLabel = () => (isLast() ? '닫기' : '다음');

  root.querySelector('.dialog-card').addEventListener('click', next); // 대화창을 직접 눌러도 넘어간다
  Events.on('npc:interact', ({ npc }) => open(npc));

  return { open, close, next, isOpen, confirmLabel, onChange: (fn) => listeners.push(fn) };
})();
</script>

// 알림(토스트): Events.emit('toast', { text }) 로 짧은 안내를 잠깐 보여 준다. 조작은 받지 않는다.
const Toast = (() => {
  const el = document.getElementById('toast');
  let timer = 0;

  function show(text) {
    el.textContent = text;
    el.hidden = false;
    el.style.animation = 'none';
    void el.offsetWidth;
    el.style.animation = '';
    clearTimeout(timer);
    timer = setTimeout(() => { el.hidden = true; }, 2800);
  }

  Events.on('toast', ({ text }) => show(text));
  return { show };
})();

  <script>
// 가방 화면: 보유 아이템(쌓이는 것 + 장비)과 상세. 조작은 하단 컨트롤(방향/확인/뒤로)이나 직접 터치.
//   ▲▼ 또는 직접 눌러 선택, 확인(또는 상세의 버튼): 꾸러미는 열기, 장비는 장착
(() => {
  const bagBtn = document.querySelector('.dock-btn[data-menu="bag"]');
  let root = null;
  let selected = 0;
  let result = null;   // 방금 꾸러미를 열어 얻은 목록 (보여 주는 중이면 값이 있다)
  let rows = [];
  let detail = null;
  let list = [];       // 화면에 그리는 항목: { kind: 'stack' | 'gear', def, it | inst }

  // 쌓이는 아이템과 장비를 종류 순서(꾸러미, 무기, 방어구, 물약)로 합친다
  function collect() {
    const out = [];
    for (const it of GameState.get('inventory').items) out.push({ kind: 'stack', def: ItemData[it.id], it });
    for (const inst of GameState.get('gear').list) out.push({ kind: 'gear', def: ItemData[inst.id], inst });
    return out.sort((a, b) => ItemTypes[a.def.type].order - ItemTypes[b.def.type].order);
  }

  const isEquipped = (inst) => {

    c.className = 'bag-icon';

  function showDetail() {

    const entry = list[selected];
    if (!entry) return;

      if (!equipped) {

    else if (entry.def.type === 'package') Events.emit('inventory:use', { id: entry.it.id });

    onClose() { root = null; result = null; },
    onNav(dir) {
      if (result) { result = null; showDetail(); }
      if (dir === 'up') select(selected - 1);

// 장비 화면: 장착 중인 장비와 보유 장비 목록. 장비를 교체한다.
//   ◀▶ 무기/방어구 탭, ▲▼ 선택, 확인: 장착 (직접 눌러도 됨: 한 번 누르면 선택, 선택된 장비를 다시 누르면 장착)
(() => {
  const el = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  };

  const TABS = [{ type: 'weapon', label: '무기' }, { type: 'armor', label: '방어구' }];
  let root = null;
  let tab = 0;
  let selected = 0;
  let list = [];
  let rows = [];
  let compare = null;

  const gearOf = (type) => GameState.get('gear').list.filter((g) => ItemData[g.id].type === type);
  const equippedUid = (type) => GameState.get('equipment')[type];

  const statOf = (inst) => (ItemData[inst.id].type === 'weapon' ? Stats.weaponAtk(inst) : Stats.armorDef(inst));
  const statName = (type) => (type === 'weapon' ? '공격' : '방어');

  function iconCanvas(def) {
    const c = el('canvas', 'bag-icon');
    c.width = 16;
    c.height = 16;
    c.getContext('2d').drawImage(Sprites.items[def.icon], 0, 0);
    return c;
  }

  function gradeText(inst) {
    return '★'.repeat(inst.grade) + (ItemData[inst.id].weapon ? `  숙련 Lv.${inst.level}` : '');
  }

  function showCompare() {
    compare.replaceChildren();
    const inst = list[selected];
    if (!inst) {
      compare.append(el('p', 'bag-empty', '이 종류의 장비가 없어요.'));
      return;
    }
    const type = ItemData[inst.id].type;
    const cur = GameState.get('gear').list.find((g) => g.uid === equippedUid(type));
    const now = statOf(inst);
    compare.append(el('h3', '', ItemData[inst.id].name), el('p', '', ItemData[inst.id].desc));
    const diff = cur ? now - statOf(cur) : now;
    const arrow = Math.abs(diff) < 0.05 ? '' : diff > 0 ? `  ▲ ${diff.toFixed(1)}` : `  ▼ ${Math.abs(diff).toFixed(1)}`;
    compare.append(el('p', 'bag-stat', `${statName(type)} +${now.toFixed(1)}${cur && cur.uid !== inst.uid ? arrow : ''}`));
    if (inst.uid === equippedUid(type)) compare.append(el('p', 'bag-action', '장착 중이에요.'));
    else {
      compare.append(el('p', 'bag-action', '확인 버튼이나 아래 버튼으로 장착해요.'));
      const b = el('button', 'bag-open', '장착');
      b.type = 'button';
      b.addEventListener('click', () => Events.emit('equip:request', { uid: inst.uid }));
      compare.append(b);
    }
  }

  function select(i) {
    if (!list.length) { showCompare(); return; }
    selected = (i + list.length) % list.length;
    rows.forEach((r, n) => r.classList.toggle('is-selected', n === selected));
    if (rows[selected]) rows[selected].scrollIntoView({ block: 'nearest' });
    showCompare();
  }

  function build() {
    if (!root) return;
    root.replaceChildren();
    rows = [];
    const type = TABS[tab].type;

    // 장착 중 요약
    const summary = el('div', 'eq-summary');
    for (const t of TABS) {
      const cur = GameState.get('gear').list.find((g) => g.uid === equippedUid(t.type));
      const box = el('div', 'eq-slot');
      box.append(el('span', 'eq-slot-label', t.label), el('b', '', cur ? ItemData[cur.id].name : '없음'));
      if (cur) box.append(el('span', 'eq-slot-sub', gradeText(cur)));
      summary.append(box);
    }

    // 탭
    const tabs = el('div', 'eq-tabs');
    TABS.forEach((t, i) => {
      const b = el('button', 'eq-tab' + (i === tab ? ' is-on' : ''), t.label);
      b.type = 'button';
      b.addEventListener('click', () => { tab = i; selected = 0; build(); });
      tabs.append(b);
    });

    list = gearOf(type);
    const ul = el('ul', 'bag-list');
    list.forEach((inst, idx) => {
      const def = ItemData[inst.id];
      const li = el('li', 'bag-row');
      li.addEventListener('click', () => (idx === selected ? confirm() : select(idx)));
      const text = el('div', 'bag-name', def.name);
      text.append(el('span', 'bag-type', gradeText(inst)));
      const right = el('div', 'bag-count', `+${statOf(inst).toFixed(1)}`);
      if (inst.uid === equippedUid(type)) right.append(el('span', 'bag-eq', '장착 중'));
      li.append(iconCanvas(def), text, right);
      ul.append(li);
      rows.push(li);
    });
    compare = el('div', 'bag-detail');
    root.append(summary, tabs, ul, compare);
    selected = Math.min(selected, Math.max(0, list.length - 1));
    select(selected);
  }

  function confirm() {
    const inst = list[selected];
    if (inst) Events.emit('equip:request', { uid: inst.uid });
  }

  Screens.register('equip', {
    title: '장비',
    render(body) { root = body; tab = 0; selected = 0; build(); },
    onClose() { root = null; },
    onNav(dir) {
      if (dir === 'left' || dir === 'right') { tab = (tab + (dir === 'right' ? 1 : TABS.length - 1)) % TABS.length; selected = 0; build(); }
      else if (dir === 'up') select(selected - 1);
      else if (dir === 'down') select(selected + 1);
    },
    onConfirm: confirm,
  });

  const refresh = () => { if (Screens.current === 'equip') build(); };
  Events.on('equipment:changed', refresh);
  Events.on('state:gear', refresh);
})();

(() => {

  let rows = [];
  let selected = 0;
  let hintEl = null;

    out.push({ kind: 'quit' });

  function hint(text) {
    if (hintEl) hintEl.textContent = text;
  }

  function select(i) {

    rows[selected].scrollIntoView({ block: 'nearest' });

      } else {

  <script>
// 대장간 강화 화면. 건물에 들어가면 위쪽은 강화 장면, 아래쪽은 장비 선택 / 재료 선택으로 바뀐다.
//   ◀▶ 장비/재료 열 전환, ▲▼ 선택, 확인(강화), 뒤로(나가기). 목록은 직접 눌러도 된다.
//   강화 규칙(확률, 재료 소모, 등급 상승)은 systems/crafting.js 가 처리한다 ('forge:enhance' -> 'forge:result').
const ForgeUI = (() => {
  const $ = (id) => document.getElementById(id);
  const root = $('forge');
  const dock = $('dock');
  const panel = $('forge-panel');
  const colGear = $('fp-gear');
  const colMat = $('fp-mats');
  const msg = $('fg-msg');
  const stage = root.querySelector('.fg-stage');

  const SMITH_LINES = {
    hello: '어서 와! 강화할 장비와 재료를 골라 봐.',
    noGear: '강화할 장비가 없네. 장비부터 구해 와.',
    noMat: '강화재료가 없잖아. 몬스터가 가끔 떨어뜨리니 구해 와!',
    max: '이 장비는 이미 최고 등급이야.',
    go: '좋아, 간다!',
  };

  let active = false;
  let busy = false;
  let focus = 0;         // 0: 장비 열, 1: 재료 열
  let gi = 0;            // 선택한 장비 / 재료 번호
  let mi = 0;
  let timers = [];

  const later = (fn, ms) => { const t = setTimeout(fn, ms); timers.push(t); };
  const clearTimers = () => { timers.forEach(clearTimeout); timers = []; };

  const el = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  };

  // 장비(무기 먼저, 그다음 방어구) / 강화재료 목록
  function gearList() {
    return GameState.get('gear').list.slice().sort((a, b) =>
      ItemTypes[ItemData[a.id].type].order - ItemTypes[ItemData[b.id].type].order);
  }
  const matList = () => GameState.get('inventory').items.filter((it) => ItemData[it.id].forge);

  const isEquipped = (inst) => {
    const eq = GameState.get('equipment');
    return eq.weapon === inst.uid || eq.armor === inst.uid;
  };

  function drawCanvas(canvas, img, scale) {
    canvas.width = img.width;
    canvas.height = img.height;
    canvas.getContext('2d').drawImage(img, 0, 0);
    canvas.style.width = img.width * scale + 'px';
    canvas.style.height = img.height * scale + 'px';
  }

  function setMsg(text) {
    msg.textContent = text;
  }

  // ---------- 아래: 선택 목록 ----------
  function renderPanel() {
    const gears = gearList();
    const mats = matList();
    gi = Math.min(gi, Math.max(0, gears.length - 1));
    mi = Math.min(mi, Math.max(0, mats.length - 1));

    colGear.replaceChildren(el('h4', '', '장비 선택'));
    if (!gears.length) colGear.append(el('p', 'fp-empty', '장비가 없어요'));
    gears.forEach((inst, i) => {
      const def = ItemData[inst.id];
      const row = el('button', 'fp-row' + (focus === 0 && i === gi ? ' is-focus' : '') + (i === gi ? ' is-picked' : ''));
      row.type = 'button';
      row.append(el('span', 'fp-name', def.name), el('span', 'fp-sub', '★' + inst.grade + (isEquipped(inst) ? ' · 장착' : '')));

      colGear.append(row);
    });

    colMat.replaceChildren(el('h4', '', '재료 선택'));
    if (!mats.length) colMat.append(el('p', 'fp-empty', '강화재료가 없어요'));
    mats.forEach((it, i) => {
      const def = ItemData[it.id];
      const row = el('button', 'fp-row' + (focus === 1 && i === mi ? ' is-focus' : '') + (i === mi ? ' is-picked' : ''));

      row.addEventListener('click', () => { if (busy) return; focus = 1; mi = i; render(); });
      colMat.append(row);

    const f = (focus === 0 ? colGear : colMat).querySelector('.is-focus');
    if (f) f.scrollIntoView({ block: 'nearest' });
  }

  // ---------- 위: 강화 장면 ----------
  function renderScene() {
    const inst = gearList()[gi];
    const mat = matList()[mi];
    const stars = $('fg-stars');
    const info = $('fg-info');
    stars.replaceChildren();
    info.replaceChildren();

    if (!inst) {
      drawCanvas($('fg-gear'), Sprites.items.gem, 1);
      $('fg-gear').style.visibility = 'hidden';
      info.append(el('b', '', '장비를 골라 주세요'));
      return;
    }
    const def = ItemData[inst.id];
    $('fg-gear').style.visibility = 'visible';
    drawCanvas($('fg-gear'), Sprites.items[def.icon], 5);
    for (let i = 1; i <= Forge.maxGrade; i++) {
      stars.append(el('span', 'fg-star' + (i <= inst.grade ? ' on' : i === inst.grade + 1 ? ' next' : ''), '★'));
    }
    info.append(el('b', '', def.name + (def.weapon ? `  숙련 Lv.${inst.level}` : '')));
    if (inst.grade >= Forge.maxGrade) {
      info.append(el('span', 'fg-chance', '최고 등급'));
    } else {
      const chance = Forge.chance(inst.grade, mat ? ItemData[mat.id] : null);
      info.append(
        el('span', 'fg-chance', `★${inst.grade} → ★${inst.grade + 1}   성공 확률 ${Math.round(chance * 100)}%`),
        el('span', 'fg-mat', mat ? `재료: ${ItemData[mat.id].name}` : '재료를 골라 주세요'),
      );
    }
  }

  function render() {
    renderPanel();
    renderScene();

  // ---------- 강화 ----------
  function enhance() {
    const inst = gearList()[gi];

    if (inst.grade >= Forge.maxGrade) { setMsg(SMITH_LINES.max); return; }
    if (!mat) { setMsg(SMITH_LINES.noMat); return; }

    setMsg(SMITH_LINES.go);

    void stage.offsetWidth;
    stage.classList.add('strike');                       // 망치질 연출 (3번)

      p.style.setProperty('--a', (i / 10) * 360 + 'deg');
      p.style.setProperty('--d', 50 + (i % 3) * 18 + 'px');
      box.append(p);
    }
  }

  Events.on('forge:result', (r) => {
    if (!active) return;
    fx(r.success ? 'ok' : 'fail');
    setMsg(r.success
      ? `강화 성공! ★${r.to} 등급이 되었어!`
      : '아쉽게도 실패했어... 재료만 사라졌네. 다시 해 볼래?');

    later(() => { busy = false; Events.emit('ui:changed'); }, 1500);
  });

  // ---------- 열기 / 닫기 ----------
  function open() {
    if (active) return;
    active = true;
    busy = false;
    focus = 0;
    gi = 0;
    mi = 0;
    drawCanvas($('fg-smith'), Sprites.npcs.smith.down[2], 6);
    drawCanvas($('fg-anvil'), Sprites.props.anvil, 5);
    $('fg-fx').replaceChildren();
    root.hidden = false;
    root.classList.remove('intro');
    void root.offsetWidth;
    root.classList.add('intro');
    dock.dataset.mode = 'forge';
    panel.hidden = false;
    setMsg(gearList().length ? SMITH_LINES.hello : SMITH_LINES.noGear);
    render();
    Events.emit('forge:opened');
    Events.emit('ui:changed');
  }

  function close() {
    if (!active) return;
    clearTimers();
    active = false;
    busy = false;
    root.hidden = true;

    panel.hidden = true;
    Events.emit('forge:closed');
    Events.emit('ui:changed');
  }

  // ---------- 하단 컨트롤에서 부르는 조작 ----------

    if (dir === 'left') focus = 0;

  Events.on('game:quit', close);
  Events.on('inventory:changed', () => { if (active && !busy) render(); });

  return {
    get active() { return active; },
    confirmLabel: () => (busy ? '...' : '강화'),
    canBack: () => active && !busy,
    nav,
    confirm,
    back: close,
    close,
  };
})();

  const cmdBox = $('battle-cmds');
  const textEl = $('bt-text');
  const eCanvas = $('bt-enemy');
  const hCanvas = $('bt-hero');

  const STEP_MS = 1150;
  const MAIN = [
    { id: 'skill', label: '기술' },
    { id: 'bag', label: '가방' },
    { id: 'party', label: '동료' },
    { id: 'flee', label: '도망' },
  ];

  let active = false;
  let busy = false;       // 메시지/연출 재생 중이면 명령을 받지 않는다
  let finishing = false;  // 전투가 끝나고 마무리 대기 중
  let outcome = null;
  let queue = [];
  let timer = 0;
  let view = 'main';      // 'main' | 'items' | 'skills' | 'learn'
  let learning = null;    // 새 기술을 배우는 중이면 { skill, source }
  let sel = 0;
  let enemyMax = 1;
  let heroMax = { hp: 1, mp: 1 };

  // ---------- 그리기 보조 ----------
  function drawSprite(canvas, img, scale) {
    canvas.width = img.width;
    canvas.height = img.height;
    canvas.getContext('2d').drawImage(img, 0, 0);
    canvas.style.width = img.width * scale + 'px';
    canvas.style.height = img.height * scale + 'px';
  }

  function setBar(el, value, max) {
    const pct = Math.max(0, Math.min(1, value / max));
    el.firstElementChild.style.width = pct * 100 + '%';
    el.classList.toggle('low', pct <= 0.5 && pct > 0.2);
    el.classList.toggle('crit', pct <= 0.2);
  }

  function setHero(hp, mp, maxHp, maxMp) {
    if (maxHp) heroMax = { hp: maxHp, mp: maxMp };   // 레벨업으로 최대치가 늘어난 경우
    setBar($('bt-h-bar'), hp, heroMax.hp);
    setBar($('bt-h-mpbar'), mp, heroMax.mp);
    $('bt-h-num').textContent = `HP ${hp}/${heroMax.hp}  MP ${mp}/${heroMax.mp}`;
  }

  function playAnim(canvas, name) {
    const cls = 'a-' + name;
    canvas.classList.remove(cls);
    void canvas.offsetWidth;
    canvas.classList.add(cls);
    if (!/faint|flee/.test(name)) setTimeout(() => canvas.classList.remove(cls), 1000);
  }

  const ANIM_TARGET = {
    'hero-attack': [hCanvas, 'hero-attack'], 'enemy-attack': [eCanvas, 'enemy-attack'],
    'enemy-hit': [eCanvas, 'hit'], 'hero-hit': [hCanvas, 'hit'],
    'enemy-faint': [eCanvas, 'faint'], 'hero-faint': [hCanvas, 'faint'],
    heal: [hCanvas, 'heal'], flee: [hCanvas, 'flee'],
  };

  // ---------- 메시지 재생 ----------
  function play(steps) {
    queue = steps.slice();
    busy = true;
    renderCmds();
    Events.emit('ui:changed');
    next();
  }

  function next() {
    clearTimeout(timer);
    if (!queue.length) return done();
    const s = queue.shift();
    if (s.type === 'learn') return startLearn(s);   // 새 기술: 잊을 기술을 고르게 한다
    textEl.textContent = s.text;
    if (s.hp) {
      if (s.hp.enemy) setBar($('bt-e-bar'), s.hp.enemy.hp, enemyMax);
      if (s.hp.hero) setHero(s.hp.hero.hp, s.hp.hero.mp, s.hp.hero.maxHp, s.hp.hero.maxMp);
    }
    if (s.anim && ANIM_TARGET[s.anim]) playAnim(...ANIM_TARGET[s.anim]);
    timer = setTimeout(next, STEP_MS);
  }

  function done() {
    if (outcome) {
      finishing = true;
      timer = setTimeout(finish, 900);
      return;
    }
    busy = false;
    view = 'main';
    sel = 0;
    textEl.textContent = '어떻게 할까?';
    renderCmds();
    Events.emit('ui:changed');
  }

  function finish() {
    clearTimeout(timer);
    if (!active) return;
    active = false;
    busy = false;
    finishing = false;
    root.hidden = true;
    dock.dataset.mode = '';
    cmdBox.hidden = true;
    Events.emit('ui:changed');
    Events.emit('battle:finish');
  }

  // ---------- 하단 명령 ----------
  function potions() {
    return GameState.get('inventory').items.filter((it) => ItemData[it.id] && ItemData[it.id].use);
  }

  // 배운 기술 목록 (없으면 맨손치기)
  function knownSkills() {
    const known = GameState.get('skills').known;
    return (known.length ? known : ['punch']).map((id) => SkillData[id]);
  }

  function startLearn(step) {
    learning = { skill: step.skill, source: step.source };
    busy = false;
    view = 'learn';
    sel = 0;
    renderCmds();
    Events.emit('ui:changed');
  }

  // 새 기술을 배울지 정한다 (forget: 잊을 기술 id, 없으면 배우지 않음)
  function decideLearn(forget) {
    const { skill, source } = learning;
    learning = null;
    Events.emit('skill:decide', { skill, source, forget });
    const name = SkillData[skill].name;
    queue.unshift({
      text: forget
        ? `${Util.josa(SkillData[forget].name, '을/를')} 잊고 ${Util.q(name, '을/를')} 배웠다!`
        : `${Util.q(name, '을/를')} 배우지 않았다.`,
      anim: forget ? 'heal' : undefined,
    });
    view = 'main';
    busy = true;
    renderCmds();
    Events.emit('ui:changed');
    next();
  }

  function entries() {
    if (view === 'skills') {
      const mp = GameState.get('player').mp;
      const list = knownSkills().map((s) => ({
        id: s.id, label: s.mp ? `${s.name}  MP ${s.mp}` : s.name, desc: s.desc, disabled: mp < s.mp,
      }));
      list.push({ id: 'cancel', label: '취소', wide: true });
      return list;
    }
    if (view === 'learn') {
      const list = GameState.get('skills').known.map((id) => ({ id: 'forget', forget: id, label: `${SkillData[id].name} 잊기`, desc: SkillData[id].desc }));
      list.push({ id: 'decline', label: '배우지 않는다', wide: true });
      return list;
    }
    if (view === 'items') {
      const list = potions().map((it) => ({ id: it.id, label: `${ItemData[it.id].name} ×${it.count}` }));
      if (!list.length) list.push({ id: 'none', label: '쓸 수 있는 물약이 없어요', disabled: true });
      list.push({ id: 'cancel', label: '취소', wide: true });
      return list;
    }
    return MAIN;
  }

  function renderCmds() {
    const list = entries();
    sel = Math.min(sel, list.length - 1);
    cmdBox.replaceChildren();
    cmdBox.classList.toggle('is-busy', busy);
    cmdBox.classList.toggle('is-items', view !== 'main');
    if (!busy && view === 'learn') {
      const sk = SkillData[learning.skill];
      textEl.textContent = `새 기술 ${Util.q(sk.name, '을/를')} 배울 수 있다! 기술이 가득 찼으니, 잊을 기술을 고르자.`;
    } else if (!busy && (view === 'skills') && list[sel] && list[sel].desc) {
      textEl.textContent = list[sel].desc;
    }
    list.forEach((e, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'bt-cmd' + (i === sel && !busy ? ' is-selected' : '') + (e.wide ? ' is-wide' : '');
      b.textContent = e.label;
      b.disabled = !!e.disabled;
      b.addEventListener('click', () => { if (busy) { skip(); return; } sel = i; run(e); });
      cmdBox.appendChild(b);
    });
  }

  function run(e) {
    if (busy || e.disabled) return;
    if (view === 'learn') { decideLearn(e.forget || null); return; }
    if (view === 'skills') {
      if (e.id === 'cancel') { view = 'main'; sel = 0; renderCmds(); Events.emit('ui:changed'); return; }
      view = 'main';
      Events.emit('battle:command', { type: 'skill', id: e.id });
      return;
    }
    if (view === 'items') {
      if (e.id === 'cancel') { view = 'main'; sel = 0; renderCmds(); Events.emit('ui:changed'); return; }
      view = 'main';
      Events.emit('battle:command', { type: 'item', id: e.id });
      return;
    }
    if (e.id === 'skill') { view = 'skills'; sel = 0; renderCmds(); Events.emit('ui:changed'); }
    else if (e.id === 'flee') Events.emit('battle:command', { type: 'flee' });
    else if (e.id === 'bag') { view = 'items'; sel = 0; renderCmds(); Events.emit('ui:changed'); }
    else if (e.id === 'party') Events.emit('toast', { text: '동료는 아직 없어요. (준비 중)' });
  }

  function skip() {
    if (finishing) finish();
    else if (busy) next();
  }

  // ---------- 하단 컨트롤에서 부르는 조작 ----------
  function nav(dir) {
    if (busy) return;
    const n = entries().length;
    if (view === 'main') {
      const row = sel >> 1, col = sel & 1;
      if (dir === 'left') sel = row * 2;
      else if (dir === 'right') sel = row * 2 + 1;
      else if (dir === 'up') sel = col;
      else if (dir === 'down') sel = 2 + col;
    } else {                       // 2열 격자 (마지막 '취소'는 한 줄 전체)
      if (dir === 'left') sel = Math.max(0, sel - 1);
      else if (dir === 'right') sel = Math.min(n - 1, sel + 1);
      else if (dir === 'up') sel = sel - 2 >= 0 ? sel - 2 : sel;
      else sel = sel + 2 < n ? sel + 2 : n - 1;
    }
    renderCmds();
  }

  function confirm() {
    if (busy) { skip(); return; }
    run(entries()[sel]);
  }

  function back() {
    if (busy) { skip(); return; }
    if (view === 'learn') { decideLearn(null); return; }   // 뒤로 = 배우지 않는다
    if (view === 'items' || view === 'skills') { view = 'main'; sel = 0; renderCmds(); Events.emit('ui:changed'); }
  }

  // ---------- 이벤트 ----------
  Events.on('battle:start', (d) => {
    active = true;
    busy = true;
    finishing = false;
    outcome = null;
    learning = null;
    view = 'main';
    sel = 0;
    enemyMax = d.enemy.maxHp;
    heroMax = { hp: d.player.maxHp, mp: d.player.maxMp };

    $('bt-e-name').textContent = (d.enemy.boss ? '◆ ' : '') + d.enemy.name;
    $('bt-e-lv').textContent = 'Lv.' + d.enemy.level;
    setBar($('bt-e-bar'), d.enemy.hp, enemyMax);
    $('bt-h-name').textContent = d.player.name;
    $('bt-h-lv').textContent = 'Lv.' + d.player.level;
    setHero(d.player.hp, d.player.mp);

    const eImg = Sprites.monsters[d.enemy.sprite].left[0];
    const fw = $('field').clientWidth, fh = $('field').clientHeight;
    const eScale = Math.max(4, Math.min(12, Math.floor(Math.min(fw * 0.4, fh * 0.24) / Math.max(eImg.width, eImg.height * 1.1))) + (d.enemy.boss ? 1 : 0));
    drawSprite(eCanvas, eImg, eScale);
    drawSprite(hCanvas, Sprites.player.up[2], Math.max(4, Math.min(8, Math.floor(fh * 0.22 / 18))));
    [eCanvas, hCanvas].forEach((c) => { c.className = 'bt-sprite'; });
    playAnimEnter();

    root.hidden = false;
    root.classList.remove('intro');
    void root.offsetWidth;
    root.classList.add('intro');
    dock.dataset.mode = 'battle';
    cmdBox.hidden = false;
    renderCmds();
    Events.emit('ui:changed');
    play(d.intro);
  });

  function playAnimEnter() {
    eCanvas.classList.add('a-enter-e');
    hCanvas.classList.add('a-enter-h');
    setTimeout(() => { eCanvas.classList.remove('a-enter-e'); hCanvas.classList.remove('a-enter-h'); }, 800);
  }

  Events.on('battle:steps', (d) => {
    outcome = d.outcome;
    play(d.steps);
  });

  $('bt-msg').addEventListener('click', skip); // 메시지 상자를 눌러 빨리 넘긴다

  return {
    get active() { return active; },
    confirmLabel: () => (busy ? '다음' : '확인'),
    canBack: () => active && !busy && view !== 'main',
    nav,
    confirm,
    back,
  };
})();

  <script>
// 하단 컨트롤: 거의 모든 터치가 이 영역에서 일어나도록 모드에 따라 바뀐다.
//   field  : 왼쪽 조이스틱 + (대상 옆에서만) 오른쪽 대화 버튼
//   screen : 왼쪽 방향 버튼 + 오른쪽 확인/뒤로 (메뉴 화면, 목록 선택 등)
//   dialog : 오른쪽 다음(닫기)/뒤로 (NPC 대화)
//   forge  : 대장간. 왼쪽 방향 버튼 + 오른쪽 강화/나가기
//   battle : 왼쪽 방향 버튼 + 오른쪽 확인(다음)/뒤로 (전투 명령 선택)
// 위쪽 화면도 직접 터치할 수 있지만, 모든 조작은 이 하단 컨트롤만으로도 가능하다.
// 확인 버튼은 항상 같은 자리(오른쪽 아래)에 있어 엄지가 움직이지 않는다.
const Controls = (() => {
  const pad = document.getElementById('pad');
  const act = document.getElementById('act-btn');
  const actLabel = act.querySelector('.act-label');
  const back = document.getElementById('back-btn');
  const iconTalk = act.querySelector('.act-icon');
  let target = null;   // 대화할 수 있는 NPC (main.js 가 'interact:target' 으로 알려 준다)

  function mode() {
    if (BattleUI.active) return 'battle';
    if (ForgeUI.active) return 'forge';
    if (Dialog.isOpen()) return 'dialog';
    if (Screens.current) return 'screen';
    return 'field';
  }

  // 현재 상태에 맞게 버튼 구성을 바꾼다
  function refresh() {
    const m = mode();
    pad.dataset.mode = m;
    back.hidden = m === 'field' || (m === 'battle' && !BattleUI.canBack()) || (m === 'forge' && !ForgeUI.canBack());
    back.textContent = m === 'dialog' ? '닫기' : m === 'forge' ? '나가기' : '뒤로';

    let label = null;
    if (m === 'battle') label = BattleUI.confirmLabel();
    else if (m === 'forge') label = ForgeUI.confirmLabel();
    else if (m === 'dialog') label = Dialog.confirmLabel();
    else if (m === 'screen') label = '확인';
    else if (target) label = target.kind === 'building' ? '입장' : '대화';

    const wasHidden = act.hidden;
    act.hidden = !label;
    iconTalk.style.display = label === '대화' ? '' : 'none';   // 말풍선 아이콘은 대화일 때만
    if (label) actLabel.textContent = label;
    if (label && wasHidden) {
      act.classList.remove('pop');
      void act.offsetWidth; // 애니메이션 재시작
      act.classList.add('pop');
    }
  }

  function pressConfirm() {
    if (BattleUI.active) BattleUI.confirm();
    else if (ForgeUI.active) ForgeUI.confirm();
    else if (Dialog.isOpen()) Dialog.next();
    else if (Screens.current) Screens.confirm();
    else if (target && target.kind === 'building') Events.emit('building:enter', { id: target.id });
    else if (target) Events.emit('npc:interact', { npc: target.npc });
  }

  function pressBack() {
    if (BattleUI.active) BattleUI.back();
    else if (ForgeUI.active) ForgeUI.back();
    else if (Dialog.isOpen()) Dialog.close();
    else if (Screens.current) Screens.back();
  }

  act.addEventListener('click', pressConfirm);
  back.addEventListener('click', pressBack);
  pad.querySelectorAll('[data-nav]').forEach((b) =>
    b.addEventListener('click', () => {
      if (BattleUI.active) BattleUI.nav(b.dataset.nav);
      else if (ForgeUI.active) ForgeUI.nav(b.dataset.nav);
      else if (Screens.current && !Dialog.isOpen()) Screens.nav(b.dataset.nav);
    }));

  Events.on('interact:target', (t) => { target = t; refresh(); });
  Events.on('ui:changed', refresh);
  Events.on('forge:opened', refresh);
  refresh();

  return { refresh };
})();

// 게임 메인(타이틀) 화면: 세이브 파일 3개 중에서 고른다. 빈 파일은 새 게임, 저장된 파일은 이어하기.
const TitleUI = (() => {
  const root = document.getElementById('title');
  const list = document.getElementById('title-slots');
  let armedDelete = 0;   // 삭제 확인 중인 슬롯 (한 번 더 누르면 삭제)
  let armTimer = 0;

  const el = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  };

  function drawArt() {
    const c = document.getElementById('title-art');
    const g = c.getContext('2d');
    g.drawImage(Sprites.makeGrassPattern(112, 44), 0, 0);
    g.drawImage(Sprites.trees[0], 4, 8);
    g.drawImage(Sprites.trees[1], 88, 10);
    g.drawImage(Sprites.monsters.slime.right[0], 40, 28);
    g.drawImage(Sprites.monsters.mushroom.right[0], 68, 22);
    g.drawImage(Sprites.player.down[2], 24, 22);
  }

  function render() {
    list.replaceChildren();
    for (let n = 1; n <= SaveStore.SLOTS; n++) {
      const s = SaveStore.summary(n);
      const li = el('li');
      const card = el('button', 'slot' + (s ? '' : ' is-empty'));
      card.type = 'button';
      card.append(el('span', 'slot-no', '파일 ' + n));
      if (s) {
        card.append(
          el('span', 'slot-main', `Lv.${s.level} · ${s.place || '모험 중'}`),
          el('span', 'slot-sub', `${s.gold.toLocaleString('ko-KR')} 골드 · 플레이 ${s.play} · ${s.savedAt} 저장`),
        );
      } else {
        card.append(el('span', 'slot-main', '새 게임 시작'), el('span', 'slot-sub', '비어 있는 파일'));
      }
      card.addEventListener('click', () => {
        hide();
        Events.emit(s ? 'save:load' : 'save:new', { slot: n });
      });
      li.appendChild(card);
      if (s) {
        const del = el('button', 'slot-del', armedDelete === n ? '한 번 더 누르면 삭제' : '삭제');
        del.type = 'button';
        del.addEventListener('click', () => {
          if (armedDelete === n) {
            SaveStore.remove(n);
            armedDelete = 0;
          } else {
            armedDelete = n;
            clearTimeout(armTimer);
            armTimer = setTimeout(() => { armedDelete = 0; render(); }, 3000);
          }
          render();
        });
        li.appendChild(del);
      }
      list.appendChild(li);
    }
  }

  function show() {
    armedDelete = 0;
    render();
    root.hidden = false;
  }

  function hide() {
    root.hidden = true;
  }

  drawArt();

  return { show, hide };
})();

(() => {

  let rafId = 0;

  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const mapW = () => World.COLS * World.TILE;
  const mapH = () => World.ROWS * World.TILE;

  // ---------- 화면 크기 ----------
  // 논리 해상도는 정수 배율로 맞추고, 캔버스 백버퍼는 기기 픽셀 단위로 만든다.
  // 이렇게 하면 이동을 기기 픽셀 단위로 표현할 수 있어 대각선에서도 끊김이 줄어든다.

    view.w = Math.floor(cw / view.zoom);
    view.h = Math.floor(ch / view.zoom);
    const cssW = view.w * view.zoom, cssH = view.h * view.zoom;
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    view.sx = canvas.width / view.w;
    view.sy = canvas.height / view.h;
    if (running) updateCamera();
  }

  // ---------- 카메라 ----------
  // 보간 없이 플레이어를 그대로 따라가므로 플레이어의 화면 위치가 항상 일정하다.
  // 맵 경계에서만 카메라가 멈추고 그때는 플레이어가 움직인다.
  function updateCamera() {
    const tx = player.x - view.w / 2;
    const ty = player.y - 8 - view.h / 2;
    cam.x = mapW() <= view.w ? (mapW() - view.w) / 2 : clamp(tx, 0, mapW() - view.w);
    cam.y = mapH() <= view.h ? (mapH() - view.h) / 2 : clamp(ty, 0, mapH() - view.h);
  }

  // ---------- 이동 / 충돌 ----------
  // 한 축으로 이동. 0.5px 이하 단위로 나눠 전진하며, 막히면 그 축 속도만 0으로 만든다
  function moveAxis(axis, delta) {
    if (delta === 0) return;
    const steps = Math.ceil(Math.abs(delta) / 0.5);
    const s = delta / steps;
    for (let i = 0; i < steps; i++) {
      const nx = axis === 'x' ? player.x + s : player.x;
      const ny = axis === 'y' ? player.y + s : player.y;
      if (World.blocked(nx - HALF_W, ny - HEIGHT_FEET, nx + HALF_W, ny + 1) ||
          Monsters.blocksPlayer(nx, ny, player.x, player.y)) {
        if (axis === 'x') player.vx = 0; else player.vy = 0;
        return;
      }
      player.x = nx;
      player.y = ny;
    }
  }

  function update(dt) {
    const inp = Input.get();
    const tvx = inp.active ? inp.x * SPEED : 0;
    const tvy = inp.active ? inp.y * SPEED : 0;

    // 가속/감속을 나눠 부드럽게 움직이고 멈춘다
    const k = 1 - Math.exp(-dt * (inp.active ? 16 : 24));
    player.vx += (tvx - player.vx) * k;
    player.vy += (tvy - player.vy) * k;
    if (Math.abs(player.vx) < 0.01) player.vx = 0;
    if (Math.abs(player.vy) < 0.01) player.vy = 0;

    moveAxis('x', player.vx * dt);
    moveAxis('y', player.vy * dt);

    const speed = Math.hypot(player.vx, player.vy);
    if (speed > 4) {
      if (Math.abs(player.vx) > Math.abs(player.vy)) player.dir = player.vx > 0 ? 'right' : 'left';
      else player.dir = player.vy > 0 ? 'down' : 'up';
      player.walkT += dt * speed * 0.1;
      player.frame = Math.floor(player.walkT) % 2;
    } else {
      player.walkT = 0;
      player.frame = 2;
    }
  }

  // ---------- 렌더링 ----------
  const snapX = (v) => Math.round(v * view.sx) / view.sx;
  const snapY = (v) => Math.round(v * view.sy) / view.sy;

  function render() {
    ctx.setTransform(view.sx, 0, 0, view.sy, 0, 0);
    ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, view.w, view.h);

    // 월드는 기기 픽셀 단위로 맞춘 카메라 값 하나로 모두 그린다
    const ox = snapX(cam.x), oy = snapY(cam.y);
    if (World.ground) ctx.drawImage(World.ground, -ox, -oy);

    // 플레이어/몬스터는 카메라와 같은 원본 좌표 차이로 그려 화면 위치가 흔들리지 않는다
    const dyn = [{ y: player.y, draw: drawPlayer }];
    for (const m of Monsters.entities) dyn.push({ y: m.y, draw: () => drawMonster(m) });
    for (const n of Npcs.entities) dyn.push({ y: n.y, draw: () => drawNpc(n) });
    dyn.sort((a, b) => a.y - b.y);

    // 오브젝트(baseY)와 움직이는 개체(발 위치 y)를 깊이 순서대로 섞어 그린다
    let di = 0;
    for (const o of World.objects) {
      while (di < dyn.length && dyn[di].y < o.baseY) dyn[di++].draw();
      const sx = o.x - ox, sy = o.y - oy;
      if (sx > view.w || sy > view.h || sx + o.w < 0 || sy + o.h < 0) continue;
      ctx.drawImage(o.img, sx, sy);
    }
    while (di < dyn.length) dyn[di++].draw();

    drawLabels();
  }

  function drawPlayer() {
    const img = Sprites.player[player.dir][player.frame];
    ctx.drawImage(img, snapX(player.x - 7 - cam.x), snapY(player.y - 17 - cam.y));
  }

  // NPC: 가만히 서서 1px 씩 숨 쉬듯 위아래로 움직인다
  function drawNpc(n) {
    const img = n.set[n.dir][2];
    const bob = Math.floor(n.phase * 1.6) % 2;
    ctx.drawImage(img, snapX(n.x - 7 - cam.x), snapY(n.y - 17 - bob - cam.y));
  }

  function drawMonster(m) {
    const set = Sprites.monsters[m.def.sprite];
    const img = (m.dir < 0 ? set.left : set.right)[m.frame];
    const sc = m.def.scale || 1;
    const w = img.width * sc, h = img.height * sc;
    const x = snapX(m.x - w / 2 - cam.x);
    const y = snapY(m.y - (h - sc) - cam.y);
    const rarity = MonsterRarities[m.def.rarity];

    ctx.globalAlpha = Math.max(0, m.fade);
    ctx.drawImage(img, x, y, w, h);
    ctx.globalAlpha = 1;

    if (rarity.sparkle && !m.fading) {
      // 희귀 몬스터 주변에서 반짝이는 빛
      const t = performance.now() / 1000;
      for (let i = 0; i < 3; i++) {
        const a = t * 2 + i * 2.1;
        const px = x + w / 2 + Math.cos(a) * (w * 0.65);
        const py = y + h / 2 + Math.sin(a * 1.3) * (h * 0.55);
        ctx.globalAlpha = 0.5 + 0.5 * Math.sin(t * 6 + i * 2);
        ctx.fillStyle = i === 1 ? '#ffffff' : '#ffd84a';
        ctx.fillRect(snapX(px), snapY(py), 1, 1);
      }
      ctx.globalAlpha = 1;
    }

    if (m.alert > 0) {
      ctx.drawImage(Sprites.alert, snapX(x + w - 2), snapY(y - 8));
    }
  }

  // 이름표: 기기 해상도로 그린 깔끔한 알약 모양. 멀어지면 서서히 사라진다
  const LABEL_FULL = 80, LABEL_HIDE = 115;
  const FONT = '"Paperlogy", "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif';
  function pill(x, y, w, h) {
    const r = Math.min(h / 2, 5 * view.dpr); // 알약보다 각진 작은 라벨
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  // 이름표 목록(몬스터/NPC/건물)을 모아 한 번에 그린다. 멀어지면 서서히 사라진다
  function collectLabels() {
    const out = [];
    const px = player.x, py = player.y;
    for (const m of Monsters.entities) {
      const d = Math.hypot(m.x - px, m.y - py);
      if (d >= LABEL_HIDE) continue;
      const rarity = MonsterRarities[m.def.rarity];
      const img = Sprites.monsters[m.def.sprite].right[0];
      const sc = m.def.scale || 1;
      out.push({
        text: (rarity.mark ? rarity.mark + ' ' : '') + `Lv.${m.level} ${m.def.name}`, color: rarity.pillColor,
        x: m.x, y: m.y - (img.height - 1) * sc, alpha: fade(d, LABEL_FULL, LABEL_HIDE) * Math.max(0, m.fade),
      });
    }
    for (const n of Npcs.entities) {
      const d = Math.hypot(n.x - px, n.y - py);
      if (d >= LABEL_HIDE + 20) continue;
      out.push({ text: n.name, color: 'rgba(36, 92, 76, 0.92)', x: n.x, y: n.y - 17, alpha: fade(d, LABEL_FULL + 20, LABEL_HIDE + 20), talk: !!target && target.kind === 'npc' && target.npc === n });
    }
    for (const o of World.objects) {
      if (!o.label) continue;
      const d = Math.hypot(o.label.cx - px, o.baseY - py);
      if (d >= 190) continue;
      out.push({ text: o.label.text, color: 'rgba(54, 48, 40, 0.88)', x: o.label.cx, y: o.label.y, alpha: fade(d, 120, 190) });
    }
    return out;
  }

  const fade = (d, full, hide) => Math.max(0, Math.min(1, (hide - d) / (hide - full)));

  // 대화 가능한 NPC 머리 위의 말풍선 표시 (위아래로 살짝 떠다닌다)
  function drawTalkMark(cx, bottom, d0) {
    const bob = Math.sin(performance.now() / 220) * 2 * d0;
    const w = 24 * d0, h = 16 * d0, x = cx - w / 2, y = bottom - h - bob;
    ctx.fillStyle = '#ffffff';
    pill(x, y, w, h);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx - 3 * d0, y + h - 1);
    ctx.lineTo(cx, y + h + 4 * d0);
    ctx.lineTo(cx + 3 * d0, y + h - 1);
    ctx.fill();
    ctx.fillStyle = '#2f6f5a';
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath();
      ctx.arc(cx + i * 6 * d0, y + h / 2, 1.8 * d0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawLabels() {
    const d0 = view.dpr;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.font = `700 ${Math.round(10.5 * d0)}px ${FONT}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (const l of collectLabels()) {
      if (l.alpha <= 0) continue;
      const cx = snapX(l.x - cam.x) * view.sx;
      const bottom = snapY(l.y - cam.y) * view.sy - 3 * d0;
      const h = 16 * d0, w = ctx.measureText(l.text).width + 12 * d0;
      ctx.globalAlpha = l.alpha;
      ctx.fillStyle = l.color;
      pill(cx - w / 2, bottom - h, w, h);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.fillText(l.text, cx, bottom - h / 2 + 0.5 * d0);
      if (l.talk) drawTalkMark(cx, bottom - h - 3 * d0, d0);
    }
    ctx.globalAlpha = 1;
  }

  function frame(now) {
    if (!running || paused) return;
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    playSeconds += dt;
    update(dt);
    updateCamera();
    Monsters.update(dt, player, { x: cam.x, y: cam.y, w: view.w, h: view.h });
    Npcs.update(dt, player);
    checkTrigger();
    const touched = Monsters.contact(player);   // 몬스터에게 닿으면 전투 시작
    if (touched) Events.emit('battle:request', { monster: touched });
    updateTarget();
    render();
    rafId = requestAnimationFrame(frame);
  }

  // 가장 가까운 NPC 가 상호작용 범위 안이면 대상으로 삼고, 바뀔 때만 이벤트를 보낸다
  function setTarget(t) {
    if ((target && target.key) === (t && t.key)) return;
    target = t;
    Events.emit('interact:target', t);
  }

  function updateTarget() {
    let best = null, bestD = INTERACT_RANGE;
    for (const n of Npcs.entities) {
      const d = Math.hypot(n.x - player.x, n.y - player.y);
      if (d < bestD) { best = { kind: 'npc', npc: n, key: 'n:' + n.id }; bestD = d; }
    }
    for (const door of World.doors) {          // 들어갈 수 있는 건물의 문 앞
      const d = Math.hypot(door.x - player.x, door.y - player.y);
      if (d < Math.min(bestD, 22)) { best = { kind: 'building', id: door.id, name: door.name, key: 'b:' + door.id }; bestD = d; }
    }
    setTarget(best);
  }

  // 트리거 영역(마을 게이트 등)에 새로 들어서면 이벤트를 보낸다
  function checkTrigger() {
    const t = World.triggerAt(player.x, player.y);
    const id = t ? t.id : null;
    if (id !== lastTrigger) {
      lastTrigger = id;
      if (t) Events.emit('trigger', t);
    }
  }

  // ---------- 장소 이동 (마을 <-> 탐험 필드) ----------
  // opts.at: 이 위치에서 시작(불러오기), opts.keep: 마을 회복을 하지 않음(불러오기)
  function enterRegion(r, opts) {
    const o = opts || {};
    region = r;
    World.load(r);
    player.x = r.spawn.tx * World.TILE + World.TILE / 2;
    player.y = r.spawn.ty * World.TILE + 12;
    if (o.at) { player.x = o.at.x; player.y = o.at.y; }
    player.vx = 0;
    player.vy = 0;
    player.dir = 'down';
    player.walkT = 0;
    player.frame = 2;
    lastTrigger = null;
    setTarget(null);
    Input.reset();
    Screens.close();
    Dialog.close();
    pauseLocks.clear();
    paused = false;

    GameState.patch('location', { id: r.id, name: r.name, type: r.type || 'field' });
    if (r.type === 'village' && !o.keep) {   // 마을에서는 HP/MP 가 모두 회복된다
      const p = GameState.get('player');
      GameState.patch('player', { hp: p.maxHp, mp: p.maxMp });
    }
    running = true;
    fit();
    updateCamera();
    const rect = { x: cam.x, y: cam.y, w: view.w, h: view.h };
    Npcs.init(r);
    if (r.monsters) Monsters.init(r, player, rect); else Monsters.clear();
    last = performance.now();
    cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(frame);
  }

  // 메뉴 화면이나 대화가 열리면 월드(플레이어/몬스터/NPC/카메라)를 그대로 멈추고, 모두 닫히면 이어서 진행한다
  function setPauseLock(name, on) {
    if (on) pauseLocks.add(name); else pauseLocks.delete(name);
    const p = pauseLocks.size > 0;
    if (paused === p) return;
    paused = p;
    cancelAnimationFrame(rafId);
    Input.setEnabled(!p);
    if (p) {
      setTarget(null);
      if (running) render(); // 대화 표시(말풍선)를 지운 모습으로 한 번 다시 그린다
    } else if (running) {
      last = performance.now();
      rafId = requestAnimationFrame(frame);
    }
  }
  Screens.onChange((id) => {
    if (id && Dialog.isOpen()) Dialog.close();
    setPauseLock('screen', !!id);
  });
  Dialog.onChange((open) => setPauseLock('dialog', open));

  if (document.fonts) document.fonts.load('700 11px Paperlogy'); // 이름표용 폰트 미리 불러오기

  // 다른 화면은 이벤트로만 장소 이동/게이트 진입을 알려 온다
  Events.on('location:request', ({ id }) => {
    const r = Regions.find((x) => x.id === id);
    if (r && !r.locked) enterRegion(r);
  });
  // 전투: 시작하면 월드를 멈추고, 끝나면 결과를 월드에 반영한다
  Events.on('battle:start', () => {
    Screens.close();
    Dialog.close();
    setPauseLock('battle', true);
  });
  Events.on('battle:end', ({ outcome, monster }) => {
    if (outcome === 'win') {
      Monsters.defeat(monster);
    } else if (outcome === 'flee') {
      Monsters.flee(monster);
    } else if (outcome === 'lose') {
      enterRegion(Regions[0]);          // 쓰러지면 마을로 돌아가 회복한다
      Events.emit('toast', { text: '쓰러져서 마을로 돌아왔어요.' });
    }
    setPauseLock('battle', false);
  });
  Events.on('trigger', (t) => {
    if (t.action === 'explore') Screens.open('explore');
  });

  window.addEventListener('resize', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(field);

  // 시작: 마을에서 출발
  // ---------- 시작 / 저장 / 불러오기 ----------
  Events.on('game:new', () => {
    playSeconds = 0;
    enterRegion(Regions[0]);
    Events.emit('save:request', {});          // 새 게임도 바로 파일에 기록해 둔다
  });
  Events.on('game:loaded', ({ data }) => {
    playSeconds = data.playSeconds || 0;
    const r = Regions.find((x) => x.id === (data.world && data.world.region)) || Regions[0];
    enterRegion(r, { at: data.world && { x: data.world.x, y: data.world.y }, keep: true });
    Events.emit('toast', { text: '불러왔어요.' });
  });
  Events.on('game:quit', () => {
    running = false;
    cancelAnimationFrame(rafId);
    pauseLocks.clear();
    paused = false;
    Input.reset();
    Screens.close();
    Dialog.close();
    TitleUI.show();
  });
  // 저장할 때 월드 정보(위치, 플레이 시간)를 채워 준다. 전투 중에는 저장하지 않는다
  Events.on('save:collect', (c) => {
    if (!running) { c.blocked = true; return; }
    c.blocked = pauseLocks.has('battle');
    c.world = { region: region.id, x: player.x, y: player.y };
    c.playSeconds = Math.floor(playSeconds);
  });
  Events.on('forge:opened', () => setPauseLock('forge', true));
  Events.on('forge:closed', () => setPauseLock('forge', false));

  Game.init();
  TitleUI.show();

  // 테스트용 참조
  window.__game = { player, cam, view, World, Monsters, Npcs, GameState, enterRegion };
})();
</script>
</body>
</html>
