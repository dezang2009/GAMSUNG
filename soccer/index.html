<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>축구선수 키우기</title>
<style>
body{font:16px system-ui,sans-serif;max-width:420px;margin:0 auto;padding:16px;background:#14301c;color:#eee}
h1{font-size:20px;margin:0 0 8px}
.bar{background:#0006;border-radius:6px;height:14px;overflow:hidden;margin:2px 0 8px}
.bar i{display:block;height:100%;background:#4ade80}
button{font:inherit;padding:12px;margin:4px 0;width:100%;border:0;border-radius:8px;background:#22c55e;color:#04210e;font-weight:600}
button:disabled{opacity:.4}
.row{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#log{background:#0006;border-radius:8px;padding:8px;min-height:90px;font-size:14px;white-space:pre-line}
</style></head><body>
<h1>⚽ 축구선수 키우기</h1>
<div id="info"></div><div id="stats"></div>
<div class="row" id="acts"></div>
<button id="rest">😴 휴식 (체력 +40)</button>
<div id="log"></div>
<button id="reset" style="background:#555;color:#fff">처음부터</button>
<script>
const KEY='soccer1', MAX_WEEK=100;
const SK={shoot:'슛',pass:'패스',dribble:'드리블',stamina:'체력'};
const TIERS=[[0,'유소년'],[30,'2군'],[50,'프로'],[70,'국가대표'],[85,'월드클래스']];
const fresh=()=>({week:1,energy:100,money:0,wins:0,shoot:10,pass:10,dribble:10,stamina:10,log:'어서 와, 신인!'});
let s; try{s=JSON.parse(localStorage.getItem(KEY))}catch{} s=s||fresh();
const $=id=>document.getElementById(id);
const rnd=n=>Math.floor(Math.random()*n);
const ovr=()=>Math.round((s.shoot+s.pass+s.dribble+s.stamina)/4);
const tier=()=>TIERS.filter(t=>ovr()>=t[0]).pop()[1];

function match(){
  const opp=15+Math.floor(s.week/100*80)+rnd(15);        // 후반일수록 강한 상대
  const me=ovr()*(0.6+s.energy/250)+rnd(15);              // 지친 선수는 약함
  let g=0,c=0; for(let i=0;i<6;i++){ if(rnd(100)<me*0.6)g++; if(rnd(100)<opp*0.6)c++; }
  const r=g>c?'승리':g<c?'패배':'무승부';
  if(g>c){s.wins++;s.money+=100+opp*2} else if(g==c)s.money+=30;
  s.energy=Math.max(0,s.energy-25);
  return `🏟 경기 ${g}:${c} ${r}`;
}
function act(k){
  if(s.energy<20)return;
  const gain=1+rnd(3)+(s.energy>70?1:0);
  s[k]=Math.min(99,s[k]+gain); s.energy-=20;
  end(`${SK[k]} 훈련 +${gain}`);
}
function end(msg){
  s.week++;
  if(s.week%4==0)msg+='\n'+match();
  s.log=msg; save(); draw();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch{}}
function draw(){
  const over=s.week>MAX_WEEK;
  $('info').textContent=`${Math.min(s.week,MAX_WEEK)}/${MAX_WEEK}주 · ${tier()} · 종합 ${ovr()} · 💰${s.money} · 승 ${s.wins}`;
  $('stats').innerHTML=[...Object.keys(SK),'energy'].map(k=>{
    const v=s[k],n=k=='energy'?'피로도(에너지)':SK[k];
    return `${n} ${v}<div class=bar><i style="width:${v}%"></i></div>`}).join('');
  $('acts').innerHTML=Object.keys(SK).map(k=>`<button ${over||s.energy<20?'disabled':''} onclick="act('${k}')">${SK[k]} 훈련</button>`).join('');
  $('rest').disabled=over;
  $('log').textContent=over?`🏆 은퇴! 최종 등급: ${tier()} (종합 ${ovr()}, ${s.wins}승)`:s.log;
}
$('rest').onclick=()=>{s.energy=Math.min(100,s.energy+40);end('휴식 +40')};
$('reset').onclick=()=>{if(confirm('처음부터 다시?')){s=fresh();save();draw()}};
draw();
</script></body></html>
